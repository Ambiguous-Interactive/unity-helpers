[project]
name = "unity-helpers-scripts"
version = "0.0.0"
requires-python = ">=3.11.8"
dependencies = []

[dependency-groups]
browser = [
    "playwright>=1.64.1",
]
dev = [
    { include-group = "documentation" },
    { include-group = "metadata" },
    { include-group = "fixtures" },
    { include-group = "proof" },
    { include-group = "browser" },
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
documentation = [
    "markdown-it-py>=4.2.0",
]
fixtures = [
    "pillow>=13.0.0",
]
metadata = [
    "pyyaml>=6.0.3",
    "yamllint>=1.38.0",
]
proof = [
    "z3-solver==5.4.1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "A", "C4", "DTZ", "FA", "ISC",
    "ICN", "PIE", "PYI", "PT", "Q", "RET", "SIM", "TC", "ARG", "PTH", "RUF",
    "ANN", "S", "PERF",
]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S603"]
"test-*.py" = ["S101", "S603"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../typings"
strict = true
disallow_any_explicit = true
warn_unreachable = true

[tool.pyright]
stubPath = "../typings"
pythonVersion = "3.11"
typeCheckingMode = "strict"
extraPaths = ["../unity", "../wiki", "..", "."]
include = ["../readme_mirror.py", "../tests/test_readme_mirror.py", "../lint_doc_links.py", "../tests/test_doc_links.py", "../lint_tests.py", "../tests/test_lifecycle_lint.py", "../typecheck_iterate.py", "../tests/test_typecheck_iterate.py", "../extract_doc_samples.py", "../tests/test_doc_samples.py", "../lint_dependabot.py", "../tests/test_dependabot.py", "../lint_no_regions.py", "../tests/test_no_regions.py", "../lint_yaml.py", "../tests/test_yaml_lint.py", "../typings/yamllint/__init__.pyi", "../typings/yamllint/config.pyi", "../typings/yamllint/linter.pyi", "../tests/test_unity_timeout.py", "../lint_comment_block_form.py", "../tests/test_comment_block_form.py", "../extract_code_samples.py", "../tests/test_code_samples.py", "../validate_lint_error_codes.py", "../tests/test_lint_error_codes.py", "../check_eol.py", "../normalize_eol.py", "../tests/test_check_eol.py", "../tests/test_normalize_eol.py", "../lint_skill_sizes.py", "../tests/test_skill_sizes.py", "../unity/editmode_shards.py", "../tests/test_editmode_shards.py", "../lint_drawer_multiobject.py", "../tests/test_drawer_multiobject.py", "../lint_gitignore_docs.py", "../tests/test_gitignore_docs.py", "../lint_workflow_expression_length.py", "../tests/test_workflow_expression_length.py", "../lint_concurrent_cache_fill.py", "../tests/test_concurrent_cache_fill.py", "../lint_unity_test_modules.py", "../tests/test_unity_test_modules.py", "../lint_duplicate_usings.py", "../tests/test_duplicate_usings.py", "../lint_unity_file_naming.py", "../tests/test_unity_file_naming.py", "../doc_counts.py", "../tests/test_doc_counts.py", "../unity/desktop_worker.py", "../lint_odin_undo_safety.py", "../csharp_sources.py", "../lint_license_headers.py", "../lint_conditional_call_chains.py", "../tests/test_csharp_lints.py", "../unity/frozen_files.py", "../tests/test_frozen_files.py", "../check_registries.py", "../tests/test_check_registries.py", "../unity/run_ci_modes.py", "../tests/test_ci_modes.py", "../lint_production_test_hooks.py", "../tests/test_production_test_hooks.py", "../unity/report_slow_tests.py", "../tests/test_slow_tests.py", "../tests/test_random_quality_stream.py", "../tests/test_bounded_sampling.py", "../typings/z3/__init__.pyi", "../random-quality/verify-bounded-sampling.py", "../tests/test-unity-framework-evidence.py", "../../.devcontainer/agent-state.py", "../tests/test-devcontainer-persistence.py", "../benchmarks~/generate-jesse-parity.py", "../../.github/scripts/cancel-stuck-workflow.py", "../tests/test-watchdog-cancellation.py", "../tests/test_fixture_assets.py", "../fixture_assets.py", "../generate-test-sprites.py", "../generate-test-textures.py", "../unity/browser_consumer.py", "../unity/run-browser-consumer.py", "../tests/test_browser_consumer.py", "../lint_changelog.py", "../tests/test_changelog.py", "../lint_xml_doc_summaries.py", "../tests/test_xml_doc_summaries.py", "../cli_encoding.py", "../tests/test_unity_cli_maintenance.py", "../cspell_config.py", "../lint_cspell_config.py", "../add_cspell_word.py", "../tests/test_cspell_tools.py", "../lint_doc_identifiers.py", "../tests/test_doc_identifiers.py", "../lint_preserve_attributes.py", "../tests/test_preserve_attributes.py", "../check_runner.py", "../tests/test_check_runner.py", "../unity/runner_maintenance_matrix.py", "../tests/test_runner_maintenance_matrix.py", "../unity/create_unitypackage.py", "../unity/stage_unitypackage.py", "../tests/test_unitypackage.py", "check.py", "../generate_meta.py", "../tests/test_meta_generation.py", "../build-protobuf-candidate.py", "../verify-protobuf-shipped.py", "../tests/test-protobuf-candidate.py", "../unity/download-native-debugger.py", "../tests/test-native-debugger-download.py", "../lint_bundled_assemblies.py", "../tests/test_bundled_assemblies.py", "../lint_asmdef.py", "../tests/test_asmdef.py", "../pr_feedback.py", "../tests/test_pr_feedback.py", "../verify_shipped_analyzers.py", "../tests/test_verify_shipped_analyzers.py", "../lint_meta_files.py", "../tests/test_meta_lint.py", "../../.github/scripts/check_markdown_links.py", "../../.github/scripts/check_markdown_url_encoding.py", "../../.github/scripts/validate_markdown_links.py", "../tests/test_markdown_checks.py", "../wiki/generate_wiki_footer.py", "../wiki/generate_wiki_sidebar.py", "../wiki/prepare_wiki.py", "../wiki/transform_wiki_links.py", "../wiki/test_wiki_scripts.py"]

