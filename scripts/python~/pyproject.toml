[project]
name = "unity-helpers-scripts"
version = "0.0.0"
requires-python = ">=3.11.8"
dependencies = []

[dependency-groups]
dev = [
    { include-group = "metadata" },
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
metadata = ["pyyaml>=6.0.3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "A", "C4", "DTZ", "FA", "ISC",
    "ICN", "PIE", "PYI", "PT", "Q", "RET", "SIM", "TC", "ARG", "PTH", "RUF",
    "ANN", "S", "PERF",
]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S603"]
"test-*.py" = ["S101", "S603"]

[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
extraPaths = ["../unity", "../wiki", "..", "."]
include = ["../tests/test_unity_cli_maintenance.py", "../cspell_config.py", "../lint_cspell_config.py", "../add_cspell_word.py", "../tests/test_cspell_tools.py", "../lint_doc_identifiers.py", "../tests/test_doc_identifiers.py", "../lint_preserve_attributes.py", "../tests/test_preserve_attributes.py", "../check_runner.py", "../tests/test_check_runner.py", "../unity/runner_maintenance_matrix.py", "../tests/test_runner_maintenance_matrix.py", "../unity/create_unitypackage.py", "../unity/stage_unitypackage.py", "../tests/test_unitypackage.py", "check.py", "../generate_meta.py", "../tests/test_meta_generation.py", "../build-protobuf-candidate.py", "../verify-protobuf-shipped.py", "../tests/test-protobuf-candidate.py", "../unity/download-native-debugger.py", "../tests/test-native-debugger-download.py", "../lint_bundled_assemblies.py", "../tests/test_bundled_assemblies.py", "../lint_asmdef.py", "../tests/test_asmdef.py", "../pr_feedback.py", "../tests/test_pr_feedback.py", "../verify_shipped_analyzers.py", "../tests/test_verify_shipped_analyzers.py", "../lint_meta_files.py", "../tests/test_meta_lint.py", "../../.github/scripts/check_markdown_links.py", "../../.github/scripts/check_markdown_url_encoding.py", "../../.github/scripts/validate_markdown_links.py", "../tests/test_markdown_checks.py", "../wiki/generate_wiki_footer.py", "../wiki/generate_wiki_sidebar.py", "../wiki/prepare_wiki.py", "../wiki/transform_wiki_links.py", "../wiki/test_wiki_scripts.py"]

[tool.unity-helpers-python]
legacy = [
    ".devcontainer/agent-state.py",
    ".github/scripts/cancel-stuck-workflow.py",
    "scripts/benchmarks~/generate-jesse-parity.py",
    "scripts/generate-test-sprites.py",
    "scripts/generate-test-textures.py",
    "scripts/random-quality/verify-bounded-sampling.py",
    "scripts/tests/test-browser-consumer.py",
    "scripts/tests/test-devcontainer-persistence.py",
    "scripts/tests/test-unity-framework-evidence.py",
    "scripts/tests/test-watchdog-cancellation.py",
    "scripts/unity/run-browser-consumer.py",
]
