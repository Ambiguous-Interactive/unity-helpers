name: Local Gates

# Two gates that once ran only on a developer's machine.
#
# `validate:tests` composes the fast contract suite with exhaustive synthetic hook regressions.
# Developer `validate:prepush` is intentionally a fast last-resort safety check;
# `validate:local` retains the old complete developer aggregate, and this job remains the
# authoritative unconditional home for both test subsets. Before this job existed, `--no-verify`, a squash merge
# from the web UI, or a push from another environment could leave a pull request fully green with a
# broken suite -- which happened in PR #334. `typecheck:unity` compiles the real Runtime sources with
# the shipped analyzer loaded and likewise had no workflow coverage.
#
# Neither needs Unity or a license.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-suites:
    name: Contract Suites
    runs-on: ubuntu-latest
    steps:
      # Checked out into a subdirectory, like pwsh-invocations-lint.yml, because one suite in the
      # chain compares this repository's cleanup classifier against the central policy repository
      # and needs both trees side by side.
      # fetch-depth 0 because one suite -- the license-year copy-detection gate -- dates files
      # from the repository's own history. actions/checkout defaults to depth 1, where `git log`
      # sees a single commit, every file resolves to the year of that commit, and the gate skips
      # itself rather than measuring anything.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: unity-helpers
          fetch-depth: 0
          persist-credentials: false

      # Read the pin out of the workflows rather than restating it. Dependabot bumps a `uses:` SHA
      # but never a `ref:` input, so a hand-copied commit checks out the previous policy and the
      # parity suite then passes against the wrong version.
      - name: Resolve pinned central cleanup policy commit
        id: policy_pin
        working-directory: unity-helpers
        shell: bash
        run: |
          sha="$(node scripts/resolve-build-lock-pin.js require-confirmed-unity-cleanup)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      # Full history, because the build-lock actions are NOT all pinned to one commit and
      # validate:build-lock-action-inputs reads each one's `action.yml` at its own pin. A default
      # depth-1 checkout has only `ref`, so every other pin fails to resolve -- loudly, with the
      # remedy named, but the gate cannot run.
      #
      # No token is needed: the policy repository is PUBLIC. That is what lets this job run on a
      # Dependabot pull request, whose GITHUB_TOKEN is read-only and scoped to this repository --
      # and a Dependabot pull request is the one place a build-lock bump can be caught before it
      # merges, because every licensed Unity leg is skipped there for want of secrets.
      - name: Checkout immutable central cleanup policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Ambiguous-Interactive/ambiguous-organization-build-lock
          ref: ${{ steps.policy_pin.outputs.sha }}
          path: build-lock-policy
          fetch-depth: 0
          persist-credentials: false

      # package-lock.json is GITIGNORED here, so the cached path is the exception rather than the
      # rule and `cache: npm` on its own fails the job outright with "Dependencies lock file is not
      # found". Same shape as validate-formatting.yml, for the same reason.
      - name: Setup Node.js (cached)
        if: ${{ hashFiles('unity-helpers/package-lock.json') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: unity-helpers/package-lock.json

      - name: Setup Node.js (no cache)
        if: ${{ hashFiles('unity-helpers/package-lock.json') == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "9.0.306"

      - name: Install dependencies
        working-directory: unity-helpers
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i --no-audit --no-fund
          fi

      # The pre-commit integration suite drives scripts/format-staged-csharp.ps1, which shells out to
      # CSharpier. Without the restore it would exercise a missing tool rather than the binding.
      - name: Restore .NET tools
        working-directory: unity-helpers
        run: dotnet tool restore

      # The suite's own exit code decides, never a grep of its output: at least one script in this
      # repository once reported success while checking zero files, and a suite that silently does
      # nothing has to stay distinguishable from one that passes. The cleanup-classifier suite is
      # built that way on purpose -- it FAILS under Actions when the policy checkout is missing,
      # rather than skipping, which is how this job discovered it needed one.
      # This suite also stages the release .unitypackage payload under Assets and verifies that its
      # runtime asmdef keeps the same default-on serialization path as a Package Manager install.
      - name: Run contract suites
        working-directory: unity-helpers
        env:
          BUILD_LOCK_POLICY_ROOT: ${{ github.workspace }}/build-lock-policy
        run: npm run validate:tests

  typecheck-phases:
    name: Type-check (${{ matrix.phase }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [sources, controls]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "9.0.306"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-typecheck-${{ matrix.phase }}-${{
            hashFiles('Generator~/**/*.csproj', 'Generator~/**/*.props', 'Generator~/**/*.targets', '**/NuGet.Config', '**/nuget.config') }}

      # Separate checkouts keep control-injected build outputs away from ordinary builds.
      # Both commands remain whole: every source variant and every negative control still runs.
      - name: Type-check the runtime and test sources
        if: matrix.phase == 'sources'
        run: npm run typecheck:unity

      # A type-check reports a defect by FAILING, so a gate that has lost an analyzer, a source
      # root or a severity prints exactly what a clean tree prints. This injects a known
      # WPROTO001, WUH003 and CS0246 into each of the five check projects and asserts each build
      # names them, which is what makes the green run above evidence (#636).
      - name: Prove each type-check gate can still fail
        if: matrix.phase == 'controls'
        run: npm run typecheck:controls

  typecheck:
    name: Type-check Runtime and tests
    needs: typecheck-phases
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both type-check phases
        env:
          TYPECHECK_PHASE_RESULT: ${{ needs.typecheck-phases.result }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'process.exit(process.env.TYPECHECK_PHASE_RESULT === "success" ? 0 : 1)'
