name: Local Gates

# Two gates that once ran only on a developer's machine.
#
# `validate:tests` composes the fast contract suite with exhaustive synthetic hook regressions.
# Developer `validate:prepush` is intentionally a fast last-resort safety check;
# `validate:local` retains the old complete developer aggregate, and this job remains the
# authoritative entry point for both test subsets (affected PR checks; full main checks). Before this gate existed, `--no-verify`, a squash merge
# from the web UI, or a push from another environment could leave a pull request fully green with a
# broken suite -- which happened in PR #334. `typecheck:unity` compiles the real Runtime sources with
# the shipped analyzer loaded and likewise had no workflow coverage.
#
# Neither needs Unity or a license.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-suites:
    name: Contract Suites (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # The cleanup classifier contract compares this repository against the central policy
      # repository and needs both trees side by side.
      # fetch-depth 0 because one suite -- the license-year copy-detection gate -- dates files
      # from the repository's own history. actions/checkout defaults to depth 1, where `git log`
      # sees a single commit, every file resolves to the year of that commit, and the gate skips
      # itself rather than measuring anything.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: unity-helpers
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: unity-helpers/scripts/python~/uv.lock

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.8

      # Read the pin out of the workflows rather than restating it. Dependabot bumps a `uses:` SHA
      # but never a `ref:` input, so a hand-copied commit checks out the previous policy and the
      # parity suite then passes against the wrong version.
      - name: Resolve pinned central cleanup policy commit
        id: policy_pin
        working-directory: unity-helpers
        shell: bash
        run: |
          set -euo pipefail
          sha="$(uv run --quiet --project scripts/python~ --locked --no-dev --group metadata python scripts/build_lock_inputs.py --resolve require-confirmed-unity-cleanup)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      # Full history, because the build-lock actions are NOT all pinned to one commit and
      # validate:build-lock-action-inputs reads each one's `action.yml` at its own pin. A default
      # depth-1 checkout has only `ref`, so every other pin fails to resolve -- loudly, with the
      # remedy named, but the gate cannot run.
      #
      # No token is needed: the policy repository is PUBLIC. That is what lets this job run on a
      # Dependabot pull request, whose GITHUB_TOKEN is read-only and scoped to this repository --
      # and a Dependabot pull request is the one place a build-lock bump can be caught before it
      # merges, because every licensed Unity leg is skipped there for want of secrets.
      - name: Checkout immutable central cleanup policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Ambiguous-Interactive/ambiguous-organization-build-lock
          ref: ${{ steps.policy_pin.outputs.sha }}
          path: build-lock-policy
          fetch-depth: 0
          persist-credentials: false

      - name: Require centrally approved build-lock action pins
        working-directory: unity-helpers
        env:
          BUILD_LOCK_POLICY_ROOT: ${{ github.workspace }}/build-lock-policy
        run: uv run --project scripts/python~ --locked --no-dev --group metadata python scripts/build_lock_inputs.py --approved

      # package-lock.json is GITIGNORED here, so the cached path is the exception rather than the
      # rule and `cache: npm` on its own fails the job outright with "Dependencies lock file is not
      # found". Same shape as validate-formatting.yml, for the same reason.
      - name: Setup Node.js (cached)
        if: ${{ hashFiles('unity-helpers/package-lock.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: unity-helpers/package-lock.json

      - name: Setup Node.js (no cache)
        if: ${{ hashFiles('unity-helpers/package-lock.json') == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/unity-helpers-dotnet
        with:
          dotnet-version: "9.0.320"

      - name: Require the installed .NET SDK
        shell: bash
        env:
          EXPECTED_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          selected_sdk="$(dotnet --version)"
          printf 'Selected .NET SDK: %s\n' "$selected_sdk"
          test "$selected_sdk" = "${EXPECTED_DOTNET_SDK:?Missing installed SDK version}"

      - name: Install dependencies
        working-directory: unity-helpers
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i --no-audit --no-fund
          fi

      - name: Validate migrated Python scripts
        if: matrix.shard == 0
        working-directory: unity-helpers
        run: npm run lint:python

      - name: Select GNU timeout for process-group controls
        shell: bash
        run: |
          set -euo pipefail
          timeout_version="$(timeout --version)"
          if [[ "$timeout_version" != *"(GNU coreutils)"* ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gnu-coreutils
            gnu_timeout="$(command -v gnutimeout)"
            gnu_tools="$RUNNER_TEMP/unity-helpers-gnu-tools"
            mkdir -p "$gnu_tools"
            ln -s "$gnu_timeout" "$gnu_tools/timeout"
            printf '%s\n' "$gnu_tools" >> "$GITHUB_PATH"
            "$gnu_tools/timeout" --version
          else
            printf '%s\n' "$timeout_version"
          fi

      - name: Run bounded-random arithmetic proof
        if: matrix.shard == 0
        working-directory: unity-helpers
        run: |
          set -euo pipefail
          timeout 2m uv run --project scripts/python~ --locked --no-dev --group proof python scripts/random-quality/verify-bounded-sampling.py

      - name: Setup .NET for CSharpier
        id: formatter-dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/unity-helpers-dotnet
        with:
          dotnet-version: "10.0.403"

      - name: Require the installed CSharpier SDK
        shell: bash
        env:
          EXPECTED_DOTNET_SDK: ${{ steps.formatter-dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          selected_sdk="$(dotnet --version)"
          printf 'Selected CSharpier SDK: %s\n' "$selected_sdk"
          test "$selected_sdk" = "${EXPECTED_DOTNET_SDK:?Missing installed CSharpier SDK version}"

      # The pre-commit integration suite drives scripts/format-staged-csharp.ps1, which shells out to
      # CSharpier. Without the restore it would exercise a missing tool rather than the binding.
      - name: Restore .NET tools
        working-directory: unity-helpers
        run: dotnet tool restore

      # The suite's own exit code decides, never a grep of its output: at least one script in this
      # repository once reported success while checking zero files, and a suite that silently does
      # nothing has to stay distinguishable from one that passes. The cleanup-classifier suite is
      # built that way on purpose -- it FAILS under Actions when the policy checkout is missing,
      # rather than skipping, which is how this job discovered it needed one.
      # This suite also stages the release .unitypackage payload under Assets and verifies that its
      # runtime asmdef keeps the same default-on serialization path as a Package Manager install.
      - name: Record task selection and native coverage proposal
        if: matrix.shard == 0
        working-directory: unity-helpers
        env:
          AGENT_CHECK_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: uv run --quiet --project scripts/python~ --locked --no-dev python scripts/agent_check.py --tier pr --base "$AGENT_CHECK_BASE" --plan --json

      - name: Run contract suites
        working-directory: unity-helpers
        env:
          BUILD_LOCK_POLICY_ROOT: ${{ github.workspace }}/build-lock-policy
          AGENT_CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRACT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run validate:tests -- --ci --shard "$CONTRACT_SHARD"

      - name: Record completed shard
        working-directory: unity-helpers
        env:
          SHARD: ${{ matrix.shard }}
        run: git rev-parse HEAD > "$RUNNER_TEMP/contract-shard-$SHARD.txt"

      - name: Retain completed shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contract-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/contract-shard-${{ matrix.shard }}.txt
          if-no-files-found: error
          overwrite: true

  contract-suites-success:
    name: Contract Suites
    runs-on: ubuntu-latest
    needs: contract-suites
    if: ${{ always() }}
    steps:
      # Require positive evidence even if Actions misreports an abandoned matrix job.
      - name: Download shard receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: contract-shard-*
          path: ${{ runner.temp }}/contract-shards
          merge-multiple: true

      - name: Require every contract shard to pass
        env:
          SHARDS_RESULT: ${{ needs.contract-suites.result }}
          SHARD_RECEIPTS: ${{ runner.temp }}/contract-shards
        run: |
          set -euo pipefail
          if [[ "$SHARDS_RESULT" != success ]]; then
            printf '::error::Contract shard jobs finished with result %s.\n' "$SHARDS_RESULT"
            exit 1
          fi
          for shard in 0 1 2 3; do
            receipt="$SHARD_RECEIPTS/contract-shard-$shard.txt"
            if [[ ! -f "$receipt" || "$(<"$receipt")" != "$GITHUB_SHA" ]]; then
              printf '::error::Missing or invalid completion receipt for contract shard %s.\n' "$shard"
              exit 1
            fi
          done

  typecheck-phases:
    name: Type-check (${{ matrix.phase }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [sources, controls]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/unity-helpers-dotnet
        with:
          dotnet-version: "9.0.320"

      - name: Require the installed .NET SDK
        shell: bash
        env:
          EXPECTED_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          selected_sdk="$(dotnet --version)"
          printf 'Selected .NET SDK: %s\n' "$selected_sdk"
          test "$selected_sdk" = "${EXPECTED_DOTNET_SDK:?Missing installed SDK version}"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-typecheck-${{ matrix.phase }}-${{
            hashFiles('Generator~/**/*.csproj', 'Generator~/**/*.props', 'Generator~/**/*.targets', '**/NuGet.Config', '**/nuget.config') }}

      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tools

      # Separate checkouts keep control-injected build outputs away from ordinary builds.
      # Both commands remain whole: every source variant and every negative control still runs.
      - name: Type-check the runtime and test sources
        if: matrix.phase == 'sources'
        run: npm run typecheck:unity

      - name: Verify value enumeration and allocation controls
        if: matrix.phase == 'sources'
        shell: bash
        run: npm run test:enumeration

      - name: Verify scene canonicalization and reference identity
        if: matrix.phase == 'sources'
        run: npm run test:stable-assets

      - name: Run integer-map correctness without Unity
        if: matrix.phase == 'sources'
        run: npm run test:intmap

      # A type-check reports a defect by FAILING, so a gate that has lost an analyzer, a source
      # root or a severity prints exactly what a clean tree prints. This injects a known
      # WPROTO001, WUH003 and CS0246 into each of the five check projects and asserts each build
      # names them, which is what makes the green run above evidence (#636).
      # Parallel SDK startup hit a missing NuGet-Migrations shared-memory directory before compilation.
      # Keep local two-worker iteration while avoiding competing SDK launches in this job.
      - name: Prove each type-check gate can still fail
        if: matrix.phase == 'controls'
        run: npm run typecheck:controls -- --jobs=1

  typecheck:
    name: Type-check Runtime and tests
    needs: typecheck-phases
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both type-check phases
        env:
          TYPECHECK_PHASE_RESULT: ${{ needs.typecheck-phases.result }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'process.exit(process.env.TYPECHECK_PHASE_RESULT === "success" ? 0 : 1)'

  windows-tool-phases:
    name: Windows tools (${{ matrix.phase }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        phase: [metadata, orchestration]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json

      - name: Install Node tools
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --ignore-scripts --no-audit --no-fund
          } else {
            npm install --ignore-scripts --no-audit --no-fund
          }

      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tools

      - name: Check strict Python policies on Windows
        if: matrix.phase == 'metadata'
        shell: pwsh
        run: uv run --project scripts/python~ --locked python scripts/python~/check.py

      - name: Verify assembly discovery on Windows
        if: matrix.phase == 'metadata'
        shell: pwsh
        run: uv run --project scripts/python~ --locked pytest scripts/tests/test_asmdef.py -q

      - name: Verify workspace and log adapters on Windows
        if: matrix.phase == 'metadata'
        shell: pwsh
        run: >-
          uv run --project scripts/python~ --locked pytest
          scripts/tests/test_project_workspace.py scripts/tests/test_log_patterns.py
          -q --durations=20

      - name: Verify metadata validation on Windows
        if: matrix.phase == 'metadata'
        shell: pwsh
        # Keep each test file in one worker. A worker crash fails the check.
        run: >-
          uv run --project scripts/python~ --locked --group parallel-tests
          pytest -n 2 --dist loadfile --max-worker-restart=0
          scripts/tests/test_agent_check.py scripts/tests/test_release_tag.py scripts/tests/test_release_tools.py
          scripts/tests/test_npm_package.py scripts/tests/test_release_automation.py
          scripts/tests/test_version_sync.py scripts/tests/test_hook_validation.py
          scripts/tests/test_push_validation.py scripts/tests/test_push_defaults.py
          scripts/tests/test_hook_permissions.py scripts/tests/test_github_pages_css.py scripts/tests/test_devcontainer_config.py
          scripts/tests/test_verify_devcontainer_tools.py
          scripts/tests/test_devcontainer_urls.py scripts/tests/test_mcp_config.py scripts/tests/test_meta_lint.py scripts/tests/test_markdown_checks.py
          scripts/tests/test_runner_maintenance_matrix.py scripts/tests/test_check_runner.py
          scripts/tests/test_preserve_attributes.py scripts/tests/test_doc_identifiers.py
          scripts/tests/test_cspell_tools.py scripts/tests/test_unity_cli_maintenance.py
          scripts/tests/test_xml_doc_summaries.py scripts/tests/test_changelog.py
          scripts/tests/test_fixture_assets.py
          scripts/tests/test_slow_tests.py scripts/tests/test_production_test_hooks.py
          scripts/tests/test_editmode_shards.py
          scripts/tests/test_frozen_files.py scripts/tests/test_doc_counts.py
          scripts/tests/test_duplicate_usings.py scripts/tests/test_unity_test_modules.py
          scripts/tests/test_concurrent_cache_fill.py
          scripts/tests/test_workflow_expression_length.py
          scripts/tests/test_validate_formatting.py
          scripts/tests/test_gitignore_docs.py scripts/tests/test_drawer_multiobject.py
          scripts/tests/test_check_eol.py scripts/tests/test_normalize_eol.py scripts/tests/test_lint_error_codes.py
          scripts/tests/test_code_samples.py
          scripts/tests/test_skill_sizes.py scripts/tests/test_comment_block_form.py
          scripts/tests/test_doc_links.py
          scripts/tests/test_lifecycle_lint.py scripts/tests/test_yaml_lint.py scripts/tests/test_no_regions.py scripts/tests/test_dependabot.py scripts/tests/test_doc_samples.py
          -vv --durations=20

      - name: Verify compiler payload publication on Windows
        if: matrix.phase == 'metadata'
        shell: pwsh
        run: >-
          uv run --project scripts/python~ --locked pytest
          scripts/tests/test_verify_shipped_analyzers.py -q
          -k "not project_copy_configuration and not debug_payload_copy"

      - name: Verify process orchestration on Windows
        if: matrix.phase == 'orchestration'
        shell: pwsh
        run: >-
          uv run --project scripts/python~ --locked pytest
          scripts/tests/test_ci_modes.py scripts/tests/test_browser_consumer.py
          scripts/tests/test_native_build_selection.py scripts/tests/test_compatibility_renderer.py scripts/tests/test_unity_matrix_resolver.py
          scripts/tests/test_pwsh_invocation_asts.py
          -vv --durations=20

      - name: Verify Unity result publication on Windows
        if: matrix.phase == 'orchestration'
        shell: pwsh
        run: npm run test:unity-test-filter

      - name: Verify loaded framework evidence on Windows
        if: matrix.phase == 'orchestration'
        shell: pwsh
        run: >-
          uv run --project scripts/python~ --locked pytest scripts/tests/test-unity-framework-evidence.py -q
          -k "archive_cannot_register or identical_bytes_cannot_replace or persistent_changes_after_python_verification"

      - name: Verify nullable consumer player manifests on Windows
        if: matrix.phase == 'orchestration'
        shell: pwsh
        run: npm run test:il2cpp-conversion-inputs

      - name: Setup .NET for CSharpier on Windows
        if: matrix.phase == 'orchestration'
        id: windows-formatter-dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/unity-helpers-dotnet
        with:
          dotnet-version: "10.0.403"

      - name: Require the installed CSharpier SDK on Windows
        if: matrix.phase == 'orchestration'
        shell: bash
        env:
          EXPECTED_DOTNET_SDK: ${{ steps.windows-formatter-dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          selected_sdk="$(dotnet --version | tr -d '\r')"
          printf 'Selected CSharpier SDK: %s\n' "$selected_sdk"
          test "$selected_sdk" = "${EXPECTED_DOTNET_SDK:?Missing installed CSharpier SDK version}"

      - name: Verify C# formatting on Windows
        if: matrix.phase == 'orchestration'
        shell: pwsh
        run: npm run format:csharp:check

  assembly-tools-windows:
    name: Assembly tools (Windows)
    needs: windows-tool-phases
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require both Windows tool phases
        env:
          WINDOWS_PHASE_RESULT: ${{ needs.windows-tool-phases.result }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'process.exit(process.env.WINDOWS_PHASE_RESULT === "success" ? 0 : 1)'
