name: Unity Benchmarks

on:
  schedule:
    - cron: "29 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark-retirement:
    name: Benchmarks awaiting enrolled licensed coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the fail-closed benchmark state
        run: |
          notice="Paid benchmark matrices are retired while canonical Unity validation is consolidated under the organization lifecycle."
          notice+=" Restore them only with their own audited return, fallback, and aggregate contract."
          echo "::notice::${notice}"
          exit 1
