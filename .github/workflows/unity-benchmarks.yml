name: Unity Benchmarks

# cspell:ignore lfs WSL

on:
  schedule:
    - cron: "29 10 * * 3"
  workflow_dispatch:
    inputs:
      unity-version:
        description: "Pin a single Unity version. Empty = full matrix."
        required: false
        default: ""
        type: string

# Top-level permissions are least-privilege and mirror unity-tests.yml. The
# licensed matrix jobs (matrix-config, runner-preflight, benchmarks) only need
# read access plus checks:write for NUnit annotations and issues:write for
# benchmark-failure notifications; they must NOT inherit write scope. The
# dedicated commit-perf-results job below opts into contents:write at the JOB
# level so it (and only it) can push the refreshed perf artifacts.
permissions:
  contents: read
  checks: write
  issues: write

jobs:
  matrix-config:
    name: Resolve benchmark matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      unity-versions: ${{ steps.resolve.outputs.unity-versions }}
      latest-version: ${{ steps.resolve.outputs.latest-version }}
      matrix-include: ${{ steps.resolve.outputs.matrix-include }}
      expected-result-count: ${{ steps.resolve.outputs.expected-result-count }}
      expected-result-files: ${{ steps.resolve.outputs.expected-result-files }}
      allow-baseline-refresh: ${{ steps.resolve.outputs.allow-baseline-refresh }}
      has-required-secrets: ${{ steps.check-secrets.outputs.has-secrets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node.js for assembly discovery
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Resolve dispatch overrides
        id: resolve
        env:
          INPUT_UNITY_VERSION: ${{ inputs.unity-version }}
        # The benchmark matrix list and the latest entry both come from the
        # canonical source (.github/unity-versions.json), so the scheduled perf
        # coverage tracks every supported runtime and the latest-vs-list pair
        # cannot drift. The LAST entry is the latest Unity version. A dispatch
        # override pins a single version.
        run: |
          set -euo pipefail
          if [ -n "${INPUT_UNITY_VERSION:-}" ]; then
            versions="[\"${INPUT_UNITY_VERSION}\"]"
            latest="${INPUT_UNITY_VERSION}"
          else
            versions="$(jq -c '.all' .github/unity-versions.json)"
            latest="$(jq -r '.all[-1]' .github/unity-versions.json)"
          fi
          matrix_include="$(VERSIONS="${versions}" node <<'NODE'
          const discovery = require("./scripts/unity/lib/asmdef-discovery.js");
          const versions = JSON.parse(process.env.VERSIONS);
          const performanceAssembly = "WallstopStudios.UnityHelpers.Tests.Runtime.Performance";
          const randomAssembly = "WallstopStudios.UnityHelpers.Tests.Runtime.Random";

          // PlayMode only. Both benchmark assemblies are platform-neutral, and Unity's EditMode
          // runner takes only assemblies flagged EditorAssembly -- so the four editmode legs
          // were handed two assembly names, ran zero tests, and failed "Verify tests actually
          // ran" on every scheduled run. Measured: the 2021.3.45f1 editmode leg's log mentions
          // Tests.Runtime.Random three times (the echoed list) against 2,375 in playmode
          // (#570). The thorough Random sweep the editmode leg was configured for moves here,
          // which is the only mode that can execute it.
          function benchmarkProfile(target) {
            const discovered = discovery.defaultIncludeAssemblies(process.cwd(), {
              includePerf: true,
              target
            });
            for (const required of [performanceAssembly, randomAssembly]) {
              if (!discovered.includes(required)) {
                throw new Error(`The ${target} benchmark profile did not discover ${required}.`);
              }
            }
            return [performanceAssembly, randomAssembly].join(";");
          }

          const profiles = {
            playmode: benchmarkProfile("playmode")
          };
          const include = [];
          for (const version of versions) {
            for (const mode of ["playmode"]) {
              include.push({
                "unity-version": version,
                "test-mode": mode,
                assemblies: profiles[mode],
                "result-file": `results-${version}-${mode}.xml`
              });
            }
          }
          process.stdout.write(JSON.stringify(include));
          NODE
          )"
          {
            echo "unity-versions=${versions}"
            echo "latest-version=${latest}"
            echo "matrix-include=${matrix_include}"
            echo "expected-result-count=$(jq 'length' <<< "${matrix_include}")"
            echo "expected-result-files=$(jq -c 'map(."result-file") | sort' <<< "${matrix_include}")"
            if [ -z "${INPUT_UNITY_VERSION:-}" ]; then
              echo "allow-baseline-refresh=true"
            else
              echo "allow-baseline-refresh=false"
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Check for required licensed workflow secrets
        id: check-secrets
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${UNITY_SERIAL:-}" ] && \
             [ -n "${UNITY_EMAIL:-}" ] && \
             [ -n "${UNITY_PASSWORD:-}" ] && \
             [ -n "${BUILD_LOCK_APP_ID:-}" ] && \
             [ -n "${BUILD_LOCK_APP_PRIVATE_KEY:-}" ]; then
            echo "has-secrets=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has-secrets=false" >> "${GITHUB_OUTPUT}"
          fi

  runner-preflight:
    name: Self-hosted runner access preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require an online Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@300501e91c9bec81bb9b5a977c22aa5bb2d9b649 # v1.13.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  benchmarks:
    name: Benchmarks ${{ matrix.unity-version }} ${{ matrix.test-mode }}
    needs:
      - matrix-config
      - runner-preflight
    # Skip the self-hosted matrix entirely when license/lock secrets are absent,
    # so a secret-less repo does not queue forever on a nonexistent runner.
    if: >-
      ${{
        needs.matrix-config.outputs.has-required-secrets == 'true'
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1200
    strategy:
      fail-fast: false
      # No max-parallel, kept in sync with .github/workflows/unity-tests.yml, where
      # the measurement behind it is recorded: capping eligibility to the runner
      # count makes every completion a fresh self-hosted dispatch transition, and
      # that transition is what leaves both runners idle with legs queued.
      matrix:
        include: ${{ fromJSON(needs.matrix-config.outputs.matrix-include) }}
    steps:
      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        with:
          persist-credentials: false

      - name: Maintain Unity editor on selected runner
        timeout-minutes: 360
        shell: powershell
        run: |
          $artifactsPath = '.artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}'
          $maintenanceDiagnosticsRoot = Join-Path $artifactsPath 'provisioning/runner-maintenance'
          New-Item -ItemType Directory -Force -Path $maintenanceDiagnosticsRoot | Out-Null
          $provisioningProfile = 'EditorOnly'
          $maintenanceScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\unity\maintain-windows-runner.ps1'
          if (-not (Test-Path -LiteralPath $maintenanceScript -PathType Leaf)) {
            throw "Runner maintenance script not found: $maintenanceScript"
          }
          . $maintenanceScript
          $maintenanceExitCode = Invoke-WindowsRunnerMaintenance `
            -UnityVersions '${{ matrix.unity-version }}' `
            -ProvisioningProfile $provisioningProfile `
            -DiagnosticsRoot $maintenanceDiagnosticsRoot
          if ($maintenanceExitCode -ne 0) {
            throw "Runner maintenance failed with exit code $maintenanceExitCode."
          }
          $pwshCandidates = @(
            (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7\pwsh.exe' })
          )
          $pathPwsh = Get-Command pwsh -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if ($pathPwsh -and $pathPwsh -notlike '*\Microsoft\WindowsApps\pwsh.exe') {
            $pwshCandidates += $pathPwsh
          }
          $pwshCandidates = @(
            $pwshCandidates |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique
          )
          $pwshPath = @($pwshCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })[0]
          if (-not $pwshPath) {
            throw 'PowerShell 7 maintenance completed, but pwsh.exe was not found for later GitHub Actions steps.'
          }
          $pwshDirectory = Split-Path -Parent $pwshPath
          $pwshDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Added PowerShell 7 to GITHUB_PATH: $pwshDirectory"

      - name: Print runner diagnostics
        # Never use plain `shell: bash` on self-hosted Windows runners (the WSL
        # stub at C:\Windows\System32\bash.exe can win PATH resolution and fail).
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "default (organization lock wraps the Unity section)"

      - name: Validate Unity license secrets
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Provision Unity Editor
        timeout-minutes: 180
        shell: pwsh
        run: |
          $artifactsPath = '.artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}'
          $diagnosticsPath = Join-Path $artifactsPath 'provisioning'
          $diagnosticsFile = Join-Path $diagnosticsPath 'ensure-editor-summary.json'
          New-Item -ItemType Directory -Force -Path $diagnosticsPath | Out-Null
          $editor = ./scripts/unity/ensure-editor.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -CiManagedOnly `
            -RequireHealthyExisting `
            -ProvisioningProfile EditorOnly `
            -DiagnosticsPath $diagnosticsFile
          "UNITY_EDITOR_PATH=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unity provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-benchmark-provisioning-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: .artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}/provisioning
          if-no-files-found: warn
          retention-days: 90

      - name: Acquire organization Unity lock
        id: unity_lock
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@300501e91c9bec81bb9b5a977c22aa5bb2d9b649 # v1.13.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Run Unity Test Runner
        id: run_tests
        timeout-minutes: 120
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          # This leg also owns the thorough Random sweep. Selecting both its
          # assembly and Fast category folds that sweep into this one Unity
          # launch while the explicit assembly list prevents unrelated Fast
          # tests from entering the benchmark lane.
          UH_BENCHMARK_ASSEMBLIES: ${{ matrix.assemblies }}
          UH_UNITY_TEST_CATEGORY: "Performance;Stress;Fast"
          UH_RANDOM_SAMPLE_COUNT: "12750000"
          UH_RANDOM_NOISE_MAP_ITERATIONS: "1000"
          # The combined pass previously had two independent 80-minute watchdog
          # budgets. Keep deliberate combined headroom while leaving ten minutes
          # for cleanup before this step's 120-minute hard limit.
          UH_EDITOR_TEST_TIMEOUT_SECONDS: "6600"
          UH_PERF_COMMIT: ${{ github.sha }}
        run: |
          # Release (not Debug) code optimization for the editmode/playmode perf
          # legs, mirroring the repo-wide Unity Release-mode contract so the
          # weekly coverage run measures the same optimized hot path the docs do.
          # Same persistent project root as unity-tests.yml but a SEPARATE per-leg
          # directory. These legs deliberately omit -IncludeIntegrations, so their
          # ephemeral manifest and compiled assembly set differ from the test legs'.
          # Sharing a directory would make the two workflows rewrite the manifest
          # over each other, re-resolving packages and recompiling on every
          # alternation -- and this is the lane that MEASURES performance, so that
          # churn would land directly in the numbers. See unity-tests.yml for why
          # the project cannot live under .artifacts/ at all.
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode '${{ matrix.test-mode }}' `
            -AssemblyNames $env:UH_BENCHMARK_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -ProjectScope 'benchmarks' `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/return-unity-license
        with:
          prior-return-log-path: ${{ runner.temp }}/unity-return-${{ matrix.unity-version }}-${{ matrix.test-mode }}.log
          prior-command-succeeded: ${{ steps.run_tests.outcome == 'success' }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: ${{ always() && (steps.unity_lock.outcome == 'success' || steps.unity_lock.outcome == 'failure' || steps.unity_lock.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@300501e91c9bec81bb9b5a977c22aa5bb2d9b649 # v1.13.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.return_unity_license.outputs.resource-health }}
          resource-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@300501e91c9bec81bb9b5a977c22aa5bb2d9b649
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.return_unity_license.outputs.classification-complete }}
          cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.return_unity_license.outputs.resource-health }}
          cleanup-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

      - name: Delete private Unity cleanup evidence
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        shell: pwsh
        env:
          RETURN_LOG_PATH: ${{ steps.return_unity_license.outputs.return-log-path }}
          SUPPLEMENTAL_EVIDENCE_PATHS: ${{ steps.return_unity_license.outputs.supplemental-evidence-paths }}
        run: |
          $evidencePaths = @($env:RETURN_LOG_PATH) + @($env:SUPPLEMENTAL_EVIDENCE_PATHS -split "`r?`n")
          foreach ($evidencePath in @($evidencePaths | Sort-Object -Unique)) {
            if (-not [string]::IsNullOrWhiteSpace($evidencePath) -and (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Remove-Item -LiteralPath $evidencePath -Force
            }
          }

      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Benchmarks ${{ matrix.unity-version }} ${{ matrix.test-mode }}

      - name: Verify tests actually ran
        if: >-
          ${{
            !cancelled() &&
            steps.run_tests.outcome != 'skipped'
          }}
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Benchmarks ${{ matrix.unity-version }} ${{ matrix.test-mode }}
          expected-empty: false

      # Stage the raw NUnit results for this leg into a deterministic path so
      # the downstream commit job can collect every leg's results via
      # download-artifact and commit them under perf-results/. We commit
      # the raw results.xml (the source of truth) rather than a hand-formatted
      # doc; unity-helpers has no NUnit->markdown perf-doc generator yet (the
      # human-authored docs under docs/performance/*.md stay hand-maintained).
      # TODO(unity-helpers): if a perf-doc generator is added, render the
      # polished table here instead of copying raw XML.
      - name: Stage perf results for commit
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' }}
        shell: pwsh
        run: |
          $src = '.artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}/results.xml'
          $stageDir = 'perf-staging'
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          if (Test-Path -LiteralPath $src -PathType Leaf) {
            Copy-Item -LiteralPath $src -Destination (Join-Path $stageDir '${{ matrix.result-file }}') -Force
            Write-Host "::notice::Staged perf results for ${{ matrix.unity-version }} ${{ matrix.test-mode }}."
          } else {
            Write-Host "::warning::No results.xml to stage for ${{ matrix.unity-version }} ${{ matrix.test-mode }}."
          }

      - name: Upload staged perf results
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-results-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: perf-staging
          if-no-files-found: warn
          retention-days: 90

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-benchmarks-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: .artifacts/unity/benchmarks/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          if-no-files-found: warn
          retention-days: 90

  commit-perf-results:
    name: Commit refreshed perf results
    needs:
      - matrix-config
      - benchmarks
    # schedule + workflow_dispatch only ever run on the canonical repo (scheduled
    # runs fire only from the default branch; a dispatch requires write access),
    # so no repo-slug guard is needed (avoids hardcoding a slug that breaks after
    # an org transfer). Run even if some benchmark legs failed (!cancelled, not
    # success()) so a partial result set is still captured; if there are no
    # artifacts at all, git-auto-commit-action is a no-op.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Persist credentials so git-auto-commit-action can push.
          persist-credentials: true

      - name: Download staged perf results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: perf-results-*
          path: perf-download
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"

      - name: Assemble perf-results
        id: assemble
        shell: bash
        env:
          EXPECTED_RESULT_COUNT: ${{ needs.matrix-config.outputs.expected-result-count }}
          EXPECTED_RESULT_FILES: ${{ needs.matrix-config.outputs.expected-result-files }}
          BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
          ALLOW_BASELINE_REFRESH: ${{ needs.matrix-config.outputs.allow-baseline-refresh }}
        run: |
          set -euo pipefail
          # Commit raw NUnit results to a TOP-LEVEL perf-results/ dir (NOT under
          # docs/ or any other Unity-asset source root), so they need no Unity
          # .meta companions and fall outside the prettier/markdown/cspell scan
          # globs (none scan .xml). Committing under docs/** would break
          # meta-file-lint (every tracked docs file/dir requires a .meta) on the
          # next push; perf-results/ sidesteps that entirely.
          dest="perf-results"
          candidate="$(mktemp -d)"
          mkdir -p "${dest}"
          find perf-download -type f -name 'results-*.xml' -exec cp -f {} "${candidate}/" \; 2>/dev/null || true
          decision="${candidate}/decision.json"
          node scripts/unity/lib/evaluate-perf-refresh.js \
            --benchmark-result "${BENCHMARKS_RESULT}" \
            --allow-baseline-refresh "${ALLOW_BASELINE_REFRESH}" \
            --expected-files "${EXPECTED_RESULT_FILES}" \
            --candidate-dir "${candidate}" \
            --output "${decision}"
          complete_matrix="$(jq -r '.complete' "${decision}")"
          actual_count="$(jq -r '.actualCount' "${decision}")"
          mapfile -t actual_files < <(jq -r '.actualFiles[]' "${decision}")
          echo "Downloaded ${actual_count} result file(s); expected ${EXPECTED_RESULT_COUNT}."
          if [ "${complete_matrix}" != "true" ]; then
            jq -r '.reasons[] | "::warning::" + .' "${decision}"
          fi
          invalid_successful_matrix="$(jq -r '.invalidSuccessfulMatrix' "${decision}")"

          if [ "${complete_matrix}" = "true" ]; then
            rm -f "${dest}"/results-*.xml "${dest}"/partial-results-*.xml
            find "${candidate}" -maxdepth 1 -type f -name 'results-*.xml' -exec cp -f {} "${dest}/" \;
            echo "complete-matrix=true" >> "${GITHUB_OUTPUT}"
            echo "Assembled a fresh, successful benchmark matrix."
          elif [ "${actual_count}" -gt 0 ]; then
            rm -f "${dest}"/partial-results-*.xml
            for result_file in "${actual_files[@]}"; do
              cp -f "${candidate}/${result_file}" "${dest}/partial-${result_file}"
            done
            echo "complete-matrix=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Benchmark matrix is incomplete or failed; diagnostic XML is retained separately and the canonical baseline/report will not change."
          else
            echo "complete-matrix=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No staged perf results were downloaded; existing results remain untouched."
          fi
          if [ "${invalid_successful_matrix}" = "true" ]; then
            echo "::error::A successful canonical benchmark matrix produced invalid result identities or missing metrics."
            exit 1
          fi

      # A canonical run with malformed output deliberately fails above. Preserve
      # its XML as an artifact even though normal commit steps are then skipped,
      # so the failed collector remains diagnosable without changing the last
      # known-complete committed report.
      - name: Upload invalid matrix diagnostics
        if: ${{ always() && steps.assemble.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: invalid-perf-matrix-diagnostics
          path: perf-results/partial-results-*.xml
          if-no-files-found: warn
          retention-days: 14

      # Extract normalized perf metrics from the assembled NUnit results, diff
      # them against the committed rolling baseline (perf-results/baseline.json),
      # write the human-readable report (perf-results/perf-deltas.md) plus a
      # machine-readable payload (perf-results/perf-deltas.json), and roll the
      # baseline forward to the latest numbers. These are committed alongside the
      # raw XML. REPORT-ONLY by default: the weekly scheduled run must never fail
      # just because perf moved, so we do NOT pass --fail-on-regression here; the
      # `regressed=` signal is surfaced as a step output + workflow annotation for
      # visibility. To make a regression hard-fail later, set
      # PERF_FAIL_ON_REGRESSION=1 on the render step (and gate on its outcome).
      - name: Compute perf deltas vs baseline
        id: perf_deltas
        if: ${{ steps.assemble.outputs.complete-matrix == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(perf-results/results-*.xml)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::notice::No perf results XML to analyze; leaving baseline untouched."
            echo "regressed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          node scripts/unity/lib/extract-perf-metrics.js "${results[@]}" \
            --output perf-results/perf-current.json
          metric_count="$(node -e 'const m=require("./perf-results/perf-current.json");process.stdout.write(String(m.length))')"
          echo "Extracted ${metric_count} perf metric(s) from ${#results[@]} result file(s)."
          if [ "${metric_count}" -eq 0 ]; then
            echo "::error::Benchmark results contained no extractable performance metrics."
            exit 1
          fi
          # render-perf-deltas.js always exits 0 in report-only mode and prints
          # changed=/regressed= on stdout; capture regressed for the annotation.
          render_args=(
            --current perf-results/perf-current.json
            --baseline perf-results/baseline.json
            --out-md perf-results/perf-deltas.md
            --out-json perf-results/perf-deltas.json
            --require-complete-baseline
            --update-baseline perf-results/baseline.json
          )
          render_output="$(node scripts/unity/lib/render-perf-deltas.js "${render_args[@]}")"
          echo "${render_output}"
          regressed="$(printf '%s\n' "${render_output}" | sed -n 's/^regressed=//p' | tail -n1)"
          regressed="${regressed:-false}"
          echo "regressed=${regressed}" >> "${GITHUB_OUTPUT}"
          if [ "${regressed}" = "true" ]; then
            echo "::warning::Perf delta computed a significant regression; see perf-results/perf-deltas.md."
          fi
          # perf-current.json is a transient intermediate; do not commit it.
          rm -f perf-results/perf-current.json

      # git-auto-commit-action is a no-op when there is no diff, so a run that
      # produced no new results does not create an empty commit.
      #
      # A direct push to main is permitted today, and that was measured rather than
      # assumed (#515). `"protected": true` on the branch object is set by ANY
      # ruleset, including ones that allow pushes: GET /branches/main/protection
      # returns 404 "Branch not protected", and the only rules on main come from
      # ruleset 15358326 -- deletion, non_fast_forward and copilot_code_review.
      # None of those blocks a fast-forward push, there is no pull_request rule
      # and no required_status_checks rule, and 10 of the last 100 commits on main
      # were pushed by bots.
      #
      # The moment a pull_request or required_status_checks rule is added, this
      # push starts failing on the following Sunday. The fallback is DxMessaging's
      # perf-numbers.yml: a GitHub App installation token
      # (actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1)
      # that opens an auto-merge PR. It has to be an App token, not the built-in
      # one -- a pull request opened with GITHUB_TOKEN does not trigger workflows,
      # so its required checks never start and auto-merge stalls forever.
      - name: Commit perf results
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: "chore(perf): refresh CI perf results [skip ci]"
          # Broadened from perf-results/*.xml to the whole tree so the rolling
          # baseline (baseline.json) and the generated delta report
          # (perf-deltas.md / perf-deltas.json) are committed next to the raw XML.
          # perf-results/** is in .prettierignore and cspell's ignorePaths, so
          # these generated files never trip the prettier/cspell CI checks.
          file_pattern: perf-results/**
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
