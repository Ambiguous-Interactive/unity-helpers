name: Sync Issue Template Versions

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/issue-template-versions.json"
      - "scripts/tests/test-sync-issue-template-versions.ps1"
      - "scripts/sync-issue-template-versions.ps1"
      - ".github/workflows/sync-issue-template.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-issue-template
  cancel-in-progress: true

jobs:
  sync-versions:
    # Not a fork. Named the requirement rather than one repository: this was
    # `github.repository == 'wallstop/unity-helpers'`, and issues for this package moved to
    # Ambiguous-Interactive/unity-helpers, so the job reported `skipped` on every run in the
    # repository whose issue forms it edits. A name has to be maintained; a fork test does not.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test sync-issue-template-versions script
        shell: pwsh
        run: ./scripts/tests/test-sync-issue-template-versions.ps1 -VerboseOutput

      - name: Run sync script
        shell: pwsh
        run: ./scripts/sync-issue-template-versions.ps1

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --cached --quiet -- '.github/ISSUE_TEMPLATE/' '.github/issue-template-versions.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in issue templates."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in issue templates:"
            git diff --cached --stat -- '.github/ISSUE_TEMPLATE/' '.github/issue-template-versions.json'
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/ .github/issue-template-versions.json
          git commit -m "chore: sync issue template package versions [skip ci]"
          git push origin main

      - name: Step summary
        if: always()
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "### Sync Issue Template Versions"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Templates Changed** | \`${CHANGED:-false}\` |"
            echo "| **Version Source** | \`.github/issue-template-versions.json\` |"
            echo "| **Trigger** | \`$EVENT_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"
