name: WallstopProto Generator

on:
  push:
    branches:
      - main
    paths:
      - "Generator~/**"
      - "Runtime/Analyzers/**"
      - "Runtime/Core/Serialization/WallstopProto/**"
      - ".github/workflows/wproto-generator.yml"
  pull_request:
    paths:
      - "Generator~/**"
      - "Runtime/Analyzers/**"
      - "Runtime/Core/Serialization/WallstopProto/**"
      - ".github/workflows/wproto-generator.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "9.0.x"

      - name: Build the generator
        run: dotnet build "Generator~/WallstopStudios.UnityHelpers.Proto.Generator/WallstopStudios.UnityHelpers.Proto.Generator.csproj" -c Release --nologo

      - name: Verify the shipped analyzer is not stale
        # The suite below loads the DLL under Runtime/Analyzers -- the only binary Unity ever loads
        # -- rather than a fresh build of the sources beside it, so a committed DLL that lags its
        # sources shows up as failing tests. Byte-comparing the two was tried and abandoned: the
        # compiler hashes source file paths into the assembly, so a CI checkout and a working copy
        # never produce identical bytes however deterministic the build is.
        run: |
          set -euo pipefail
          shipped="Runtime/Analyzers/WallstopStudios.UnityHelpers.Proto.Generator.dll"
          if [ ! -f "$shipped" ]; then
            echo "::error::$shipped is missing. Build the generator and copy its output there."
            exit 1
          fi
          echo "Shipped analyzer present; the test suite below runs against it."

      - name: Test the generator
        # The formatters under test are the shipped analyzer's own output, produced the way Unity
        # produces them, rather than a transcription of what it ought to emit.
        run: dotnet test "Generator~/WallstopStudios.UnityHelpers.Proto.Generator.Tests/WallstopStudios.UnityHelpers.Proto.Generator.Tests.csproj" -c Release --nologo
