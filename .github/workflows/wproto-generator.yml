name: WallstopProto Generator

# Also gates the WUH### analyzers and the independent Odin migration generator.
# The workflow keeps its original name
# because branch protection selects required checks by name, and renaming it would silently make
# the required check disappear rather than fail.

on:
  push:
    branches:
      - main
    paths:
      - "Generator~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Tests/**"
      - "docs/features/serialization/serialization.md"
      - "scripts/run-wproto-evidence.ps1"
      - "scripts/build-protobuf-candidate.py"
      - "scripts/verify-protobuf-shipped.py"
      - "scripts/tests/test-protobuf-candidate.py"
      - "scripts/verify-wproto-evidence.ps1"
      - "scripts/unity/lib/test-result-evidence.ps1"
      - "scripts/unity/lib/catastrophic-patterns.ps1"
      - ".gitattributes"
      - ".github/workflows/wproto-generator.yml"
  pull_request:
    paths:
      - "Generator~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Tests/**"
      - "docs/features/serialization/serialization.md"
      - "scripts/run-wproto-evidence.ps1"
      - "scripts/build-protobuf-candidate.py"
      - "scripts/verify-protobuf-shipped.py"
      - "scripts/tests/test-protobuf-candidate.py"
      - "scripts/verify-wproto-evidence.ps1"
      - "scripts/unity/lib/test-result-evidence.ps1"
      - "scripts/unity/lib/catastrophic-patterns.ps1"
      - ".gitattributes"
      - ".github/workflows/wproto-generator.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/unity-helpers-dotnet
        with:
          # Pinned to a patch. The byte comparison below is only meaningful against the same
          # compiler, and every SDK patch ships its own Roslyn; 9.0.x floated onto a different one
          # and the gate failed for a reason no developer could reproduce.
          dotnet-version: "9.0.319"

      - name: Require the installed .NET SDK
        shell: bash
        env:
          EXPECTED_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          selected_sdk="$(dotnet --version)"
          printf 'Selected .NET SDK: %s\n' "$selected_sdk"
          test "$selected_sdk" = "${EXPECTED_DOTNET_SDK:?Missing installed SDK version}"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-generator-${{
            hashFiles('Generator~/**/*.csproj', 'Generator~/**/*.props', 'Generator~/**/*.targets', '**/NuGet.Config', '**/nuget.config') }}

      - name: Verify every shipped compiler input against its sources
        run: node scripts/verify-shipped-analyzers.js

      - name: Test the WUH analyzers
        # Through npm so the command has exactly one definition, which is also the one a
        # developer runs locally.
        run: npm run test:analyzers

      - name: Verify where the analyzer is placed
        # Unity scopes an analyzer by its nearest enclosing asmdef. Under an editor-only one it
        # reaches no consumer runtime code at all, and the failure reads as a missing generated
        # type rather than as anything naming the analyzer.
        run: node scripts/tests/test-analyzer-placement.js

      - name: Test the generator against protobuf-net 3.2.56
        # The formatters under test are the shipped analyzer's own output, produced the way Unity
        # produces them, rather than a transcription of what it ought to emit.
        shell: pwsh
        run: ./scripts/run-wproto-evidence.ps1 -Oracle v3 -OutputRoot "$env:RUNNER_TEMP/wproto-evidence"

      - name: Admit retained Dox consumer contracts against protobuf-net v3
        run: >-
          dotnet test
          Generator~/WallstopStudios.UnityHelpers.DoxRetained.Tests/WallstopStudios.UnityHelpers.DoxRetained.Tests.csproj
          -c Release -p:ProtobufNetOracle=v3 --nologo
          --logger "trx;LogFileName=dox-retained-v3.trx"
          --results-directory "${{ runner.temp }}/wproto-evidence/dox-retained"

      - name: Compile exported schemas and cross-read with protoc
        env:
          WPROTO_SCHEMA_EVIDENCE_ROOT: ${{ runner.temp }}/wproto-evidence/schema-conformance/processes
        run: >-
          dotnet test
          Generator~/WallstopStudios.UnityHelpers.SchemaConformance.Tests/WallstopStudios.UnityHelpers.SchemaConformance.Tests.csproj
          -c Release -p:ProtobufNetOracle=v3 --nologo
          --logger "trx;LogFileName=schema-conformance.trx"
          --results-directory "${{ runner.temp }}/wproto-evidence/schema-conformance"

      - name: Compile consumers with the Roslyn 3.8 API floor
        env:
          WPROTO_COMPILER_EVIDENCE_ROOT: ${{ runner.temp }}/wproto-evidence/compiler-floor/processes
        run: >-
          dotnet test
          Generator~/WallstopStudios.UnityHelpers.Proto.CompilerFloor.Tests/WallstopStudios.UnityHelpers.Proto.CompilerFloor.Tests.csproj
          -c Release --nologo
          --logger "trx;LogFileName=compiler-floor.trx"
          --results-directory "${{ runner.temp }}/wproto-evidence/compiler-floor"
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test the generator against protobuf-net 2.4.9
        # The two oracle DLLs share an assembly name. A second process is the only reliable
        # isolation boundary; side-by-side aliases can silently bind both references to v3.
        shell: pwsh
        run: ./scripts/run-wproto-evidence.ps1 -Oracle v2 -OutputRoot "$env:RUNNER_TEMP/wproto-evidence"

      - name: Test candidate build controls
        run: python3 scripts/tests/test-protobuf-candidate.py

      - name: Build the pinned current protobuf candidate
        run: >-
          python3 scripts/build-protobuf-candidate.py
          --output "${{ runner.temp }}/protobuf-candidate"

      - name: Test the generator against the current protobuf candidate
        run: >-
          dotnet test
          Generator~/WallstopStudios.UnityHelpers.Proto.Generator.Tests/WallstopStudios.UnityHelpers.Proto.Generator.Tests.csproj
          -c Release -p:ProtobufNetOracle=candidate
          -p:ProtobufNetCandidateRoot="${{ runner.temp }}/protobuf-candidate/assemblies"
          -p:UseSharedCompilation=false --nologo
          --logger "trx;LogFileName=candidate.trx"
          --results-directory "${{ runner.temp }}/protobuf-candidate/results"
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Verify shipped protobuf matches its source build
        run: >-
          python3 scripts/verify-protobuf-shipped.py
          --candidate-root "${{ runner.temp }}/protobuf-candidate/assemblies"

      - name: Admit retained Dox contracts against current protobuf
        run: >-
          dotnet test
          Generator~/WallstopStudios.UnityHelpers.DoxRetained.Tests/WallstopStudios.UnityHelpers.DoxRetained.Tests.csproj
          -c Release -p:ProtobufNetOracle=candidate
          -p:ProtobufNetCandidateRoot="${{ runner.temp }}/protobuf-candidate/assemblies"
          -p:UseSharedCompilation=false --nologo
          --logger "trx;LogFileName=dox-retained-candidate.trx"
          --results-directory "${{ runner.temp }}/protobuf-candidate/retained-results"
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Retain current protobuf candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: protobuf-candidate-evidence
          path: |
            ${{ runner.temp }}/protobuf-candidate/*.log
            ${{ runner.temp }}/protobuf-candidate/*.json
            ${{ runner.temp }}/protobuf-candidate/assemblies
            ${{ runner.temp }}/protobuf-candidate/results
            ${{ runner.temp }}/protobuf-candidate/retained-results
          if-no-files-found: warn

      - name: Retain compiled host test inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wproto-host-test-inputs
          path: Generator~/WallstopStudios.UnityHelpers.Proto.Generator.Tests/bin
          if-no-files-found: warn

      - name: Retain oracle invocation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wproto-oracle-evidence
          path: ${{ runner.temp }}/wproto-evidence
          if-no-files-found: warn
