name: Validate Documentation

# Only the strict MkDocs build remains here: it is the one documentation check that needs a Python
# toolchain, so it cannot ride along in Repo Lint without adding pip to every push.
#
# The other five jobs this workflow used to run -- internal link targets, link format, GitHub Pages
# CSS, code fence syntax and gitignore-docs safety -- are checks in scripts/run-repo-lint.js now.
# They were five more runner boots for scripts that finish in seconds.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/validate-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/validate-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mkdocs-test:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Verify build output
        run: |
          if [[ -d "site" ]]; then
            echo "MkDocs site built successfully"
            echo "Site contents:"
            find site -type f | head -20
          else
            echo "MkDocs build did not produce site directory"
            exit 1
          fi
