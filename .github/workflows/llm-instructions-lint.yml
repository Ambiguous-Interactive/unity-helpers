name: LLM Instructions Lint

on:
  push:
    branches:
      - main
    paths:
      - ".llm/**"
      - ".agents/**"
      - ".claude/**"
      - "scripts/pr-feedback.sh"
      - "scripts/pr_feedback.py"
      - "scripts/tests/test_pr_feedback.py"
      - "scripts/python~/**"
      - "scripts/lint-llm-instructions.ps1"
      - "scripts/lint_llm_instructions.py"
      - "scripts/generate_skills_index.py"
      - "scripts/migrate_agent_skills.py"
      - "scripts/tests/test_skills_tooling.py"
      - "scripts/tests/fixtures/skills-index-v1.json"
      - "scripts/tests/fixtures/skill-splits-v1.json"
      - "scripts/tests/fixtures/instruction-policy-v1.json"
      - "scripts/generate_agent_skill_stubs.py"
      - "scripts/check_runner.py"
      - "scripts/run_node_bin.py"
      - "scripts/generate-skills-index.ps1"
      - "scripts/generate-agent-skill-stubs.mjs"
      - "scripts/migrate-agent-skills.mjs"
      - "scripts/tests/test-agent-skill-migration.mjs"
      - "scripts/tests/test-lint-skill-sizes.ps1"
      - "scripts/tests/test-llm-instructions-lint.ps1"
      - "scripts/lint-skill-sizes.ps1"
      - "scripts/lint_skill_sizes.py"
      - "scripts/tests/test_skill_sizes.py"
      - "scripts/csharp_sources.py"
      - "scripts/cli_encoding.py"
      - ".github/workflows/llm-instructions-lint.yml"
  pull_request:
    paths:
      - ".llm/**"
      - ".agents/**"
      - ".claude/**"
      - "scripts/pr-feedback.sh"
      - "scripts/pr_feedback.py"
      - "scripts/tests/test_pr_feedback.py"
      - "scripts/python~/**"
      - "scripts/lint-llm-instructions.ps1"
      - "scripts/lint_llm_instructions.py"
      - "scripts/generate_skills_index.py"
      - "scripts/migrate_agent_skills.py"
      - "scripts/tests/test_skills_tooling.py"
      - "scripts/tests/fixtures/skills-index-v1.json"
      - "scripts/tests/fixtures/skill-splits-v1.json"
      - "scripts/tests/fixtures/instruction-policy-v1.json"
      - "scripts/generate_agent_skill_stubs.py"
      - "scripts/check_runner.py"
      - "scripts/run_node_bin.py"
      - "scripts/generate-skills-index.ps1"
      - "scripts/generate-agent-skill-stubs.mjs"
      - "scripts/migrate-agent-skills.mjs"
      - "scripts/tests/test-agent-skill-migration.mjs"
      - "scripts/tests/test-lint-skill-sizes.ps1"
      - "scripts/tests/test-llm-instructions-lint.ps1"
      - "scripts/lint-skill-sizes.ps1"
      - "scripts/lint_skill_sizes.py"
      - "scripts/tests/test_skill_sizes.py"
      - "scripts/csharp_sources.py"
      - "scripts/cli_encoding.py"
      - ".github/workflows/llm-instructions-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-llm-instructions:
    # Run on BOTH Ubuntu and Windows so the skills-index generator's cross-OS
    # determinism (ordinal sort, UTF-8 no BOM, LF) is actually enforced in CI, not
    # just assumed. A Windows-only drift (e.g. a BOM from Set-Content -Encoding
    # UTF8 on PowerShell 5.1) would fail the Windows leg.
    name: lint-llm-instructions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js (cached)
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Node.js (no cache)
        if: ${{ hashFiles('package-lock.json') == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Install dependencies
        # Explicit bash so the POSIX `if [ -f ... ]` works on the Windows runner
        # (whose default `run:` shell is pwsh). Git for Windows provides bash.
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i --no-audit --no-fund
          fi

      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tools

      - name: Test feedback report
        run: uv run --project scripts/python~ --locked pytest scripts/tests/test_pr_feedback.py -q

      - name: Test LLM instructions lint
        shell: pwsh
        run: uv run --quiet --project scripts/python~ --locked pytest scripts/tests/test_skills_tooling.py -q

      - name: Validate authorship policy
        shell: pwsh
        run: uv run --quiet --project scripts/python~ --locked --no-dev python scripts/lint_llm_instructions.py --authorship-policy-only

      - name: Test skill size linter
        shell: pwsh
        run: uv run --project scripts/python~ --locked pytest scripts/tests/test_skill_sizes.py -q

      - name: Test agent skill migration and discovery
        run: uv run --quiet --project scripts/python~ --locked pytest scripts/tests/test_skills_tooling.py -k "split or stub_rename" -q

      - name: Check skill file sizes
        shell: pwsh
        run: uv run --project scripts/python~ --locked --no-dev python scripts/lint_skill_sizes.py --verbose

      - name: Validate skills index is up-to-date
        run: uv run --quiet --project scripts/python~ --locked --no-dev python scripts/generate_skills_index.py --check
