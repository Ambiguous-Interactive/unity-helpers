name: Agent Metrics

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to include
        type: string
        default: "90"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metrics:
    uses: Ambiguous-Interactive/review-tools/.github/workflows/agent-metrics.yml@5aabfe60ec294f8160b70d0a712c561db5e3fa29 # v1.1.2
    with:
      days: ${{ fromJSON(inputs.days || '90') }}
      timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
