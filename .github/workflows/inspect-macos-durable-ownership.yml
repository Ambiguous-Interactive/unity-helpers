name: Observe macOS durable writer ownership
on:
  push:
    branches: [diagnostics/durable-ownership-863-20261125]
    paths: [.github/workflows/inspect-macos-durable-ownership.yml]
permissions:
  contents: read
jobs:
  writer-lock:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify native locking and file identity
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cd "$scratch"
          uname -sm
          sw_vers -productVersion
          cat > probe.c <<'C'
          #include <assert.h>
          #include <dlfcn.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stddef.h>
          #include <stdio.h>
          #include <sys/file.h>
          #include <sys/stat.h>
          #include <unistd.h>

          #if defined(__x86_64__)
          #define STAT_SYMBOL "stat$INODE64"
          #define FSTAT_SYMBOL "fstat$INODE64"
          #else
          #define STAT_SYMBOL "stat"
          #define FSTAT_SYMBOL "fstat"
          #endif

          int main(void) {
              void *library = dlopen("libSystem.B.dylib", RTLD_NOW | RTLD_LOCAL);
              assert(library);
              int (*stat_path)(const char *, struct stat *) = dlsym(library, STAT_SYMBOL);
              int (*stat_handle)(int, struct stat *) = dlsym(library, FSTAT_SYMBOL);
              assert(stat_path && stat_handle);
              assert(LOCK_EX == 2 && LOCK_NB == 4);
              assert(sizeof(struct stat) == 144);
              assert(offsetof(struct stat, st_dev) == 0 && offsetof(struct stat, st_ino) == 8);
              printf("%s and %s resolve. stat=%zu dev=%zu inode=%zu.\n",
                     STAT_SYMBOL, FSTAT_SYMBOL, sizeof(struct stat),
                     offsetof(struct stat, st_dev), offsetof(struct stat, st_ino));

              const char *name = "owned.tmp.lock";
              int owner = open(name, O_CREAT | O_EXCL | O_RDWR, 0600);
              int delayed = open(name, O_RDWR);
              assert(owner >= 0 && delayed >= 0);
              assert(flock(owner, LOCK_EX | LOCK_NB) == 0);
              assert(flock(delayed, LOCK_EX | LOCK_NB) == -1 && errno == EWOULDBLOCK);

              struct stat named, opened;
              assert(stat_path(name, &named) == 0 && stat_handle(owner, &opened) == 0);
              assert(named.st_ino == opened.st_ino && named.st_dev == opened.st_dev);
              assert(unlink(name) == 0);
              assert(close(owner) == 0);

              int replacement = open(name, O_CREAT | O_EXCL | O_RDWR, 0600);
              assert(replacement >= 0 && flock(replacement, LOCK_EX | LOCK_NB) == 0);
              assert(flock(delayed, LOCK_EX | LOCK_NB) == 0);
              assert(stat_path(name, &named) == 0 && stat_handle(delayed, &opened) == 0);
              assert(named.st_ino != opened.st_ino || named.st_dev != opened.st_dev);
              assert(close(delayed) == 0);
              assert(unlink(name) == 0 && close(replacement) == 0);
              assert(access(name, F_OK) == -1 && errno == ENOENT);
              puts("Native lock rejects a live contender and file identity rejects a stale descriptor.");
              return 0;
          }
          C
          cc -Wall -Wextra -Werror -arch arm64 probe.c -o probe-arm64
          ./probe-arm64
          cc -Wall -Wextra -Werror -arch x86_64 probe.c -o probe-x86_64
          if arch -x86_64 /usr/bin/true; then
              arch -x86_64 ./probe-x86_64
          else
              echo 'Rosetta unavailable. Intel variant compiled without execution.'
          fi
      - name: Set up .NET to qualify the managed ownership stream
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 9.0.x
      - name: Exercise the managed ownership stream across processes
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cd "$scratch"
          dotnet new console --framework net9.0 --no-restore
          cat > DurableFileOwnershipStream.cs <<'CS'
          // MIT License - Copyright (c) 2026 wallstop
          // Full license text: https://github.com/wallstop/unity-helpers/blob/main/LICENSE

          namespace WallstopStudios.UnityHelpers.Core.Helper
          {
              using System;
              using System.IO;
              using System.Runtime.InteropServices;

              internal sealed class DurableFileOwnershipStream : FileStream
              {
                  private const int LockExclusive = 2;
                  private const int LockNonBlocking = 4;
                  private const int LinuxCurrentDirectory = -100;
                  private const int LinuxEmptyPath = 0x1000;
                  private const uint LinuxStatInode = 0x100;
                  private const int LinuxOperationNotPermitted = 1;
                  private const int LinuxOperationUnavailable = 38;
                  private const int LinuxX64StatVersion = 1;

                  private bool _ownsName;

                  private DurableFileOwnershipStream(string lockPath)
                      : base(
                          lockPath,
                          FileMode.OpenOrCreate,
                          FileAccess.ReadWrite,
                          FileShare.ReadWrite | FileShare.Delete,
                          bufferSize: 1
                      ) { }

                  internal static FileStream Acquire(string lockPath)
                  {
                      bool isMac = RuntimeInformation.IsOSPlatform(OSPlatform.OSX);
                      if (!isMac && !RuntimeInformation.IsOSPlatform(OSPlatform.Linux))
                      {
                          return new FileStream(
                              lockPath,
                              FileMode.OpenOrCreate,
                              FileAccess.ReadWrite,
                              FileShare.Read,
                              bufferSize: 1,
                              FileOptions.DeleteOnClose
                          );
                      }

                      DurableFileOwnershipStream stream = new(lockPath);
                      try
                      {
                          int descriptor = stream.SafeFileHandle.DangerousGetHandle().ToInt32();
                          int operation = LockExclusive | LockNonBlocking;
                          int result;
                          if (isMac)
                          {
                              result = LockMac(descriptor, operation);
                          }
                          else
                          {
                              result = LockLinux(descriptor, operation);
                          }

                          if (result != 0)
                          {
                              int nativeError = Marshal.GetLastWin32Error();
                              throw new IOException(
                                  $"Could not acquire writer ownership at '{lockPath}' (OS error {nativeError})."
                              );
                          }

                          bool matches;
                          if (isMac)
                          {
                              matches = MatchesMacIdentity(descriptor, stream.Name);
                          }
                          else
                          {
                              matches = MatchesLinuxIdentity(descriptor, stream.Name);
                          }

                          if (!matches)
                          {
                              throw new IOException(
                                  $"Writer ownership changed at '{lockPath}'. Retry the operation."
                              );
                          }
                          stream._ownsName = true;
                          return stream;
                      }
                      catch
                      {
                          stream.Dispose();
                          throw;
                      }
                  }

                  private static bool MatchesLinuxIdentity(int descriptor, string lockPath)
                  {
                      LinuxFileIdentity opened;
                      try
                      {
                          int result = StatLinux(
                              descriptor,
                              string.Empty,
                              LinuxEmptyPath,
                              LinuxStatInode,
                              out opened
                          );
                          if (result != 0)
                          {
                              int nativeError = Marshal.GetLastWin32Error();
                              if (
                                  RuntimeInformation.ProcessArchitecture == Architecture.X64
                                  && nativeError is LinuxOperationNotPermitted or LinuxOperationUnavailable
                              )
                              {
                                  return MatchesLegacyLinuxIdentity(descriptor, lockPath);
                              }
                              throw OwnershipIdentityError(lockPath, nativeError);
                          }
                      }
                      catch (EntryPointNotFoundException)
                          when (RuntimeInformation.ProcessArchitecture == Architecture.X64)
                      {
                          return MatchesLegacyLinuxIdentity(descriptor, lockPath);
                      }

                      if (
                          StatLinux(
                              LinuxCurrentDirectory,
                              lockPath,
                              0,
                              LinuxStatInode,
                              out LinuxFileIdentity named
                          ) != 0
                      )
                      {
                          int nativeError = Marshal.GetLastWin32Error();
                          throw OwnershipIdentityError(lockPath, nativeError);
                      }

                      return (opened.Mask & LinuxStatInode) != 0
                          && (named.Mask & LinuxStatInode) != 0
                          && opened.Inode == named.Inode
                          && opened.DeviceMajor == named.DeviceMajor
                          && opened.DeviceMinor == named.DeviceMinor;
                  }

                  private static bool MatchesLegacyLinuxIdentity(int descriptor, string lockPath)
                  {
                      if (
                          StatLegacyLinuxDescriptor(
                              LinuxX64StatVersion,
                              descriptor,
                              out LegacyLinuxFileIdentity opened
                          ) != 0
                          || StatLegacyLinuxPath(
                              LinuxX64StatVersion,
                              lockPath,
                              out LegacyLinuxFileIdentity named
                          ) != 0
                      )
                      {
                          int nativeError = Marshal.GetLastWin32Error();
                          throw OwnershipIdentityError(lockPath, nativeError);
                      }
                      return opened.Device == named.Device && opened.Inode == named.Inode;
                  }

                  private static bool MatchesMacIdentity(int descriptor, string lockPath)
                  {
                      MacFileIdentity opened;
                      MacFileIdentity named;
                      if (RuntimeInformation.ProcessArchitecture == Architecture.X64)
                      {
                          if (
                              StatIntelMacDescriptor(descriptor, out opened) != 0
                              || StatIntelMacPath(lockPath, out named) != 0
                          )
                          {
                              int nativeError = Marshal.GetLastWin32Error();
                              throw OwnershipIdentityError(lockPath, nativeError);
                          }
                      }
                      else if (
                          StatMacDescriptor(descriptor, out opened) != 0
                          || StatMacPath(lockPath, out named) != 0
                      )
                      {
                          int nativeError = Marshal.GetLastWin32Error();
                          throw OwnershipIdentityError(lockPath, nativeError);
                      }

                      return opened.Device == named.Device && opened.Inode == named.Inode;
                  }

                  private static IOException OwnershipIdentityError(string lockPath, int nativeError)
                  {
                      return new IOException(
                          $"Could not verify writer ownership at '{lockPath}' (OS error {nativeError})."
                      );
                  }

                  [DllImport("libc", EntryPoint = "flock", ExactSpelling = true, SetLastError = true)]
                  private static extern int LockLinux(int descriptor, int operation);

                  [DllImport(
                      "libSystem.B.dylib",
                      EntryPoint = "flock",
                      ExactSpelling = true,
                      SetLastError = true
                  )]
                  private static extern int LockMac(int descriptor, int operation);

                  [DllImport("libc", EntryPoint = "statx", ExactSpelling = true, SetLastError = true)]
                  private static extern int StatLinux(
                      int directory,
                      string path,
                      int flags,
                      uint mask,
                      out LinuxFileIdentity identity
                  );

                  [DllImport("libc", EntryPoint = "__fxstat", ExactSpelling = true, SetLastError = true)]
                  private static extern int StatLegacyLinuxDescriptor(
                      int version,
                      int descriptor,
                      out LegacyLinuxFileIdentity identity
                  );

                  [DllImport("libc", EntryPoint = "__xstat", ExactSpelling = true, SetLastError = true)]
                  private static extern int StatLegacyLinuxPath(
                      int version,
                      string path,
                      out LegacyLinuxFileIdentity identity
                  );

                  [DllImport(
                      "libSystem.B.dylib",
                      EntryPoint = "fstat$INODE64",
                      ExactSpelling = true,
                      SetLastError = true
                  )]
                  private static extern int StatIntelMacDescriptor(
                      int descriptor,
                      out MacFileIdentity identity
                  );

                  [DllImport(
                      "libSystem.B.dylib",
                      EntryPoint = "stat$INODE64",
                      ExactSpelling = true,
                      SetLastError = true
                  )]
                  private static extern int StatIntelMacPath(string path, out MacFileIdentity identity);

                  [DllImport(
                      "libSystem.B.dylib",
                      EntryPoint = "fstat",
                      ExactSpelling = true,
                      SetLastError = true
                  )]
                  private static extern int StatMacDescriptor(int descriptor, out MacFileIdentity identity);

                  [DllImport(
                      "libSystem.B.dylib",
                      EntryPoint = "stat",
                      ExactSpelling = true,
                      SetLastError = true
                  )]
                  private static extern int StatMacPath(string path, out MacFileIdentity identity);

                  protected override void Dispose(bool disposing)
                  {
                      if (disposing && _ownsName)
                      {
                          // Unlink under ownership. An opener paused before flock will then fail the identity check.
                          _ownsName = false;
                          DurableFile.DiscardStagedFile(Name);
                      }

                      base.Dispose(disposing);
                  }

                  [StructLayout(LayoutKind.Explicit, Size = 256)]
                  private struct LinuxFileIdentity
                  {
                      [FieldOffset(0)]
                      internal uint Mask;

                      [FieldOffset(32)]
                      internal ulong Inode;

                      [FieldOffset(136)]
                      internal uint DeviceMajor;

                      [FieldOffset(140)]
                      internal uint DeviceMinor;
                  }

                  [StructLayout(LayoutKind.Explicit, Size = 144)]
                  private struct LegacyLinuxFileIdentity
                  {
                      [FieldOffset(0)]
                      internal ulong Device;

                      [FieldOffset(8)]
                      internal ulong Inode;
                  }

                  [StructLayout(LayoutKind.Explicit, Size = 144)]
                  private struct MacFileIdentity
                  {
                      [FieldOffset(0)]
                      internal int Device;

                      [FieldOffset(8)]
                      internal ulong Inode;
                  }
              }
          }
          CS
          cat > Program.cs <<'CS'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Runtime.InteropServices;
          using WallstopStudios.UnityHelpers.Core.Helper;

          if (args.Length == 1)
          {
              try
              {
                  using FileStream contender = DurableFileOwnershipStream.Acquire(args[0]);
                  return 0;
              }
              catch (IOException error)
              {
                  Console.WriteLine(error.Message);
                  return 23;
              }
          }

          string directory = Directory.CreateTempSubdirectory().FullName;
          string path = Path.Combine(directory, "writer.tmp.lock");
          try
          {
              Console.WriteLine($"Managed host: {RuntimeInformation.FrameworkDescription} {RuntimeInformation.ProcessArchitecture}");
              using (FileStream owner = DurableFileOwnershipStream.Acquire(path))
              {
                  if (RunContender() != 23 || !File.Exists(path))
                      throw new InvalidOperationException("The contender must report failure while the owner is live.");
              }

              if (File.Exists(path) || RunContender() != 0 || File.Exists(path))
                  throw new InvalidOperationException("Release and retry must leave no lock file.");
              Console.WriteLine("The exact managed ownership stream rejected a second process, released and cleaned its lock, and allowed a retry.");
              return 0;
          }
          finally
          {
              Directory.Delete(directory, recursive: true);
          }

          int RunContender()
          {
              ProcessStartInfo start = new("dotnet");
              start.ArgumentList.Add(typeof(DurableFileOwnershipStream).Assembly.Location);
              start.ArgumentList.Add(path);
              using Process process = Process.Start(start) ?? throw new InvalidOperationException("No contender.");
              if (!process.WaitForExit(10000))
              {
                  process.Kill(entireProcessTree: true);
                  throw new TimeoutException("The contender did not exit.");
              }
              return process.ExitCode;
          }

          namespace WallstopStudios.UnityHelpers.Core.Helper
          {
              internal static class DurableFile
              {
                  internal static void DiscardStagedFile(string path)
                  {
                      try
                      {
                          File.Delete(path);
                      }
                      catch (Exception) { }
                  }
              }
          }
          CS
          dotnet run --configuration Release
