name: Unity Tests

# cspell:ignore lfs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unity-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  change-classifier:
    name: Classify Unity-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unity-required: ${{ steps.classify.outputs.unity-required }}
    steps:
      - name: Checkout complete changed revision history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the complete pull request
        id: classify
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-changes@1ec035504397eeff3f5c27059081d56ff7987802
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  runner-preflight:
    name: Self-hosted runner registration preflight
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require a registered Windows Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  unity-validation:
    name: Unity 6000.5.2f1 EditMode, PlayMode, and standalone
    needs: [change-classifier, runner-preflight]
    if: >-
      ${{
        needs.change-classifier.result == 'success' &&
        needs.change-classifier.outputs.unity-required == 'true' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1200
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Remove stale private Unity evidence
        timeout-minutes: 2
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'unity-activate-*' -File -ErrorAction Stop |
            Remove-Item -Force -ErrorAction Stop
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'unity-return-*' -File -ErrorAction Stop |
            Remove-Item -Force -ErrorAction Stop
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'unity-return-*' -Directory -ErrorAction Stop |
            Remove-Item -Recurse -Force -ErrorAction Stop
          $remaining = @(
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'unity-activate-*' -File -ErrorAction Stop
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'unity-return-*' -File -ErrorAction Stop
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'unity-return-*' -Directory -ErrorAction Stop
          )
          if ($remaining.Count -ne 0) {
            throw 'Private Unity evidence remains in RUNNER_TEMP before checkout.'
          }

      - name: Enable Git long paths
        timeout-minutes: 2
        shell: pwsh
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        timeout-minutes: 30
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\uh-gitconfig
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.18.0"

      - name: Validate Unity test-project module manifest
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/lint-unity-test-modules.ps1 -VerboseOutput

      - name: Compute EditMode assembly list
        id: editmode-assemblies
        timeout-minutes: 2
        uses: ./.github/actions/compute-unity-assemblies
        with:
          include-integrations: "true"
          target: editmode

      - name: Compute PlayMode assembly list
        id: playmode-assemblies
        timeout-minutes: 2
        uses: ./.github/actions/compute-unity-assemblies
        with:
          include-integrations: "true"
          target: playmode

      - name: Compute standalone assembly list
        id: standalone-assemblies
        timeout-minutes: 2
        uses: ./.github/actions/compute-unity-assemblies
        with:
          include-integrations: "true"
          runtime-only: "true"
          target: standalone

      - name: Require non-empty validation suites
        timeout-minutes: 2
        shell: pwsh
        env:
          EDITMODE_EMPTY: ${{ steps.editmode-assemblies.outputs.is-empty }}
          PLAYMODE_EMPTY: ${{ steps.playmode-assemblies.outputs.is-empty }}
          STANDALONE_EMPTY: ${{ steps.standalone-assemblies.outputs.is-empty }}
        run: |
          if (
            $env:EDITMODE_EMPTY -eq 'true' -or
            $env:PLAYMODE_EMPTY -eq 'true' -or
            $env:STANDALONE_EMPTY -eq 'true'
          ) {
            throw 'A required Unity validation suite resolved to an empty assembly list.'
          }

      - name: Provision the CI-managed Unity editor
        timeout-minutes: 180
        shell: pwsh
        env:
          UNITY_EDITOR_INSTALL_ROOT: ${{ runner.tool_cache }}\u6-v3
          UH_ENSURE_EDITOR_PROBE_TIMEOUT_SECONDS: "15"
          UH_ENSURE_EDITOR_PROVISIONING_BUDGET_SECONDS: "9600"
          UH_ENSURE_EDITOR_INSTALL_TIMEOUT_SECONDS: "7200"
        run: |
          $editor = ./scripts/unity/ensure-editor.ps1 `
            -UnityVersion '6000.5.2f1' `
            -InstallRoot $env:UNITY_EDITOR_INSTALL_ROOT `
            -ProvisioningProfile StandaloneWindowsIl2Cpp `
            -DiagnosticsPath (Join-Path $env:RUNNER_TEMP 'unity-helpers-provisioning.json') `
            -CiManagedOnly |
            Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($editor)) {
            throw 'Unity editor provisioning did not return an editor path.'
          }
          "UNITY_EDITOR_PATH=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate Unity credentials
        timeout-minutes: 2
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Require current PR head before lock acquisition
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: acquire-build-lock
        timeout-minutes: 305
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          lock-name: wallstop-organization-builds
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          holder-id-suffix: unity-helpers-ci
          timeout-minutes: "300"
          require-resource-lifecycle: "true"
          minimum-release-cooldown-seconds: "1"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require acquired Unity lock
        if: ${{ steps.acquire-build-lock.outputs.acquired != 'true' }}
        timeout-minutes: 1
        shell: pwsh
        run: exit 1

      - name: Run EditMode tests
        id: editmode
        if: ${{ steps.acquire-build-lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 90
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
          ASSEMBLIES: ${{ steps.editmode-assemblies.outputs.assemblies }}
        run: |
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '6000.5.2f1' `
            -TestMode editmode `
            -AssemblyNames $env:ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/6000.5.2f1-editmode' `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -LicenseReturnOwner Central

      - name: Run PlayMode tests
        id: playmode
        if: >-
          ${{
            steps.acquire-build-lock.outputs.acquired == 'true' &&
            steps.editmode.outcome == 'success'
          }}
        continue-on-error: true
        timeout-minutes: 90
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
          ASSEMBLIES: ${{ steps.playmode-assemblies.outputs.assemblies }}
        run: |
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '6000.5.2f1' `
            -TestMode playmode `
            -AssemblyNames $env:ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/6000.5.2f1-playmode' `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -LicenseReturnOwner Central

      - name: Run standalone tests
        id: standalone
        if: >-
          ${{
            steps.acquire-build-lock.outputs.acquired == 'true' &&
            steps.editmode.outcome == 'success' &&
            steps.playmode.outcome == 'success'
          }}
        continue-on-error: true
        timeout-minutes: 150
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
          ASSEMBLIES: ${{ steps.standalone-assemblies.outputs.assemblies }}
        run: |
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '6000.5.2f1' `
            -TestMode standalone `
            -AssemblyNames $env:ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/6000.5.2f1-standalone' `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration Debug `
            -LicenseReturnOwner Central

      - name: Upload Unity test results
        if: ${{ always() && steps.acquire-build-lock.outputs.acquired == 'true' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/unity/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when licensed work failed
        if: ${{ always() && steps.acquire-build-lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        shell: pwsh
        env:
          EDITMODE_OUTCOME: ${{ steps.editmode.outcome }}
          PLAYMODE_OUTCOME: ${{ steps.playmode.outcome }}
          STANDALONE_OUTCOME: ${{ steps.standalone.outcome }}
        run: |
          if (
            $env:EDITMODE_OUTCOME -ne 'success' -or
            $env:PLAYMODE_OUTCOME -ne 'success' -or
            $env:STANDALONE_OUTCOME -ne 'success'
          ) {
            throw "Unity validation failed: edit=$env:EDITMODE_OUTCOME play=$env:PLAYMODE_OUTCOME standalone=$env:STANDALONE_OUTCOME"
          }

      - name: Preserve account health and delete private activation evidence
        id: delete-activation-evidence
        if: ${{ always() && steps.acquire-build-lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          $accountHealth = Join-Path $env:RUNNER_TEMP "unity-account-health-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-unity-helpers-ci.log"
          "supplemental-evidence-path=$accountHealth" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $accountBlocked = $false
          foreach ($mode in @('editmode', 'playmode', 'standalone')) {
            foreach ($prefix in @('unity-activate', 'unity-return')) {
              $path = Join-Path $env:RUNNER_TEMP "$prefix-6000.5.2f1-$mode.log"
              if (Test-Path -LiteralPath $path) {
                $text = Get-Content -LiteralPath $path -Raw -ErrorAction Stop
                if (
                  $text -match '(?i)maximum number of activations' -or
                  $text -match '(?<![0-9])20111(?![0-9])'
                ) {
                  $accountBlocked = $true
                }
                Remove-Item -LiteralPath $path -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $path) {
                throw "Private Unity evidence remains at '$path'."
              }
            }
          }
          $healthEvidence = if ($accountBlocked) {
            'Unity account health evidence: Code 20111 maximum number of activations.'
          } else {
            'No account-limit evidence observed in the final activation attempts.'
          }
          Set-Content -LiteralPath $accountHealth -Value $healthEvidence -Encoding utf8 -NoNewline

      - name: Return Unity license
        id: return-unity-license
        if: ${{ always() && steps.acquire-build-lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@0ce3dce6cbe29af210432087e3b6d81509258063
        with:
          unity-version: 6000.5.2f1
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: unity-helpers-ci

      - name: Classify Unity cleanup evidence
        id: classify-unity-cleanup
        if: ${{ always() && steps.acquire-build-lock.outputs.acquired == 'true' }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          return-log-path: ${{ steps.return-unity-license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return-unity-license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return-unity-license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return-unity-license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return-unity-license.outputs.return-log-digest }}
          supplemental-evidence-paths: ${{ steps.delete-activation-evidence.outputs.supplemental-evidence-path }}

      - name: Release organization Unity lock
        id: release-build-lock
        if: ${{ always() }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          lock-name: wallstop-organization-builds
          runner-id: ${{ runner.name }}
          holder-id-suffix: unity-helpers-ci
          resource-cleanup-status: ${{ steps.classify-unity-cleanup.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.classify-unity-cleanup.outputs.resource-health }}
          resource-reason: ${{ steps.classify-unity-cleanup.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: ${{ always() }}
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          acquired: ${{ steps.acquire-build-lock.outputs.acquired }}
          classification-complete: ${{ steps.classify-unity-cleanup.outputs.classification-complete }}
          cleanup-status: ${{ steps.classify-unity-cleanup.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.classify-unity-cleanup.outputs.resource-health }}
          cleanup-reason: ${{ steps.classify-unity-cleanup.outputs.resource-reason }}
          release-outcome: ${{ steps.release-build-lock.outcome }}
          cleanup-result: ${{ steps.release-build-lock.outputs.cleanup-result }}
          released: ${{ steps.release-build-lock.outputs.released }}
          release-health: ${{ steps.release-build-lock.outputs.resource-health }}
          release-reason: ${{ steps.release-build-lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release-build-lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release-build-lock.outputs.reservation-id }}
          incident-id: ${{ steps.release-build-lock.outputs.incident-id }}

  unity-lock-cleanup:
    name: Unity lock fallback cleanup
    needs: unity-validation
    if: >-
      ${{
        always() &&
        needs.unity-validation.result != 'skipped' &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cleanup-result: ${{ steps.fallback-release.outputs.cleanup-result }}
    steps:
      - name: Release queued or held Unity lock
        id: fallback-release
        if: ${{ always() }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@08fc83e83fa4cae89c0177005b388585ffdb1d9a
        with:
          lock-name: wallstop-organization-builds
          holder-id: ${{ github.repository }}:${{ github.run_id }}:unity-validation:unity-helpers-ci
          holder-id-suffix: unity-helpers-ci
          runner-id: ${{ runner.name }}
          resource-cleanup-status: unknown
          resource-health: healthy
          resource-reason: return-terminated
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

  unity-ci-success:
    name: Unity CI Success
    needs:
      - change-classifier
      - runner-preflight
      - unity-validation
      - unity-lock-cleanup
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Unity validation for trusted revisions
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-unity-validation@1ec035504397eeff3f5c27059081d56ff7987802
        with:
          classifier-result: ${{ needs.change-classifier.result }}
          unity-required: ${{ needs.change-classifier.outputs.unity-required }}
          trusted-revision: >-
            ${{
              github.event.pull_request.user.login != 'dependabot[bot]' &&
              (github.event_name != 'pull_request' ||
                github.event.pull_request.head.repo.full_name == github.repository)
            }}
          preflight-result: ${{ needs.runner-preflight.result }}
          unity-result: ${{ needs.unity-validation.result }}
          fallback-result: ${{ needs.unity-lock-cleanup.result }}
          fallback-cleanup-result: ${{ needs.unity-lock-cleanup.outputs.cleanup-result }}
