name: Unity Tests

# cspell:ignore lfs WSL

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      unity-version:
        description: "Pin a single Unity version. Empty = full matrix."
        required: false
        default: ""
        type: string
      test-mode:
        description: "Pin a single test mode."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - editmode
          - playmode
          - standalone

permissions:
  contents: read
  checks: write
  pull-requests: read

# Scoped to the HEAD, not just the pull request. `cancel-in-progress: false` is required -- a
# cancelled licensed job can skip license return and lock release -- but a per-PR group then makes
# every new run queue behind its predecessor. A superseded predecessor holds that group for as long
# as its legs sit in the runner queue, and a queued leg cannot reach the require-current-pr-head
# guard that would end it in two seconds. Measured on PR #351: the head had NO Unity check at all
# for two hours, while every other check was green and `main` has no branch protection to catch it.
#
# Per-head groups let the current head start immediately. Superseded legs stay harmless: the pinned
# head guard is each licensed job's first step AND runs again immediately before lock acquisition,
# so a stale leg exits without ever taking the Unity seat, and matrix-config now resolves
# supersession promptly instead of after a queue drain.
concurrency:
  group: unity-tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  matrix-config:
    name: Resolve Unity test matrix
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      unity-versions: ${{ steps.resolve.outputs.unity-versions }}
      test-modes: ${{ steps.resolve.outputs.test-modes }}
      # Fast tier (editmode + playmode) and the gated standalone tier. See the
      # resolve step for how the matrix is split.
      matrix-include: ${{ steps.resolve.outputs.matrix-include }}
      matrix-include-standalone: ${{ steps.resolve.outputs.matrix-include-standalone }}
      has-required-secrets: ${{ steps.check-secrets.outputs.has-secrets }}
      superseded: ${{ steps.superseded.outputs.superseded }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Resolve "has this PR moved on?" ONCE, here, on a hosted runner.
      #
      # Every licensed leg re-checks the head immediately before setup and again
      # before lock acquisition, but those guards fire only after the leg has
      # already been dispatched -- and a dispatch means waiting in line for the
      # single self-hosted Unity seat. A stale iteration therefore burned eight
      # queue slots to do nothing, and because this workflow's concurrency group
      # cannot cancel in progress (a leg may be holding the org Unity license),
      # the successor run stayed `pending` behind it for as long as that took.
      # Observed on run 30963202461: two legs still queued 45 minutes after the
      # head moved, with the successor run never started.
      #
      # Skipping the licensed tiers instead lets a superseded run complete in
      # seconds and hand the concurrency group to the run that matters. The
      # per-leg guards stay as defense in depth for a push that lands after this
      # step has already answered.
      #
      # Fails OPEN: any API trouble resolving the head leaves superseded=false,
      # so an unreachable API costs a redundant run, never a skipped validation.
      - name: Detect superseded pull request head
        id: superseded
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${EXPECTED_HEAD_SHA:-}" ]; then
            echo "Not a pull request run; nothing can supersede it."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          current=""
          if ! current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
            current=""
          fi
          # Shape, not emptiness: `--jq '.head.sha'` prints the literal string
          # "null" and exits 0 when the field is absent, and "null" compares
          # unequal to any real SHA -- an API anomaly would otherwise skip every
          # licensed tier, the one thing this step must never do.
          if ! printf '%s' "${current}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::Could not resolve the current head of pull request #${PR_NUMBER} (got '${current}'); proceeding as current."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${current}" = "${EXPECTED_HEAD_SHA}" ]; then
            echo "Pull request #${PR_NUMBER} is still at ${EXPECTED_HEAD_SHA}."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "superseded=true" >> "${GITHUB_OUTPUT}"
          echo "::notice::Superseded run for ${EXPECTED_HEAD_SHA}; pull request #${PR_NUMBER} now points to ${current}. Skipping the licensed Unity tiers."
          {
            echo "## Superseded Unity run"
            echo ""
            echo "This run was queued for \`${EXPECTED_HEAD_SHA}\`; pull request #${PR_NUMBER} now points to \`${current}\`."
            echo "The licensed Unity tiers were skipped so the run for the current head can start immediately."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Fail FAST on a bad test-project module manifest before any (expensive,
      # self-hosted) Unity leg starts. A non-existent UPM id here -- e.g. the
      # bogus 'com.unity.modules.grid' (declare com.unity.modules.tilemap for
      # Grid) -- makes every matrix leg fail ~30 min later with no NUnit
      # results.xml and no clearly-named cause. This
      # hosted-runner check turns that whole class into an instant, self-
      # describing red on the PR. run-ci-tests.ps1's catastrophic-pattern scan is
      # the in-Unity backstop for the same failure.
      - name: Validate Unity test-project module manifest
        shell: pwsh
        run: ./scripts/lint-unity-test-modules.ps1 -VerboseOutput

      # NOTE: DxMessaging had a "ci-owned docs-only PR" detection here that
      # skipped the licensed matrix when a PR touched ONLY its perf-numbers doc
      # + baseline. unity-helpers has no such CI-owned perf-doc auto-commit on
      # the PR path (the unity-benchmarks workflow commits perf results from a
      # SCHEDULED run, not a PR), so that detection is intentionally DROPPED for
      # simplicity. If a perf-doc auto-update PR flow is added later, repoint a
      # docs-only gate at docs/performance/ rather than DxMessaging's
      # docs/architecture/performance.md path.
      - name: Resolve dispatch overrides
        id: resolve
        env:
          INPUT_UNITY_VERSION: ${{ inputs.unity-version }}
          INPUT_TEST_MODE: ${{ inputs.test-mode }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_UNITY_VERSION:-}" ]; then
            versions="[\"${INPUT_UNITY_VERSION}\"]"
          else
            versions="$(jq -c '.all' .github/unity-versions.json)"
          fi
          if [ -n "${INPUT_TEST_MODE:-}" ] && [ "${INPUT_TEST_MODE}" != "all" ]; then
            modes="[\"${INPUT_TEST_MODE}\"]"
          else
            modes='["editmode","playmode","standalone"]'
          fi
          # Split the matrix into a FAST tier (editmode + playmode) and a gated
          # STANDALONE tier. The unity-tests-standalone job `needs:` unity-tests,
          # so a fast-tier failure SKIPS the ~30-min-each IL2CPP standalone legs --
          # a fundamental break costs minutes, not ~90 min of player builds. Because
          # the org build-lock serializes every leg onto one seat, standalone always
          # ran last anyway, so gating it adds zero wall-clock to a green run.
          #
          # Each tier's include is mode-major, version-minor, ordered explicitly
          # (GitHub's bare cartesian expansion order is not contractually
          # guaranteed). Only split when the run actually contains BOTH a fast mode
          # AND standalone; a single-mode dispatch pin (e.g. standalone-only) runs
          # entirely in the fast tier with an empty standalone tier, so it is not
          # skipped by the gate.
          filter_modes() {
            jq -cn --argjson modes "${modes}" --argjson p "$1" \
              '[ $p[] | select(. as $x | $modes | index($x)) ]'
          }
          build_include() {
            jq -cn --argjson versions "${versions}" --argjson m "$1" \
              '[ $m[] | . as $mode | $versions[] | { "unity-version": ., "test-mode": $mode } ]'
          }
          split="$(jq -cn --argjson modes "${modes}" \
            '(($modes | index("standalone")) != null)
              and (($modes | map(select(. == "editmode" or . == "playmode")) | length) > 0)')"
          if [ "${split}" = "true" ]; then
            fast_modes="$(filter_modes '["editmode","playmode"]')"
            std_modes='["standalone"]'
          else
            fast_modes="$(filter_modes '["editmode","playmode","standalone"]')"
            std_modes='[]'
          fi
          include_fast="$(build_include "${fast_modes}")"
          include_std="$(build_include "${std_modes}")"
          {
            echo "unity-versions=${versions}"
            echo "test-modes=${modes}"
            echo "matrix-include=${include_fast}"
            echo "matrix-include-standalone=${include_std}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check for required licensed workflow secrets
        id: check-secrets
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${UNITY_SERIAL:-}" ] && \
             [ -n "${UNITY_EMAIL:-}" ] && \
             [ -n "${UNITY_PASSWORD:-}" ] && \
             [ -n "${BUILD_LOCK_APP_ID:-}" ] && \
             [ -n "${BUILD_LOCK_APP_PRIVATE_KEY:-}" ]; then
            echo "has-secrets=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has-secrets=false" >> "${GITHUB_OUTPUT}"
          fi

  runner-preflight:
    name: Self-hosted runner access preflight
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # This job is the only one in the workflow that reached for organization
      # secrets without first asking whether this run has any. Dependabot runs use
      # a separate secret store, so `reader-app-id` arrived empty and the action
      # failed closed with "Missing required input" -- on every dependency PR,
      # forever, while `matrix-config` had already (correctly) skipped the licensed
      # tiers those credentials exist to serve. Preflighting a runner fleet nothing
      # is going to dispatch to is not a gate, it is a guaranteed red.
      #
      # The check is done here rather than in the job's `if:` on purpose: the
      # `secrets` context is unavailable in a job-level condition, and reading it
      # through `needs.matrix-config` would put this job behind a barrier it does
      # not otherwise need.
      - name: Detect build-lock reader credentials
        id: credentials
        env:
          READER_APP_ID: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          READER_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${READER_APP_ID:-}" ] && [ -n "${READER_APP_PRIVATE_KEY:-}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "present=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::No build-lock reader credentials on this run, so the licensed Unity tiers are skipped and there is no runner fleet to preflight."

      - name: Require an online Unity runner
        if: ${{ steps.credentials.outputs.present == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  # FAST tier: editmode + playmode across all versions. The expensive standalone
  # IL2CPP legs live in unity-tests-standalone, which `needs:` this job -- so a
  # fundamental break here (compile error in any editmode leg, mass runtime failure
  # in any leg) SKIPS the ~90 min of standalone builds entirely.
  unity-tests:
    name: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}
    needs:
      - matrix-config
      - runner-preflight
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.matrix-config.outputs.has-required-secrets == 'true' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1200
    strategy:
      # A sibling may hold a Unity license, so matrix failures must never cancel
      # another leg before its license-return and lock-release cleanup completes.
      fail-fast: false
      # No max-parallel. It used to be 2 -- one slot per Unity runner -- which
      # sounds like it matches capacity and is in fact the thing that wastes it:
      # `max-parallel` makes only N matrix jobs *eligible*, so every completion is
      # a fresh dispatch transition, and dispatch to a self-hosted runner is what
      # is slow here. Measured on run 31130259492 (main, green): 16 legs, 70.9 min
      # of work, 2 runners -- a 35.5 min packing floor against an 88 min wall
      # clock. ELI-MACHINE finished a leg at +9.4 min and sat idle until +22.8 with
      # four legs queued; no sibling repo touched the runners in that window
      # (checked DxMessaging, DoxReloaded, IshoBoy, qora-redux), and the
      # organization Unity lock acquired in 2-4 s on all 15 licensed legs, so
      # neither contention explains it.
      #
      # Concurrency is still bounded by the runner pool: a self-hosted runner takes
      # one job at a time, and the organization lock guards the Unity seat. The
      # trade-off accepted here is politeness -- a sibling repo's Unity job can now
      # queue behind more of ours at once.
      matrix:
        # Ordered fast-tier include from matrix-config: editmode then playmode,
        # version-minor. matrix.unity-version / matrix.test-mode come from each
        # include object. (Standalone runs in the gated unity-tests-standalone job.)
        include: ${{ fromJSON(needs.matrix-config.outputs.matrix-include) }}
    steps:
      - name: Require current PR head before setup
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.18.0"

      # Single source of truth for the assembly include list: the same
      # asmdef-discovery.js module the local discovery uses. Extracted into a
      # composite action so all Unity workflows share one implementation.
      # Uses Windows PowerShell inside the composite so empty legs can be skipped
      # before runner maintenance installs or repairs PowerShell 7 / Unity.
      - name: Compute test assembly list
        id: compute
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: "${{ matrix.test-mode }}"
          runtime-only: "${{ matrix.test-mode == 'standalone' && 'true' || 'false' }}"
          # Run the DI-container integration suites (Reflex / VContainer / Zenject)
          # alongside core on EVERY version x mode leg. The matching run step passes
          # -IncludeIntegrations so the 3 packages are installed into the ephemeral
          # manifest; without that the integration assemblies would not compile.
          include-integrations: "true"

      - name: Maintain Unity editor on selected runner
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        timeout-minutes: 360
        shell: powershell
        run: |
          $artifactsPath = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}'
          $maintenanceDiagnosticsRoot = Join-Path $artifactsPath 'provisioning/runner-maintenance'
          New-Item -ItemType Directory -Force -Path $maintenanceDiagnosticsRoot | Out-Null
          $provisioningProfile = if ('${{ matrix.test-mode }}' -eq 'standalone') {
            'StandaloneWindowsIl2Cpp'
          } else {
            'EditorOnly'
          }
          $maintenanceScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\unity\maintain-windows-runner.ps1'
          if (-not (Test-Path -LiteralPath $maintenanceScript -PathType Leaf)) {
            throw "Runner maintenance script not found: $maintenanceScript"
          }
          . $maintenanceScript
          $maintenanceExitCode = Invoke-WindowsRunnerMaintenance `
            -UnityVersions '${{ matrix.unity-version }}' `
            -ProvisioningProfile $provisioningProfile `
            -DiagnosticsRoot $maintenanceDiagnosticsRoot
          if ($maintenanceExitCode -ne 0) {
            throw "Runner maintenance failed with exit code $maintenanceExitCode."
          }
          $pwshCandidates = @(
            (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7\pwsh.exe' })
          )
          $pathPwsh = Get-Command pwsh -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if ($pathPwsh -and $pathPwsh -notlike '*\Microsoft\WindowsApps\pwsh.exe') {
            $pwshCandidates += $pathPwsh
          }
          $pwshCandidates = @(
            $pwshCandidates |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique
          )
          $pwshPath = @($pwshCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })[0]
          if (-not $pwshPath) {
            throw 'PowerShell 7 maintenance completed, but pwsh.exe was not found for later GitHub Actions steps.'
          }
          $pwshDirectory = Split-Path -Parent $pwshPath
          $pwshDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Added PowerShell 7 to GITHUB_PATH: $pwshDirectory"

      - name: Print runner diagnostics
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        # Composite action runs PowerShell internally; `shell: bash` on a
        # self-hosted Windows runner can resolve to the WSL stub at
        # C:\Windows\System32\bash.exe and fail with "Windows Subsystem
        # for Linux has no installed distributions." Never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "default (organization lock wraps the Unity section)"

      - name: Validate Unity license secrets
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # Skip provisioning, the org lock, and the run when no unity-helpers test
      # assembly matched this target (compute step resolved an empty list). The
      # verify step runs only after compute succeeds and is told the run was an
      # expected skip via the expected-empty input. This never triggers for the
      # current asmdef set; it is the robustness path for a target with no
      # matching assemblies. If checkout/cache/setup fails before compute, let
      # that setup failure stand on its own instead of adding a misleading
      # "tests did not run" annotation for a Unity run that never started.
      - name: Provision Unity Editor
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        timeout-minutes: 180
        shell: pwsh
        run: |
          $artifactsPath = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}'
          $diagnosticsPath = Join-Path $artifactsPath 'provisioning'
          $diagnosticsFile = Join-Path $diagnosticsPath 'ensure-editor-summary.json'
          New-Item -ItemType Directory -Force -Path $diagnosticsPath | Out-Null
          $provisioningProfile = if ('${{ matrix.test-mode }}' -eq 'standalone') {
            'StandaloneWindowsIl2Cpp'
          } else {
            'EditorOnly'
          }
          $editor = ./scripts/unity/ensure-editor.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -CiManagedOnly `
            -RequireHealthyExisting `
            -ProvisioningProfile $provisioningProfile `
            -DiagnosticsPath $diagnosticsFile
          "UNITY_EDITOR_PATH=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unity provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-provisioning-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}/provisioning
          if-no-files-found: warn
          retention-days: 14

      - name: Require current PR head before lock acquisition
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Run Unity Test Runner
        id: run_tests
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        # Per-mode timeout, sized from measurement rather than fear. Across the 60
        # most recent Unity Tests runs (~430 leg instances) the slowest this step
        # has EVER been is 9.1 min (editmode), with standalone topping out at
        # 8.7 min. 40/60 keeps >4x headroom over that worst case -- enough for a
        # cold import on a fresh runner -- while cutting what a HANG costs: every
        # leg serializes on the one organization Unity seat, and a lock wait of
        # 91 min has been measured behind a stuck leg, so an oversized step clock
        # turns one hang into org-wide starvation. Standalone keeps the larger
        # budget because it also builds an IL2CPP player. Both stay under the job
        # timeout (1200) so the step clock fires first and releases the seat.
        timeout-minutes: ${{ (matrix.test-mode == 'standalone' && 60) || 40 }}
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          # Stream per-test results to unity.log as each test finishes (editor-side
          # CiTestResultStreamLogger). When a PlayMode run aborts/reloads mid-run and
          # serializes a misleading total=0 results.xml, the streamed lines still name
          # the last test that ran -- the key to diagnosing the total=0 legs.
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          # -ProjectRoot puts the generated project and its Library OUTSIDE
          # $GITHUB_WORKSPACE. actions/checkout runs `git clean -ffdx` at the top of
          # every job and `-x` means gitignored, so while the project lived under
          # .artifacts/ every job deleted the Library the previous job had just built
          # on that same disk -- and the repo paid an actions/cache round trip to put
          # it back (measured across the 60 most recent runs: 109 min of restore,
          # 119 min of save, all on the single serialized organization Unity seat).
          # RUNNER_WORKSPACE is the checkout's parent, which git clean cannot reach.
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode '${{ matrix.test-mode }}' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration '${{ matrix.test-mode == 'standalone' && 'Debug' || 'Release' }}'

      # Surface the slowest fixtures/cases every run (the measurement backbone for
      # keeping the suite fast). Warn at 120s/fixture; add -FailOverBudget once the
      # budget is tight enough to enforce as a hard wall-clock gate.
      - name: Report slowest tests
        if: ${{ always() && steps.compute.outputs.is-empty != 'true' }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/return-unity-license
        with:
          prior-return-log-path: ${{ runner.temp }}/unity-return-${{ matrix.unity-version }}-${{ matrix.test-mode }}.log
          prior-command-succeeded: ${{ steps.run_tests.outcome == 'success' }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: ${{ always() && (steps.unity_lock.outcome == 'success' || steps.unity_lock.outcome == 'failure' || steps.unity_lock.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.return_unity_license.outputs.resource-health }}
          resource-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@673eb65e7d863a1a8a8a70882bd980e189d41754
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.return_unity_license.outputs.classification-complete }}
          cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.return_unity_license.outputs.resource-health }}
          cleanup-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

      - name: Delete private Unity cleanup evidence
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        shell: pwsh
        env:
          RETURN_LOG_PATH: ${{ steps.return_unity_license.outputs.return-log-path }}
          SUPPLEMENTAL_EVIDENCE_PATHS: ${{ steps.return_unity_license.outputs.supplemental-evidence-paths }}
        run: |
          $evidencePaths = @($env:RETURN_LOG_PATH) + @($env:SUPPLEMENTAL_EVIDENCE_PATHS -split "`r?`n")
          foreach ($evidencePath in @($evidencePaths | Sort-Object -Unique)) {
            if (-not [string]::IsNullOrWhiteSpace($evidencePath) -and (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Remove-Item -LiteralPath $evidencePath -Force
            }
          }

      # CANCELLATION + TIMEOUT DIAGNOSTIC: when Unity hangs in csc the runner
      # step times out (or the operator cancels), and the verify step below
      # skips -- so its catastrophic-pattern scan never fires either. This step
      # covers both failure() AND cancelled() so the operator has SOMETHING to
      # look at in the GitHub summary (the tail of unity.log + any catastrophic
      # patterns the partial log happened to surface). Best-effort: never fails
      # the job, no-ops when unity.log doesn't exist (cancellation before Unity
      # launched).
      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}

      # CLASS GUARD: Unity can fail before NUnit writes results. The shared
      # composite fails unless a results XML exists AND reports total > 0.
      # Skip on cancellation so a user-cancelled run does not emit the
      # generic "tests did not run" annotation -- the cancellation itself
      # is the explanation. Also skip if setup/provisioning/lock work failed
      # before the Unity run step attempted; that earlier failure is then the
      # actionable signal. The guard still runs for intentional empty targets,
      # after a Unity-run failure (to surface "tests did not run" /
      # catastrophic-compile diagnostics), and on success (to confirm a real
      # result XML exists).
      - name: Verify tests actually ran
        if: >-
          ${{
            !cancelled() &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_tests.outcome != 'skipped')
          }}
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          if-no-files-found: warn
          retention-days: 14

  # GATED STANDALONE tier: the expensive IL2CPP player legs. `needs: unity-tests`
  # means any failure in the fast tier (a compile error in an editmode leg, a mass
  # runtime failure in any editmode/playmode leg) SKIPS this whole job -- the
  # ~30-min-each standalone builds never start on a fundamentally-broken PR. On a
  # green fast tier this runs exactly as before; because the org build-lock
  # serializes every leg onto the one Unity seat, standalone already ran last, so
  # gating it costs zero wall-clock. The steps are intentionally identical to
  # unity-tests -- the `matrix.test-mode == 'standalone'` inline conditionals select
  # the IL2CPP provisioning profile, Debug C++ config, and 150-min timeout, and
  # matrix.test-mode is always 'standalone' here. The `!= '[]'` if-guard skips the
  # job (instead of erroring on an empty matrix) for single-mode dispatch pins,
  # which run entirely in the fast tier.
  unity-tests-standalone:
    name: Unity standalone (gated)
    needs:
      - matrix-config
      - runner-preflight
      - unity-tests
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.matrix-config.outputs.has-required-secrets == 'true' &&
        needs.matrix-config.outputs.matrix-include-standalone != '[]' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1200
    strategy:
      fail-fast: false
      # No max-parallel, for the reason recorded on the fast tier above: capping
      # eligibility turns every completion into a slow self-hosted dispatch
      # transition. This tier is where it cost the most -- the four standalone legs
      # were created at +32.0 min and the first started at +42.1, both runners idle
      # throughout.
      matrix:
        # Standalone-tier include from matrix-config (empty -> this job is skipped
        # by the if-guard above -- single-mode dispatch pins run in the fast tier).
        include: ${{ fromJSON(needs.matrix-config.outputs.matrix-include-standalone) }}
    steps:
      - name: Require current PR head before setup
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.18.0"

      # Single source of truth for the assembly include list: the same
      # asmdef-discovery.js module the local discovery uses. Extracted into a
      # composite action so all Unity workflows share one implementation.
      # Uses Windows PowerShell inside the composite so empty legs can be skipped
      # before runner maintenance installs or repairs PowerShell 7 / Unity.
      - name: Compute test assembly list
        id: compute
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: "${{ matrix.test-mode }}"
          runtime-only: "${{ matrix.test-mode == 'standalone' && 'true' || 'false' }}"
          # Run the DI-container integration suites (Reflex / VContainer / Zenject)
          # alongside core on EVERY version x mode leg. The matching run step passes
          # -IncludeIntegrations so the 3 packages are installed into the ephemeral
          # manifest; without that the integration assemblies would not compile.
          include-integrations: "true"

      - name: Maintain Unity editor on selected runner
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        timeout-minutes: 360
        shell: powershell
        run: |
          $artifactsPath = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}'
          $maintenanceDiagnosticsRoot = Join-Path $artifactsPath 'provisioning/runner-maintenance'
          New-Item -ItemType Directory -Force -Path $maintenanceDiagnosticsRoot | Out-Null
          $provisioningProfile = if ('${{ matrix.test-mode }}' -eq 'standalone') {
            'StandaloneWindowsIl2Cpp'
          } else {
            'EditorOnly'
          }
          $maintenanceScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\unity\maintain-windows-runner.ps1'
          if (-not (Test-Path -LiteralPath $maintenanceScript -PathType Leaf)) {
            throw "Runner maintenance script not found: $maintenanceScript"
          }
          . $maintenanceScript
          $maintenanceExitCode = Invoke-WindowsRunnerMaintenance `
            -UnityVersions '${{ matrix.unity-version }}' `
            -ProvisioningProfile $provisioningProfile `
            -DiagnosticsRoot $maintenanceDiagnosticsRoot
          if ($maintenanceExitCode -ne 0) {
            throw "Runner maintenance failed with exit code $maintenanceExitCode."
          }
          $pwshCandidates = @(
            (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7\pwsh.exe' })
          )
          $pathPwsh = Get-Command pwsh -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if ($pathPwsh -and $pathPwsh -notlike '*\Microsoft\WindowsApps\pwsh.exe') {
            $pwshCandidates += $pathPwsh
          }
          $pwshCandidates = @(
            $pwshCandidates |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique
          )
          $pwshPath = @($pwshCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })[0]
          if (-not $pwshPath) {
            throw 'PowerShell 7 maintenance completed, but pwsh.exe was not found for later GitHub Actions steps.'
          }
          $pwshDirectory = Split-Path -Parent $pwshPath
          $pwshDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Added PowerShell 7 to GITHUB_PATH: $pwshDirectory"

      - name: Print runner diagnostics
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        # Composite action runs PowerShell internally; `shell: bash` on a
        # self-hosted Windows runner can resolve to the WSL stub at
        # C:\Windows\System32\bash.exe and fail with "Windows Subsystem
        # for Linux has no installed distributions." Never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "gated standalone (organization lock wraps the Unity section)"

      - name: Validate Unity license secrets
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # Skip provisioning, the org lock, and the run when no unity-helpers test
      # assembly matched this target (compute step resolved an empty list). The
      # verify step runs only after compute succeeds and is told the run was an
      # expected skip via the expected-empty input. This never triggers for the
      # current asmdef set; it is the robustness path for a target with no
      # matching assemblies. If checkout/cache/setup fails before compute, let
      # that setup failure stand on its own instead of adding a misleading
      # "tests did not run" annotation for a Unity run that never started.
      - name: Provision Unity Editor
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        timeout-minutes: 180
        shell: pwsh
        run: |
          $artifactsPath = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}'
          $diagnosticsPath = Join-Path $artifactsPath 'provisioning'
          $diagnosticsFile = Join-Path $diagnosticsPath 'ensure-editor-summary.json'
          New-Item -ItemType Directory -Force -Path $diagnosticsPath | Out-Null
          $provisioningProfile = if ('${{ matrix.test-mode }}' -eq 'standalone') {
            'StandaloneWindowsIl2Cpp'
          } else {
            'EditorOnly'
          }
          $editor = ./scripts/unity/ensure-editor.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -CiManagedOnly `
            -RequireHealthyExisting `
            -ProvisioningProfile $provisioningProfile `
            -DiagnosticsPath $diagnosticsFile
          "UNITY_EDITOR_PATH=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unity provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-provisioning-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}/provisioning
          if-no-files-found: warn
          retention-days: 14

      - name: Require current PR head before lock acquisition
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Run Unity Test Runner
        id: run_tests
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        # Per-mode timeout, sized from measurement rather than fear. Across the 60
        # most recent Unity Tests runs (~430 leg instances) the slowest this step
        # has EVER been is 9.1 min (editmode), with standalone topping out at
        # 8.7 min. 40/60 keeps >4x headroom over that worst case -- enough for a
        # cold import on a fresh runner -- while cutting what a HANG costs: every
        # leg serializes on the one organization Unity seat, and a lock wait of
        # 91 min has been measured behind a stuck leg, so an oversized step clock
        # turns one hang into org-wide starvation. Standalone keeps the larger
        # budget because it also builds an IL2CPP player. Both stay under the job
        # timeout (1200) so the step clock fires first and releases the seat.
        timeout-minutes: ${{ (matrix.test-mode == 'standalone' && 60) || 40 }}
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          # Stream per-test results to unity.log as each test finishes (editor-side
          # CiTestResultStreamLogger). When a PlayMode run aborts/reloads mid-run and
          # serializes a misleading total=0 results.xml, the streamed lines still name
          # the last test that ran -- the key to diagnosing the total=0 legs.
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode '${{ matrix.test-mode }}' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration '${{ matrix.test-mode == 'standalone' && 'Debug' || 'Release' }}'

      # Surface the slowest fixtures/cases every run (the measurement backbone for
      # keeping the suite fast). Warn at 120s/fixture; add -FailOverBudget once the
      # budget is tight enough to enforce as a hard wall-clock gate.
      - name: Report slowest tests
        if: ${{ always() && steps.compute.outputs.is-empty != 'true' }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/return-unity-license
        with:
          prior-return-log-path: ${{ runner.temp }}/unity-return-${{ matrix.unity-version }}-${{ matrix.test-mode }}.log
          prior-command-succeeded: ${{ steps.run_tests.outcome == 'success' }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: ${{ always() && (steps.unity_lock.outcome == 'success' || steps.unity_lock.outcome == 'failure' || steps.unity_lock.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.return_unity_license.outputs.resource-health }}
          resource-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@673eb65e7d863a1a8a8a70882bd980e189d41754
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.return_unity_license.outputs.classification-complete }}
          cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.return_unity_license.outputs.resource-health }}
          cleanup-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

      - name: Delete private Unity cleanup evidence
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        shell: pwsh
        env:
          RETURN_LOG_PATH: ${{ steps.return_unity_license.outputs.return-log-path }}
          SUPPLEMENTAL_EVIDENCE_PATHS: ${{ steps.return_unity_license.outputs.supplemental-evidence-paths }}
        run: |
          $evidencePaths = @($env:RETURN_LOG_PATH) + @($env:SUPPLEMENTAL_EVIDENCE_PATHS -split "`r?`n")
          foreach ($evidencePath in @($evidencePaths | Sort-Object -Unique)) {
            if (-not [string]::IsNullOrWhiteSpace($evidencePath) -and (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Remove-Item -LiteralPath $evidencePath -Force
            }
          }

      # CANCELLATION + TIMEOUT DIAGNOSTIC: when Unity hangs in csc the runner
      # step times out (or the operator cancels), and the verify step below
      # skips -- so its catastrophic-pattern scan never fires either. This step
      # covers both failure() AND cancelled() so the operator has SOMETHING to
      # look at in the GitHub summary (the tail of unity.log + any catastrophic
      # patterns the partial log happened to surface). Best-effort: never fails
      # the job, no-ops when unity.log doesn't exist (cancellation before Unity
      # launched).
      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}

      # CLASS GUARD: Unity can fail before NUnit writes results. The shared
      # composite fails unless a results XML exists AND reports total > 0.
      # Skip on cancellation so a user-cancelled run does not emit the
      # generic "tests did not run" annotation -- the cancellation itself
      # is the explanation. Also skip if setup/provisioning/lock work failed
      # before the Unity run step attempted; that earlier failure is then the
      # actionable signal. The guard still runs for intentional empty targets,
      # after a Unity-run failure (to surface "tests did not run" /
      # catastrophic-compile diagnostics), and on success (to confirm a real
      # result XML exists).
      - name: Verify tests actually ran
        if: >-
          ${{
            !cancelled() &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_tests.outcome != 'skipped')
          }}
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }}
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-${{ matrix.test-mode }}
          path: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}
          if-no-files-found: warn
          retention-days: 14

  # SINGLE_THREADED leg. The default matrix never exercises the SINGLE_THREADED
  # code paths (Runtime/Core/DataStructure/Cache.cs et al. gate thread-safe vs
  # single-threaded behavior on `#if SINGLE_THREADED`, OFF by default). This job
  # builds+tests with SINGLE_THREADED (and WALLSTOP_CONCAVE_HULL_STATS) defined as
  # GLOBAL scripting symbols so EVERY asmdef test assembly compiles the
  # single-threaded path. Restricted to Unity 6 (6000.3.16f1) editmode+playmode to
  # keep time small (no IL2CPP standalone build). Core-only (no integrations): the
  # single-threaded toggle is a core-runtime concern, so installing the DI packages
  # would only add cost. It is a SEPARATE job from unity-tests but shares the SAME
  # self-hosted Unity seat. This job depends on both Unity tiers so same-workflow
  # jobs do not contend with each other for the org lock; the external
  # `wallstop-organization-builds` lock still serializes this work against other
  # workflows and runs. Reuses the same secrets gate, runner-preflight,
  # provisioning, perf-category exclusion, verify-results, and artifact-upload
  # scaffolding as unity-tests, with DISTINCT project/Library/artifact paths
  # (suffix `-single-threaded`) so its differently-compiled Library never collides
  # with or poisons the default matrix's `6000.3.16f1-{mode}` cache.
  unity-tests-single-threaded:
    name: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }} (SINGLE_THREADED)
    needs:
      - matrix-config
      - runner-preflight
      - unity-tests
      - unity-tests-standalone
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.matrix-config.result == 'success' &&
        needs.runner-preflight.result == 'success' &&
        needs.unity-tests.result == 'success' &&
        (needs.unity-tests-standalone.result == 'success' ||
          needs.unity-tests-standalone.result == 'skipped') &&
        needs.matrix-config.outputs.has-required-secrets == 'true' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1200
    strategy:
      fail-fast: false
      # No max-parallel, for the reason recorded on the fast tier above.
      matrix:
        # Unity 6 ONLY (6000.3.16f1) to keep the extra leg cheap. editmode + playmode
        # only -- both are fast in-editor runs; the SINGLE_THREADED path does not need
        # a standalone IL2CPP player build to be exercised.
        unity-version: ["6000.3.16f1"]
        test-mode: ["editmode", "playmode"]
    steps:
      - name: Require current PR head before setup
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.18.0"

      - name: Compute test assembly list
        id: compute
        uses: ./.github/actions/compute-unity-assemblies
        with:
          target: "${{ matrix.test-mode }}"
          runtime-only: "false"

      - name: Maintain Unity editor on selected runner
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        timeout-minutes: 360
        shell: powershell
        run: |
          $artifactsPath = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded'
          $maintenanceDiagnosticsRoot = Join-Path $artifactsPath 'provisioning/runner-maintenance'
          New-Item -ItemType Directory -Force -Path $maintenanceDiagnosticsRoot | Out-Null
          $provisioningProfile = 'EditorOnly'
          $maintenanceScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\unity\maintain-windows-runner.ps1'
          if (-not (Test-Path -LiteralPath $maintenanceScript -PathType Leaf)) {
            throw "Runner maintenance script not found: $maintenanceScript"
          }
          . $maintenanceScript
          $maintenanceExitCode = Invoke-WindowsRunnerMaintenance `
            -UnityVersions '${{ matrix.unity-version }}' `
            -ProvisioningProfile $provisioningProfile `
            -DiagnosticsRoot $maintenanceDiagnosticsRoot
          if ($maintenanceExitCode -ne 0) {
            throw "Runner maintenance failed with exit code $maintenanceExitCode."
          }
          $pwshCandidates = @(
            (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'),
            $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7\pwsh.exe' })
          )
          $pathPwsh = Get-Command pwsh -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if ($pathPwsh -and $pathPwsh -notlike '*\Microsoft\WindowsApps\pwsh.exe') {
            $pwshCandidates += $pathPwsh
          }
          $pwshCandidates = @(
            $pwshCandidates |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Select-Object -Unique
          )
          $pwshPath = @($pwshCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })[0]
          if (-not $pwshPath) {
            throw 'PowerShell 7 maintenance completed, but pwsh.exe was not found for later GitHub Actions steps.'
          }
          $pwshDirectory = Split-Path -Parent $pwshPath
          $pwshDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Added PowerShell 7 to GITHUB_PATH: $pwshDirectory"

      - name: Print runner diagnostics
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        # Composite action runs PowerShell internally; `shell: bash` on a
        # self-hosted Windows runner can resolve to the WSL stub and fail. Never
        # use plain `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "single-threaded (organization lock wraps the Unity section)"

      - name: Validate Unity license secrets
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Provision Unity Editor
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        timeout-minutes: 180
        shell: pwsh
        run: |
          $artifactsPath = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded'
          $diagnosticsPath = Join-Path $artifactsPath 'provisioning'
          $diagnosticsFile = Join-Path $diagnosticsPath 'ensure-editor-summary.json'
          New-Item -ItemType Directory -Force -Path $diagnosticsPath | Out-Null
          $editor = ./scripts/unity/ensure-editor.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -CiManagedOnly `
            -RequireHealthyExisting `
            -ProvisioningProfile 'EditorOnly' `
            -DiagnosticsPath $diagnosticsFile
          "UNITY_EDITOR_PATH=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unity provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-provisioning-${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded
          path: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded/provisioning
          if-no-files-found: warn
          retention-days: 14

      - name: Require current PR head before lock acquisition
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Run Unity Test Runner
        id: run_tests
        if: ${{ steps.compute.outputs.is-empty != 'true' }}
        # editmode + playmode ONLY (no standalone IL2CPP build). Measured worst case
        # for this leg across the 60 most recent runs is 7.8 min, so 40 keeps >5x
        # headroom while failing a hang 50 min sooner than the old 90 -- the
        # organization Unity seat is a single serialized resource, and a stuck leg
        # holds it for exactly this long. See the default matrix job for the full
        # measurement note. Stays under the job timeout (1200).
        timeout-minutes: 40
        shell: pwsh
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          # Stream per-test results to unity.log as each test finishes (editor-side
          # CiTestResultStreamLogger). When a PlayMode run aborts/reloads mid-run and
          # serializes a misleading total=0 results.xml, the streamed lines still name
          # the last test that ran -- the key to diagnosing the total=0 legs.
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode '${{ matrix.test-mode }}' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -ProjectScope 'single-threaded' `
            -AdditionalScriptingDefines SINGLE_THREADED,WALLSTOP_CONCAVE_HULL_STATS `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      # Surface the slowest fixtures/cases for the SINGLE_THREADED leg (the 40-min
      # leg the optimization targets). Warn-only; see the main job's note.
      - name: Report slowest tests
        if: ${{ always() && steps.compute.outputs.is-empty != 'true' }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/return-unity-license
        with:
          prior-return-log-path: ${{ runner.temp }}/unity-return-${{ matrix.unity-version }}-${{ matrix.test-mode }}.log
          prior-command-succeeded: ${{ steps.run_tests.outcome == 'success' }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: ${{ always() && (steps.unity_lock.outcome == 'success' || steps.unity_lock.outcome == 'failure' || steps.unity_lock.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.return_unity_license.outputs.resource-health }}
          resource-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@673eb65e7d863a1a8a8a70882bd980e189d41754
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.return_unity_license.outputs.classification-complete }}
          cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.return_unity_license.outputs.resource-health }}
          cleanup-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

      - name: Delete private Unity cleanup evidence
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        shell: pwsh
        env:
          RETURN_LOG_PATH: ${{ steps.return_unity_license.outputs.return-log-path }}
          SUPPLEMENTAL_EVIDENCE_PATHS: ${{ steps.return_unity_license.outputs.supplemental-evidence-paths }}
        run: |
          $evidencePaths = @($env:RETURN_LOG_PATH) + @($env:SUPPLEMENTAL_EVIDENCE_PATHS -split "`r?`n")
          foreach ($evidencePath in @($evidencePaths | Sort-Object -Unique)) {
            if (-not [string]::IsNullOrWhiteSpace($evidencePath) -and (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Remove-Item -LiteralPath $evidencePath -Force
            }
          }

      - name: Dump Unity log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }} (SINGLE_THREADED)

      - name: Verify tests actually ran
        if: >-
          ${{
            !cancelled() &&
            steps.compute.outcome == 'success' &&
            (steps.compute.outputs.is-empty == 'true' || steps.run_tests.outcome != 'skipped')
          }}
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded
          label: Unity ${{ matrix.unity-version }} ${{ matrix.test-mode }} (SINGLE_THREADED)
          expected-empty: ${{ steps.compute.outputs.is-empty }}

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded
          path: .artifacts/unity/${{ matrix.unity-version }}-${{ matrix.test-mode }}-single-threaded
          if-no-files-found: warn
          retention-days: 14

  unitypackage-smoke:
    name: Unity package export smoke
    needs:
      - matrix-config
      - runner-preflight
      - unity-tests
      - unity-tests-standalone
      - unity-tests-single-threaded
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.matrix-config.result == 'success' &&
        needs.runner-preflight.result == 'success' &&
        needs.unity-tests.result == 'success' &&
        (needs.unity-tests-standalone.result == 'success' ||
          needs.unity-tests-standalone.result == 'skipped') &&
        needs.unity-tests-single-threaded.result == 'success' &&
        needs.matrix-config.outputs.has-required-secrets == 'true' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require current PR head before setup
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.18.0"

      - name: Validate Unity license secrets
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Require current PR head before lock acquisition
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@a00614ace745152a659c5c2654f7cefb68a5a628
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: unitypackage-smoke-${{ github.run_id }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "160"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Export Unity package smoke artifact
        id: export_unitypackage
        timeout-minutes: 155
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          UNITY_VERSION="$(jq -r '.release' .github/unity-versions.json)"
          export UNITY_VERSION
          package_name="$(jq -r '.name // empty' package.json)"
          package_version="$(jq -r '.version // empty' package.json)"
          output=".artifacts/unitypackage-smoke/${package_name}-${package_version}.unitypackage"
          bash scripts/unity/export-unitypackage.sh \
            --project-dir ".artifacts/unity/unitypackage-smoke-project" \
            --output "${output}"

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/return-unity-license
        with:
          prior-return-log-path: .artifacts/unity/unitypackage-smoke-project/unitypackage-output/unity.log
          prior-command-succeeded: ${{ steps.export_unitypackage.outcome == 'success' }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: ${{ always() && (steps.unity_lock.outcome == 'success' || steps.unity_lock.outcome == 'failure' || steps.unity_lock.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@a00614ace745152a659c5c2654f7cefb68a5a628 # v1.9.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: unitypackage-smoke-${{ github.run_id }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.return_unity_license.outputs.resource-health }}
          resource-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@673eb65e7d863a1a8a8a70882bd980e189d41754
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.return_unity_license.outputs.classification-complete }}
          cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.return_unity_license.outputs.resource-health }}
          cleanup-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

      - name: Dump Unity export log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/unitypackage-smoke-project/unitypackage-output
          label: Unity package export smoke

      - name: Upload Unity package export smoke diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unitypackage-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/unity/unitypackage-smoke-project/Assets/Editor/UnityHelpersPackageExporter.cs
            .artifacts/unity/unitypackage-smoke-project/Packages/manifest.json
            .artifacts/unity/unitypackage-smoke-project/ProjectSettings/
            .artifacts/unity/unitypackage-smoke-project/unitypackage-output/*.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Delete private Unity cleanup evidence
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        shell: pwsh
        env:
          RETURN_LOG_PATH: ${{ steps.return_unity_license.outputs.return-log-path }}
          SUPPLEMENTAL_EVIDENCE_PATHS: ${{ steps.return_unity_license.outputs.supplemental-evidence-paths }}
        run: |
          $evidencePaths = @($env:RETURN_LOG_PATH) + @($env:SUPPLEMENTAL_EVIDENCE_PATHS -split "`r?`n")
          foreach ($evidencePath in @($evidencePaths | Sort-Object -Unique)) {
            if (-not [string]::IsNullOrWhiteSpace($evidencePath) -and (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Remove-Item -LiteralPath $evidencePath -Force
            }
          }

  unity-ci-success:
    name: Unity CI Success
    if: ${{ always() }}
    needs:
      - matrix-config
      - runner-preflight
      - unity-tests
      - unity-tests-standalone
      - unity-tests-single-threaded
      - unitypackage-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # matrix-config answers "has this PR moved on?" ONCE, before any leg is
      # dispatched, which only covers a push that lands before it runs. A push
      # that lands AFTER it -- while legs are queued for the single Unity seat --
      # leaves its output at `false`, so every dispatched leg then fails on its own
      # require-current-pr-head guard and this gate reports the run red. Measured
      # on run 31020762387: six legs failed, all six on
      # "Stale pull request run for <old sha>", zero on a test.
      #
      # Re-resolving here closes that window. This job runs last and on a hosted
      # runner, so it sees the head as of the moment the verdict is written.
      #
      # Fails OPEN, exactly like matrix-config's copy: any trouble resolving the
      # head leaves superseded=false, so an API hiccup costs a redundant red,
      # never a waived validation.
      - name: Re-detect superseded pull request head
        id: late_superseded
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${EXPECTED_HEAD_SHA:-}" ]; then
            echo "Not a pull request run; nothing can supersede it."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          current=""
          if ! current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
            current=""
          fi
          # Shape, not emptiness: `--jq '.head.sha'` prints the literal string
          # "null" and exits 0 when the field is absent.
          if ! printf '%s' "${current}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::Could not resolve the current head of pull request #${PR_NUMBER} (got '${current}'); reporting this run's real result."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${current}" = "${EXPECTED_HEAD_SHA}" ]; then
            echo "Pull request #${PR_NUMBER} is still at ${EXPECTED_HEAD_SHA}."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "superseded=true" >> "${GITHUB_OUTPUT}"
          echo "::notice::Superseded run for ${EXPECTED_HEAD_SHA}; pull request #${PR_NUMBER} now points to ${current}."

      - name: Require every expected Unity CI job result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REF_PROTECTED: ${{ github.ref_protected }}
          MATRIX_CONFIG_RESULT: ${{ needs.matrix-config.result }}
          MATRIX_CONFIG_SUPERSEDED: ${{ needs.matrix-config.outputs.superseded }}
          HAS_REQUIRED_SECRETS: ${{ needs.matrix-config.outputs.has-required-secrets }}
          LATE_SUPERSEDED: ${{ steps.late_superseded.outputs.superseded }}
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          STANDALONE_RESULT: ${{ needs.unity-tests-standalone.result }}
          SINGLE_THREADED_RESULT: ${{ needs.unity-tests-single-threaded.result }}
          UNITYPACKAGE_SMOKE_RESULT: ${{ needs.unitypackage-smoke.result }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${PR_HEAD_REPOSITORY}" != "${CURRENT_REPOSITORY}" ]; then
            expected="skipped"
            for result in \
              "${MATRIX_CONFIG_RESULT}" \
              "${RUNNER_PREFLIGHT_RESULT}" \
              "${UNITY_TESTS_RESULT}" \
              "${STANDALONE_RESULT}" \
              "${SINGLE_THREADED_RESULT}" \
              "${UNITYPACKAGE_SMOKE_RESULT}"; do
              if [ "${result}" != "${expected}" ]; then
                echo "::error::Unexpected Unity CI job result for an intentionally unlicensed fork PR: ${result}."
                exit 1
              fi
            done
            echo "Fork PR intentionally omitted licensed Unity jobs."
            exit 0
          fi

          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_PROTECTED}" != "true" ]; then
            echo "Unprotected push intentionally omitted licensed Unity jobs."
            exit 0
          fi

          # A run with no organization secrets -- Dependabot's separate secret
          # store is the case that reaches this -- cannot dispatch a licensed leg,
          # so every one of them is skipped by design. That is the same situation
          # as a fork PR above and is reported the same way: green, because nothing
          # failed, with the summary saying plainly that no Unity validation ran.
          #
          # It is still an assertion, not a waiver. Both hosted gates must have
          # passed and every licensed job must be `skipped`; anything else means a
          # leg ran that could not have, or a gate broke, and that is a real red.
          if [ "${HAS_REQUIRED_SECRETS}" != "true" ]; then
            if [ "${MATRIX_CONFIG_RESULT}" != "success" ] || [ "${RUNNER_PREFLIGHT_RESULT}" != "success" ]; then
              echo "::error::Run without Unity credentials, but a hosted gate did not pass: matrix-config=${MATRIX_CONFIG_RESULT}, runner-preflight=${RUNNER_PREFLIGHT_RESULT}."
              exit 1
            fi
            for pair in \
              "unity-tests=${UNITY_TESTS_RESULT}" \
              "unity-tests-standalone=${STANDALONE_RESULT}" \
              "unity-tests-single-threaded=${SINGLE_THREADED_RESULT}" \
              "unitypackage-smoke=${UNITYPACKAGE_SMOKE_RESULT}"; do
              if [ "${pair#*=}" != "skipped" ]; then
                echo "::error::Run without Unity credentials, but a licensed job did not skip: ${pair}."
                exit 1
              fi
            done
            echo "No Unity credentials on this run; the licensed Unity tiers were skipped."
            {
              echo "## Unity validation did not run"
              echo ""
              echo "This run had no Unity credentials, so every licensed tier was skipped and **no Unity test executed**."
              echo ""
              echo "The hosted gates passed and every licensed job skipped as designed, so this is reported as a pass rather than a failure."
              echo ""
              echo "Unity coverage for these changes comes from the protected-branch push after merge."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # A superseded iteration must not report failure: it never ran the
          # licensed tiers, and its check attaches to the head SHA it was queued
          # for, not to the one the pull request now points at -- so it can
          # neither gate nor authorize a merge of the current head. Reporting
          # anything else here would either mark "you pushed again" as a defect
          # or leave the run permanently pending.
          #
          # Supersession waives ONLY the four licensed results. The two hosted
          # gates still have to pass, because they run to completion regardless:
          # matrix-config resolves supersession in its second step and then goes
          # on to lint the test-project module manifest and resolve the matrix,
          # and a failed job still publishes its outputs. Short-circuiting on
          # the output alone would report green for a bogus UPM module id or an
          # offline runner fleet, which is the exact fail-fast signal those jobs
          # exist to raise.
          #
          # Two ways to be superseded, waived identically. MATRIX_CONFIG_SUPERSEDED
          # means the push beat dispatch, so the licensed tiers never started.
          # LATE_SUPERSEDED means it landed afterwards, so they started and then
          # exited on their own head guards. The reasoning above does not
          # distinguish them: either way the check attaches to a head the pull
          # request has moved past.
          if [ "${MATRIX_CONFIG_SUPERSEDED}" = "true" ] || [ "${LATE_SUPERSEDED}" = "true" ]; then
            if [ "${MATRIX_CONFIG_RESULT}" != "success" ] || [ "${RUNNER_PREFLIGHT_RESULT}" != "success" ]; then
              echo "::error::Superseded run, but a hosted gate did not pass: matrix-config=${MATRIX_CONFIG_RESULT}, runner-preflight=${RUNNER_PREFLIGHT_RESULT}."
              exit 1
            fi
            if [ "${MATRIX_CONFIG_SUPERSEDED}" = "true" ]; then
              echo "Superseded before dispatch; the licensed Unity tiers were skipped for the current head's run."
            else
              echo "Superseded after dispatch; the licensed Unity tiers exited on their head guards. The current head has its own run."
            fi
            {
              echo "## Superseded Unity run"
              echo ""
              echo "This run was queued for a head the pull request has since moved past, so its result cannot gate or authorize the current head. Reported as a no-op."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          failed="false"
          require_result() {
            job="$1"
            actual="$2"
            allowed="$3"
            case ",${allowed}," in
              *,"${actual}",*) ;;
              *)
                echo "::error::Unexpected Unity CI job result: ${job}=${actual}; expected ${allowed}."
                failed="true"
                ;;
            esac
          }

          require_result "matrix-config" "${MATRIX_CONFIG_RESULT}" "success"
          require_result "runner-preflight" "${RUNNER_PREFLIGHT_RESULT}" "success"
          require_result "unity-tests" "${UNITY_TESTS_RESULT}" "success"
          require_result "unity-tests-standalone" "${STANDALONE_RESULT}" "success,skipped"
          require_result "unity-tests-single-threaded" "${SINGLE_THREADED_RESULT}" "success"
          require_result "unitypackage-smoke" "${UNITYPACKAGE_SMOKE_RESULT}" "success"

          if [ "${failed}" = "true" ]; then
            exit 1
          fi
