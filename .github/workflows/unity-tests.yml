name: Unity Tests

# cspell:ignore lfs WSL

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      unity-version:
        description: "Pin a single Unity version. Empty = full matrix."
        required: false
        default: ""
        type: string
      test-mode:
        description: "Pin a single test mode."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - editmode
          - playmode
          - standalone

permissions:
  contents: read
  checks: write
  pull-requests: read

# Scoped to the HEAD, not just the pull request. `cancel-in-progress: false` is required -- a
# cancelled licensed job can skip license return and lock release -- but a per-PR group then makes
# every new run queue behind its predecessor. A superseded predecessor holds that group for as long
# as its legs sit in the runner queue, and a queued leg cannot reach the require-current-pr-head
# guard that would end it in two seconds. Measured on PR #351: the head had NO Unity check at all
# for two hours, while every other check was green and `main` has no branch protection to catch it.
#
# Per-head groups let the current head start immediately. Superseded legs stay harmless: the pinned
# head guard is each licensed job's first step AND runs again immediately before lock acquisition,
# so a stale leg exits without ever taking the Unity seat, and matrix-config now resolves
# supersession promptly instead of after a queue drain.
concurrency:
  group: unity-tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  matrix-config:
    name: Resolve Unity test matrix
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      unity-versions: ${{ steps.resolve.outputs.unity-versions }}
      test-modes: ${{ steps.resolve.outputs.test-modes }}
      matrix-exclude: ${{ steps.resolve.outputs.matrix-exclude }}
      editmode-integration-assemblies: ${{ steps.assemblies.outputs.editmode_integrations }}
      playmode-integration-assemblies: ${{ steps.assemblies.outputs.playmode_integrations }}
      standalone-integration-assemblies: ${{ steps.assemblies.outputs.standalone_integrations }}
      editmode-core-assemblies: ${{ steps.assemblies.outputs.editmode_core }}
      playmode-core-assemblies: ${{ steps.assemblies.outputs.playmode_core }}
      integration-assembly-profiles: ${{ steps.assemblies.outputs.integration_profiles }}
      core-assembly-profiles: ${{ steps.assemblies.outputs.core_profiles }}
      superseded: ${{ steps.superseded.outputs.superseded }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js for assembly discovery
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"

      # Assembly compatibility depends on target mode and integration opt-in,
      # never on Unity version. Compute each distinct list once on this hosted
      # job instead of installing Node and walking every asmdef again inside
      # each self-hosted Unity leg.
      - name: Resolve Unity test assembly lists
        id: assemblies
        run: |
          node <<'NODE'
          const fs = require("fs");
          const discovery = require("./scripts/unity/lib/asmdef-discovery.js");

          const profiles = {
            editmode_integrations: { target: "editmode", includeIntegrations: true },
            playmode_integrations: { target: "playmode", includeIntegrations: true },
            standalone_integrations: {
              target: "standalone",
              runtimeOnly: true,
              includeIntegrations: true
            },
            editmode_core: { target: "editmode", editorOnly: true },
            playmode_core: { target: "playmode" }
          };
          const resolved = Object.fromEntries(Object.entries(profiles).map(([name, options]) => {
            const assemblies = discovery.defaultIncludeAssemblies(process.cwd(), options).join(";");
            return [name, assemblies];
          }));
          const lines = Object.entries(resolved).map(([name, assemblies]) =>
            `${name}=${assemblies}`
          );
          lines.push(`integration_profiles=${JSON.stringify({
            editmode: resolved.editmode_integrations,
            playmode: resolved.playmode_integrations,
            standalone: resolved.standalone_integrations
          })}`);
          lines.push(`core_profiles=${JSON.stringify({
            editmode: resolved.editmode_core,
            playmode: resolved.playmode_core
          })}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`, "utf8");
          NODE

      # Resolve "has this PR moved on?" ONCE, here, on a hosted runner.
      #
      # Every licensed leg re-checks the head immediately before setup and again
      # before lock acquisition, but those guards fire only after the leg has
      # already been dispatched -- and a dispatch means waiting in line for the
      # single self-hosted Unity seat. A stale iteration therefore burned eight
      # queue slots to do nothing, and because this workflow's concurrency group
      # cannot cancel in progress (a leg may be holding the org Unity license),
      # the successor run stayed `pending` behind it for as long as that took.
      # Observed on run 30963202461: two legs still queued 45 minutes after the
      # head moved, with the successor run never started.
      #
      # Skipping the licensed tiers instead lets a superseded run complete in
      # seconds and hand the concurrency group to the run that matters. The
      # per-leg guards stay as defense in depth for a push that lands after this
      # step has already answered.
      #
      # Fails OPEN: any API trouble resolving the head leaves superseded=false,
      # so an unreachable API costs a redundant run, never a skipped validation.
      - name: Detect superseded pull request head
        id: superseded
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${EXPECTED_HEAD_SHA:-}" ]; then
            echo "Not a pull request run; nothing can supersede it."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          current=""
          if ! current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
            current=""
          fi
          # Shape, not emptiness: `--jq '.head.sha'` prints the literal string
          # "null" and exits 0 when the field is absent, and "null" compares
          # unequal to any real SHA -- an API anomaly would otherwise skip every
          # licensed tier, the one thing this step must never do.
          if ! printf '%s' "${current}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::Could not resolve the current head of pull request #${PR_NUMBER} (got '${current}'); proceeding as current."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${current}" = "${EXPECTED_HEAD_SHA}" ]; then
            echo "Pull request #${PR_NUMBER} is still at ${EXPECTED_HEAD_SHA}."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "superseded=true" >> "${GITHUB_OUTPUT}"
          echo "::notice::Superseded run for ${EXPECTED_HEAD_SHA}; pull request #${PR_NUMBER} now points to ${current}. Skipping the licensed Unity tiers."
          {
            echo "## Superseded Unity run"
            echo ""
            echo "This run was queued for \`${EXPECTED_HEAD_SHA}\`; pull request #${PR_NUMBER} now points to \`${current}\`."
            echo "The licensed Unity tiers were skipped so the run for the current head can start immediately."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Fail FAST on a bad test-project module manifest before any (expensive,
      # self-hosted) Unity leg starts. A non-existent UPM id here -- e.g. the
      # bogus 'com.unity.modules.grid' (declare com.unity.modules.tilemap for
      # Grid) -- makes every matrix leg fail ~30 min later with no NUnit
      # results.xml and no clearly-named cause. This
      # hosted-runner check turns that whole class into an instant, self-
      # describing red on the PR. run-ci-tests.ps1's catastrophic-pattern scan is
      # the in-Unity backstop for the same failure.
      - name: Validate Unity test-project module manifest
        shell: pwsh
        run: ./scripts/lint-unity-test-modules.ps1 -VerboseOutput

      # NOTE: DxMessaging had a "ci-owned docs-only PR" detection here that
      # skipped the licensed matrix when a PR touched ONLY its perf-numbers doc
      # + baseline. unity-helpers has no such CI-owned perf-doc auto-commit on
      # the PR path (the unity-benchmarks workflow commits perf results from a
      # SCHEDULED run, not a PR), so that detection is intentionally DROPPED for
      # simplicity. If a perf-doc auto-update PR flow is added later, repoint a
      # docs-only gate at docs/performance/ rather than DxMessaging's
      # docs/architecture/performance.md path.
      - name: Resolve dispatch overrides
        id: resolve
        env:
          INPUT_UNITY_VERSION: ${{ inputs.unity-version }}
          INPUT_TEST_MODE: ${{ inputs.test-mode }}
        run: node scripts/unity/resolve-test-matrix.js

      # NOTE: this job deliberately holds NO `secrets.*` reference. It used to read
      # UNITY_SERIAL/UNITY_EMAIL/UNITY_PASSWORD/BUILD_LOCK_APP_ID/BUILD_LOCK_APP_PRIVATE_KEY
      # purely to emit a `has-secrets` boolean, and a source-free audit cannot see
      # that intent: it sees five licensing credentials in an unlicensed job's scope
      # and classifies the job as capable of activating an editor, then measures it
      # against paid-serial contracts (lock acquire, license return, cleanup gate,
      # typed release) that a matrix resolver can never satisfy. The licensed-CI
      # signal now comes from runner-preflight, which already holds build-lock
      # credentials for work it actually does. See #596 and #322.

  runner-preflight:
    name: Self-hosted runner access preflight
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      # "Does this run carry the organization CI credential store?" -- the single
      # gate every licensed tier reads. It is answered HERE because this job
      # already holds build-lock credentials to do its own work, so publishing the
      # answer adds no credential to any additional scope and no dependency edge
      # (every licensed job already `needs:` this one).
      #
      # The reader App, the writer App and the Unity serial are provisioned
      # together as one organization credential set, so the reader's presence is
      # the run's access to that set. It is not a claim that the other halves are
      # individually correct, and it does not have to be: every licensed job runs
      # `Validate Unity license secrets` before it acquires the lock, and that
      # step names exactly which of UNITY_SERIAL / UNITY_EMAIL / UNITY_PASSWORD /
      # BUILD_LOCK_APP_ID / BUILD_LOCK_APP_PRIVATE_KEY is missing and fails the
      # job in seconds.
      #
      # It cannot run any earlier than it does, and the ordering is deliberate:
      # `Validate Unity license secrets` is a LOCAL composite action, so it needs
      # `Checkout` first, while `Require manually installed Unity editor` runs
      # before `Checkout` on purpose -- the editor authority has to settle before
      # any repository-controlled code is on disk. Both halves of that ordering
      # are enforced by scripts/tests/test-unity-workflow-matrix-contract.ps1
      # (Test-UnityJobUsesCentralEditorGate). So a half-configured repository
      # pays one ensure-unity-editor step -- capped at ten minutes, and a no-op on
      # a runner that already holds the editor -- and then gets a loud, actionable
      # red instead of a doomed activation.
      org-credentials: ${{ steps.credentials.outputs.present }}
    steps:
      # This job is the only one in the workflow that reached for organization
      # secrets without first asking whether this run has any. Dependabot runs use
      # a separate secret store, so `reader-app-id` arrived empty and the action
      # failed closed with "Missing required input" -- on every dependency PR,
      # forever, while `matrix-config` had already (correctly) skipped the licensed
      # tiers those credentials exist to serve. Preflighting a runner fleet nothing
      # is going to dispatch to is not a gate, it is a guaranteed red.
      #
      # The check is done here rather than in the job's `if:` on purpose: the
      # `secrets` context is unavailable in a job-level condition, and reading it
      # through `needs.matrix-config` would put this job behind a barrier it does
      # not otherwise need.
      - name: Detect build-lock reader credentials
        id: credentials
        env:
          READER_APP_ID: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          READER_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${READER_APP_ID:-}" ] && [ -n "${READER_APP_PRIVATE_KEY:-}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "present=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::No build-lock reader credentials on this run, so the licensed Unity tiers are skipped and there is no runner fleet to preflight."

      - name: Require an online Unity runner
        if: ${{ steps.credentials.outputs.present == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB"]]'

  # Group all selected modes by Unity version. Each version pays checkout,
  # provisioning, organization-lock acquisition, and central cleanup once while
  # each mode retains its own activation, project, results, verification, and artifacts.
  unity-tests:
    name: Unity ${{ matrix.unity-version }} (selected modes)
    needs:
      - matrix-config
      - runner-preflight
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.runner-preflight.outputs.org-credentials == 'true' &&
        needs.matrix-config.outputs.test-modes != '[]' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1200
    strategy:
      # A sibling may hold a Unity license, so matrix failures must never cancel
      # another leg before its license-return and lock-release cleanup completes.
      fail-fast: false
      # No max-parallel. It used to be 2 -- one slot per Unity runner -- which
      # sounds like it matches capacity and is in fact the thing that wastes it:
      # `max-parallel` makes only N matrix jobs *eligible*, so every completion is
      # a fresh dispatch transition, and dispatch to a self-hosted runner is what
      # is slow here. Measured on run 31130259492 (main, green): 16 legs, 70.9 min
      # of work, 2 runners -- a 35.5 min packing floor against an 88 min wall
      # clock. ELI-MACHINE finished a leg at +9.4 min and sat idle until +22.8 with
      # four legs queued; no sibling repo touched the runners in that window
      # (checked DxMessaging, DoxReloaded, IshoBoy, qora-redux), and the
      # organization Unity lock acquired in 2-4 s on all 15 licensed legs, so
      # neither contention explains it.
      #
      # Concurrency is still bounded by the runner pool: a self-hosted runner takes
      # one job at a time, and the organization lock guards the Unity seat. The
      # trade-off accepted here is politeness -- a sibling repo's Unity job can now
      # queue behind more of ours at once.
      matrix:
        unity-version:
          - 2021.3.45f1
          - 2022.3.45f1
          - 6000.3.16f1
          - 6000.5.2f1
        exclude: ${{ fromJSON(needs.matrix-config.outputs.matrix-exclude) }}
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          unity-version: ${{ matrix.unity-version }}
          install-root: ${{ runner.tool_cache }}\u6-v3
          provisioning-profile: ${{ contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && 'StandaloneWindowsIl2Cpp' || 'EditorOnly' }}
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        with:
          persist-credentials: false

      - name: Print runner diagnostics
        # Composite action runs PowerShell internally; `shell: bash` on a
        # self-hosted Windows runner can resolve to the WSL stub at
        # C:\Windows\System32\bash.exe and fail with "Windows Subsystem
        # for Linux has no installed distributions." Never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "default (organization lock wraps the Unity section)"

      - name: Validate Unity license secrets
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require current PR head before lock acquisition
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-tests
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require organization Unity lock acquisition
        id: require_unity_lock
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          ACQUIRED: ${{ steps.unity_lock.outputs.acquired }}
        run: |
          if ($env:ACQUIRED -ne 'true') {
            throw 'The organization Unity lock was not acquired; selected modes cannot be waived.'
          }

      - name: Run EditMode tests
        id: run_editmode
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') }}
        continue-on-error: true
        # Per-mode timeout, sized from measurement rather than fear. Across the 60
        # most recent Unity Tests runs (~430 leg instances) the slowest this step
        # has EVER been is 9.1 min (editmode), with standalone topping out at
        # 8.7 min. 40/60 keeps >4x headroom over that worst case -- enough for a
        # cold import on a fresh runner -- while cutting what a HANG costs: a
        # 91-minute wait has been measured behind a stuck licensed leg, so an
        # oversized step clock strands one runner and delays queued organization
        # work. Standalone keeps the larger
        # budget because it also builds an IL2CPP player. Both stay under the job
        # timeout (1200) so workflow cleanup can release or quarantine the seat.
        timeout-minutes: 40
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.editmode-integration-assemblies }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          # Stream per-test results to unity.log as each test finishes (editor-side
          # CiTestResultStreamLogger). When a PlayMode run aborts/reloads mid-run and
          # serializes a misleading total=0 results.xml, the streamed lines still name
          # the last test that ran -- the key to diagnosing the total=0 legs.
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-no-active-unity-editor.ps1
          # -ProjectRoot puts the generated project and its Library OUTSIDE
          # $GITHUB_WORKSPACE. actions/checkout runs `git clean -ffdx` at the top of
          # every job and `-x` means gitignored, so while the project lived under
          # .artifacts/ every job deleted the Library the previous job had just built
          # on that same disk -- and the repo paid an actions/cache round trip to put
          # it back (measured across the 60 most recent runs: 109 min of restore
          # and 119 min of save on licensed self-hosted runner time).
          # RUNNER_WORKSPACE is the checkout's parent, which git clean cannot reach.
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'editmode' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-editmode' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration 'Release'

      - name: Require current PR head before PlayMode
        id: playmode_head
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Run PlayMode tests
        id: run_playmode
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && steps.playmode_head.outcome == 'success' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        continue-on-error: true
        timeout-minutes: 40
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.playmode-integration-assemblies }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-no-active-unity-editor.ps1
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'playmode' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-playmode' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration 'Release'

      - name: Require current PR head before Standalone
        id: standalone_head
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Run Standalone tests
        id: run_standalone
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && steps.standalone_head.outcome == 'success' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 60
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.standalone-integration-assemblies }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-no-active-unity-editor.ps1
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'standalone' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-standalone' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration 'Release'

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: tests

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-tests
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Report slowest EditMode tests
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-editmode/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Report slowest PlayMode tests
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-playmode/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Report slowest Standalone tests
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-standalone/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Dump EditMode log tail on failure
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') && steps.run_editmode.outcome != 'success' && steps.run_editmode.outcome != 'skipped' }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode

      - name: Dump PlayMode log tail on failure
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') && steps.run_playmode.outcome != 'success' && steps.run_playmode.outcome != 'skipped' }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode

      - name: Dump Standalone log tail on failure
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && steps.run_standalone.outcome != 'success' && steps.run_standalone.outcome != 'skipped' }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone

      - name: Verify EditMode tests actually ran
        id: verify_editmode
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') && steps.run_editmode.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode
          expected-empty: false

      - name: Verify PlayMode tests actually ran
        id: verify_playmode
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') && steps.run_playmode.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode
          expected-empty: false

      - name: Verify Standalone tests actually ran
        id: verify_standalone
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && steps.run_standalone.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone
          expected-empty: false

      - name: Setup Node.js for credential redaction
        if: always()
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"

      - name: Redact credentials from EditMode artifacts
        id: redact_editmode
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-editmode

      - name: Upload EditMode artifacts
        id: upload_editmode
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') && steps.redact_editmode.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-editmode
          path: .artifacts/unity/${{ matrix.unity-version }}-editmode
          if-no-files-found: warn
          retention-days: 14

      - name: Redact credentials from PlayMode artifacts
        id: redact_playmode
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-playmode

      - name: Upload PlayMode artifacts
        id: upload_playmode
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') && steps.redact_playmode.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-playmode
          path: .artifacts/unity/${{ matrix.unity-version }}-playmode
          if-no-files-found: warn
          retention-days: 14

      - name: Redact credentials from Standalone artifacts
        id: redact_standalone
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-standalone

      - name: Upload Standalone artifacts
        id: upload_standalone
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && steps.redact_standalone.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-standalone
          path: .artifacts/unity/${{ matrix.unity-version }}-standalone
          if-no-files-found: warn
          retention-days: 14

      - name: Require every selected Unity mode
        id: require_selected_modes
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        env:
          SELECTED_MODES: ${{ needs.matrix-config.outputs.test-modes }}
          EDITMODE_RUN: ${{ steps.run_editmode.outcome }}
          EDITMODE_VERIFY: ${{ steps.verify_editmode.outcome }}
          EDITMODE_REDACT: ${{ steps.redact_editmode.outcome }}
          EDITMODE_UPLOAD: ${{ steps.upload_editmode.outcome }}
          PLAYMODE_RUN: ${{ steps.run_playmode.outcome }}
          PLAYMODE_VERIFY: ${{ steps.verify_playmode.outcome }}
          PLAYMODE_REDACT: ${{ steps.redact_playmode.outcome }}
          PLAYMODE_UPLOAD: ${{ steps.upload_playmode.outcome }}
          STANDALONE_RUN: ${{ steps.run_standalone.outcome }}
          STANDALONE_VERIFY: ${{ steps.verify_standalone.outcome }}
          STANDALONE_REDACT: ${{ steps.redact_standalone.outcome }}
          STANDALONE_UPLOAD: ${{ steps.upload_standalone.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-test-mode-outcomes.ps1

      - name: Require confirmed Unity cleanup
        if: always()
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  # SINGLE_THREADED leg. The default matrix never exercises the SINGLE_THREADED
  # code paths (Runtime/Core/DataStructure/Cache.cs et al. gate thread-safe vs
  # single-threaded behavior on `#if SINGLE_THREADED`, OFF by default). This job
  # builds+tests with SINGLE_THREADED (and WALLSTOP_CONCAVE_HULL_STATS) defined as
  # GLOBAL scripting symbols so EVERY asmdef test assembly compiles the
  # single-threaded path. Restricted to Unity 6 (6000.3.16f1) editmode+playmode to
  # keep time small (no IL2CPP standalone build). Core-only (no integrations): the
  # single-threaded toggle is a core-runtime concern, so installing the DI packages
  # would only add cost. It is a SEPARATE job from unity-tests but shares the SAME
  # self-hosted Unity seat.
  #
  # It `needs: unity-tests` so the alternate compilation does not spend a Unity
  # seat on a fundamentally broken tree. It used to also wait for the standalone
  # tier solely to avoid org-lock contention. That former edge bought nothing and
  # cost a median 2.8 runner-minutes per run in idle, measured over six runs in
  # session 194. Each host runs one runner, and the external
  # `wallstop-organization-builds` lock still serializes this work against other
  # workflows and runs.
  #
  # Reuses the same secrets gate, runner-preflight,
  # provisioning, perf-category exclusion, verify-results, and artifact-upload
  # scaffolding as unity-tests, with DISTINCT project/Library/artifact paths
  # (suffix `-single-threaded`) so its differently-compiled Library never collides
  # with or poisons the default matrix's `6000.3.16f1-{mode}` cache.
  unity-tests-single-threaded:
    name: Unity ${{ matrix.unity-version }} (SINGLE_THREADED modes)
    needs:
      - matrix-config
      - runner-preflight
      - unity-tests
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.matrix-config.result == 'success' &&
        needs.runner-preflight.result == 'success' &&
        needs.unity-tests.result == 'success' &&
        needs.runner-preflight.outputs.org-credentials == 'true' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: [self-hosted, Windows, RAM-64GB]
    timeout-minutes: 1200
    strategy:
      fail-fast: false
      # No max-parallel, for the reason recorded on the default grouped job above.
      matrix:
        unity-version:
          - 6000.3.16f1
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          unity-version: ${{ matrix.unity-version }}
          install-root: ${{ runner.tool_cache }}\u6-v3
          provisioning-profile: EditorOnly
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        with:
          persist-credentials: false

      - name: Print runner diagnostics
        # Composite action runs PowerShell internally; `shell: bash` on a
        # self-hosted Windows runner can resolve to the WSL stub and fail. Never
        # use plain `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "single-threaded (organization lock wraps the Unity section)"

      - name: Validate Unity license secrets
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require current PR head before lock acquisition
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-single-threaded
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require organization Unity lock acquisition
        id: require_unity_lock
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          ACQUIRED: ${{ steps.unity_lock.outputs.acquired }}
        run: |
          if ($env:ACQUIRED -ne 'true') {
            throw 'The organization Unity lock was not acquired; SINGLE_THREADED modes cannot be waived.'
          }

      - name: Run EditMode tests (SINGLE_THREADED)
        id: run_editmode
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        # editmode + playmode ONLY (no standalone IL2CPP build). Measured worst case
        # for this leg across the 60 most recent runs is 7.8 min, so 40 keeps >5x
        # headroom while failing a hang 50 min sooner than the old 90 -- a stuck
        # licensed leg strands its runner and delays queued organization work for
        # exactly this long. See the default matrix job for the full
        # measurement note. Stays under the job timeout (1200).
        timeout-minutes: 40
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.editmode-core-assemblies }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          # Stream per-test results to unity.log as each test finishes (editor-side
          # CiTestResultStreamLogger). When a PlayMode run aborts/reloads mid-run and
          # serializes a misleading total=0 results.xml, the streamed lines still name
          # the last test that ran -- the key to diagnosing the total=0 legs.
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-no-active-unity-editor.ps1
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'editmode' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-editmode-single-threaded' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -ProjectScope 'single-threaded' `
            -AdditionalScriptingDefines SINGLE_THREADED,WALLSTOP_CONCAVE_HULL_STATS `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      - name: Require current PR head before PlayMode (SINGLE_THREADED)
        id: playmode_head
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Run PlayMode tests (SINGLE_THREADED)
        id: run_playmode
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && steps.playmode_head.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.playmode-core-assemblies }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-no-active-unity-editor.ps1
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'playmode' `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-playmode-single-threaded' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -ProjectScope 'single-threaded' `
            -AdditionalScriptingDefines SINGLE_THREADED,WALLSTOP_CONCAVE_HULL_STATS `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: single-threaded

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}-single-threaded
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Report slowest EditMode tests (SINGLE_THREADED)
        if: always()
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-editmode-single-threaded/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Report slowest PlayMode tests (SINGLE_THREADED)
        if: always()
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-playmode-single-threaded/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Dump EditMode log tail on failure (SINGLE_THREADED)
        if: ${{ always() && steps.run_editmode.outcome != 'success' && steps.run_editmode.outcome != 'skipped' }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode-single-threaded
          label: Unity ${{ matrix.unity-version }} editmode (SINGLE_THREADED)

      - name: Dump PlayMode log tail on failure (SINGLE_THREADED)
        if: ${{ always() && steps.run_playmode.outcome != 'success' && steps.run_playmode.outcome != 'skipped' }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode-single-threaded
          label: Unity ${{ matrix.unity-version }} playmode (SINGLE_THREADED)

      - name: Verify EditMode tests actually ran (SINGLE_THREADED)
        id: verify_editmode
        if: ${{ always() && !cancelled() && steps.run_editmode.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode-single-threaded
          label: Unity ${{ matrix.unity-version }} editmode (SINGLE_THREADED)
          expected-empty: false

      - name: Verify PlayMode tests actually ran (SINGLE_THREADED)
        id: verify_playmode
        if: ${{ always() && !cancelled() && steps.run_playmode.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode-single-threaded
          label: Unity ${{ matrix.unity-version }} playmode (SINGLE_THREADED)
          expected-empty: false

      # LEAK GUARD: Unity writes its license identity into unity.log and
      # configure.log while it activates. GitHub masks a registered secret in
      # the rendered job log, but it never rewrites the bytes of an uploaded
      # artifact, so the upload below would hand the serial to anyone who can
      # download it. Scrub the tree after the last Unity invocation and before
      # the first upload that can carry a log.
      #
      # This runner has no Node on PATH, and the redactor is a Node script.
      - name: Setup Node.js for credential redaction
        if: always()
        timeout-minutes: 2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"

      # Scope is exactly what this job uploads. A wider scope reaches files the
      # job never publishes, and the redactor fails closed on a file it cannot
      # scrub, so it fails the job over a file that was never at risk. Run
      # 33597641377 went red that way, on the root-owned Docker license cache
      # that used to sit under this tree; it lives under RUNNER_TEMP now (#690).
      - name: Redact credentials from EditMode artifacts (SINGLE_THREADED)
        id: redact_editmode
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-editmode-single-threaded

      - name: Upload EditMode artifacts (SINGLE_THREADED)
        id: upload_editmode
        if: ${{ always() && steps.redact_editmode.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-editmode-single-threaded
          path: .artifacts/unity/${{ matrix.unity-version }}-editmode-single-threaded
          if-no-files-found: warn
          retention-days: 14

      - name: Redact credentials from PlayMode artifacts (SINGLE_THREADED)
        id: redact_playmode
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-playmode-single-threaded

      - name: Upload PlayMode artifacts (SINGLE_THREADED)
        id: upload_playmode
        if: ${{ always() && steps.redact_playmode.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unity-${{ matrix.unity-version }}-playmode-single-threaded
          path: .artifacts/unity/${{ matrix.unity-version }}-playmode-single-threaded
          if-no-files-found: warn
          retention-days: 14

      - name: Require every SINGLE_THREADED Unity mode
        id: require_selected_modes
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        env:
          SELECTED_MODES: '["editmode","playmode"]'
          EDITMODE_RUN: ${{ steps.run_editmode.outcome }}
          EDITMODE_VERIFY: ${{ steps.verify_editmode.outcome }}
          EDITMODE_REDACT: ${{ steps.redact_editmode.outcome }}
          EDITMODE_UPLOAD: ${{ steps.upload_editmode.outcome }}
          PLAYMODE_RUN: ${{ steps.run_playmode.outcome }}
          PLAYMODE_VERIFY: ${{ steps.verify_playmode.outcome }}
          PLAYMODE_REDACT: ${{ steps.redact_playmode.outcome }}
          PLAYMODE_UPLOAD: ${{ steps.upload_playmode.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-test-mode-outcomes.ps1 -CoreOnly

      - name: Require confirmed Unity cleanup
        if: always()
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  unitypackage-smoke:
    name: Unity package export smoke
    needs:
      - matrix-config
      - runner-preflight
      - unity-tests
      - unity-tests-single-threaded
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.matrix-config.result == 'success' &&
        needs.runner-preflight.result == 'success' &&
        needs.unity-tests.result == 'success' &&
        needs.unity-tests-single-threaded.result == 'success' &&
        needs.runner-preflight.outputs.org-credentials == 'true' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"

      - name: Validate Unity license secrets
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require current PR head before lock acquisition
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@64bac446903115134dca8235410b332bc5a83547
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: unitypackage-smoke-${{ github.run_id }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "160"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Export Unity package smoke artifact
        id: export_unitypackage
        timeout-minutes: 155
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          UNITY_VERSION="$(jq -r '.release' .github/unity-versions.json)"
          export UNITY_VERSION
          package_name="$(jq -r '.name // empty' package.json)"
          package_version="$(jq -r '.version // empty' package.json)"
          output=".artifacts/unitypackage-smoke/${package_name}-${package_version}.unitypackage"
          bash scripts/unity/export-unitypackage.sh \
            --project-dir ".artifacts/unity/unitypackage-smoke-project" \
            --output "${output}"

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/return-unity-license
        with:
          prior-return-log-path: .artifacts/unity/unitypackage-smoke-project/unitypackage-output/unity.log
          prior-command-succeeded: ${{ steps.export_unitypackage.outcome == 'success' }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: ${{ always() && (steps.unity_lock.outcome == 'success' || steps.unity_lock.outcome == 'failure' || steps.unity_lock.outcome == 'cancelled') }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: unitypackage-smoke-${{ github.run_id }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.return_unity_license.outputs.resource-health }}
          resource-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require confirmed Unity cleanup
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@64bac446903115134dca8235410b332bc5a83547 # v1.14.0
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.return_unity_license.outputs.classification-complete }}
          cleanup-status: ${{ steps.return_unity_license.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.return_unity_license.outputs.resource-health }}
          cleanup-reason: ${{ steps.return_unity_license.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

      - name: Dump Unity export log tail on failure or cancellation
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/unitypackage-smoke-project/unitypackage-output
          label: Unity package export smoke

      # LEAK GUARD: Unity writes its license identity into unity.log and
      # configure.log while it activates. GitHub masks a registered secret in
      # the rendered job log, but it never rewrites the bytes of an uploaded
      # artifact, so the upload below would hand the serial to anyone who can
      # download it. Scrub the tree after the last Unity invocation and before
      # the first upload that can carry a log.
      # Scope is exactly what this job uploads. A wider scope reaches files the
      # job never publishes, and the redactor fails closed on a file it cannot
      # scrub, so it fails the job over a file that was never at risk. Run
      # 33597641377 went red that way, on the root-owned Docker license cache
      # that used to sit under this tree; it lives under RUNNER_TEMP now (#690).
      - name: Redact credentials from Unity artifacts
        id: redact_unity_artifacts
        if: always()
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: |
            .artifacts/unity/unitypackage-smoke-project/Assets/Editor
            .artifacts/unity/unitypackage-smoke-project/Packages
            .artifacts/unity/unitypackage-smoke-project/ProjectSettings
            .artifacts/unity/unitypackage-smoke-project/unitypackage-output

      - name: Upload Unity package export smoke diagnostics
        if: >-
          ${{ (failure() || cancelled())
          && steps.redact_unity_artifacts.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unitypackage-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/unity/unitypackage-smoke-project/Assets/Editor/UnityHelpersPackageExporter.cs
            .artifacts/unity/unitypackage-smoke-project/Packages/manifest.json
            .artifacts/unity/unitypackage-smoke-project/ProjectSettings/
            .artifacts/unity/unitypackage-smoke-project/unitypackage-output/*.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Delete private Unity cleanup evidence
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        shell: pwsh
        env:
          RETURN_LOG_PATH: ${{ steps.return_unity_license.outputs.return-log-path }}
          SUPPLEMENTAL_EVIDENCE_PATHS: ${{ steps.return_unity_license.outputs.supplemental-evidence-paths }}
        run: |
          $evidencePaths = @($env:RETURN_LOG_PATH) + @($env:SUPPLEMENTAL_EVIDENCE_PATHS -split "`r?`n")
          foreach ($evidencePath in @($evidencePaths | Sort-Object -Unique)) {
            if (-not [string]::IsNullOrWhiteSpace($evidencePath) -and (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
              Remove-Item -LiteralPath $evidencePath -Force
            }
          }

  unity-ci-success:
    name: Unity CI Success
    if: ${{ always() }}
    needs:
      - matrix-config
      - runner-preflight
      - unity-tests
      - unity-tests-single-threaded
      - unitypackage-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # matrix-config answers "has this PR moved on?" ONCE, before any leg is
      # dispatched, which only covers a push that lands before it runs. A push
      # that lands AFTER it -- while legs are queued for the single Unity seat --
      # leaves its output at `false`, so every dispatched leg then fails on its own
      # require-current-pr-head guard and this gate reports the run red. Measured
      # on run 31020762387: six legs failed, all six on
      # "Stale pull request run for <old sha>", zero on a test.
      #
      # Re-resolving here closes that window. This job runs last and on a hosted
      # runner, so it sees the head as of the moment the verdict is written.
      #
      # Fails OPEN, exactly like matrix-config's copy: any trouble resolving the
      # head leaves superseded=false, so an API hiccup costs a redundant red,
      # never a waived validation.
      - name: Re-detect superseded pull request head
        id: late_superseded
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${EXPECTED_HEAD_SHA:-}" ]; then
            echo "Not a pull request run; nothing can supersede it."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          current=""
          if ! current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
            current=""
          fi
          # Shape, not emptiness: `--jq '.head.sha'` prints the literal string
          # "null" and exits 0 when the field is absent.
          if ! printf '%s' "${current}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::Could not resolve the current head of pull request #${PR_NUMBER} (got '${current}'); reporting this run's real result."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${current}" = "${EXPECTED_HEAD_SHA}" ]; then
            echo "Pull request #${PR_NUMBER} is still at ${EXPECTED_HEAD_SHA}."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "superseded=true" >> "${GITHUB_OUTPUT}"
          echo "::notice::Superseded run for ${EXPECTED_HEAD_SHA}; pull request #${PR_NUMBER} now points to ${current}."

      - name: Require every expected Unity CI job result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          REF_PROTECTED: ${{ github.ref_protected }}
          MATRIX_CONFIG_RESULT: ${{ needs.matrix-config.result }}
          MATRIX_CONFIG_SUPERSEDED: ${{ needs.matrix-config.outputs.superseded }}
          HAS_ORG_CREDENTIALS: ${{ needs.runner-preflight.outputs.org-credentials }}
          LATE_SUPERSEDED: ${{ steps.late_superseded.outputs.superseded }}
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          SINGLE_THREADED_RESULT: ${{ needs.unity-tests-single-threaded.result }}
          UNITYPACKAGE_SMOKE_RESULT: ${{ needs.unitypackage-smoke.result }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${PR_HEAD_REPOSITORY}" != "${CURRENT_REPOSITORY}" ]; then
            expected="skipped"
            for result in \
              "${MATRIX_CONFIG_RESULT}" \
              "${RUNNER_PREFLIGHT_RESULT}" \
              "${UNITY_TESTS_RESULT}" \
              "${SINGLE_THREADED_RESULT}" \
              "${UNITYPACKAGE_SMOKE_RESULT}"; do
              if [ "${result}" != "${expected}" ]; then
                echo "::error::Unexpected Unity CI job result for an intentionally unlicensed fork PR: ${result}."
                exit 1
              fi
            done
            echo "Fork PR intentionally omitted licensed Unity jobs."
            exit 0
          fi

          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_PROTECTED}" != "true" ]; then
            echo "Unprotected push intentionally omitted licensed Unity jobs."
            exit 0
          fi

          # A run with no organization secrets -- Dependabot's separate secret
          # store is the case that reaches this -- cannot dispatch a licensed leg,
          # so every one of them is skipped by design. That is the same situation
          # as a fork PR above and is reported the same way: green, because nothing
          # failed, with the summary saying plainly that no Unity validation ran.
          #
          # It is still an assertion, not a waiver. Both hosted gates must have
          # passed and every licensed job must be `skipped`; anything else means a
          # leg ran that could not have, or a gate broke, and that is a real red.
          if [ "${HAS_ORG_CREDENTIALS}" != "true" ]; then
            if [ "${MATRIX_CONFIG_RESULT}" != "success" ] || [ "${RUNNER_PREFLIGHT_RESULT}" != "success" ]; then
              echo "::error::Run without Unity credentials, but a hosted gate did not pass: matrix-config=${MATRIX_CONFIG_RESULT}, runner-preflight=${RUNNER_PREFLIGHT_RESULT}."
              exit 1
            fi
            for pair in \
              "unity-tests=${UNITY_TESTS_RESULT}" \
              "unity-tests-single-threaded=${SINGLE_THREADED_RESULT}" \
              "unitypackage-smoke=${UNITYPACKAGE_SMOKE_RESULT}"; do
              if [ "${pair#*=}" != "skipped" ]; then
                echo "::error::Run without Unity credentials, but a licensed job did not skip: ${pair}."
                exit 1
              fi
            done
            echo "No Unity credentials on this run; the licensed Unity tiers were skipped."
            {
              echo "## Unity validation did not run"
              echo ""
              echo "This run had no Unity credentials, so every licensed tier was skipped and **no Unity test executed**."
              echo ""
              echo "The hosted gates passed and every licensed job skipped as designed, so this is reported as a pass rather than a failure."
              echo ""
              echo "Unity coverage for these changes comes from the protected-branch push after merge."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # A superseded iteration must not report failure: it never ran the
          # licensed tiers, and its check attaches to the head SHA it was queued
          # for, not to the one the pull request now points at -- so it can
          # neither gate nor authorize a merge of the current head. Reporting
          # anything else here would either mark "you pushed again" as a defect
          # or leave the run permanently pending.
          #
          # Supersession waives ONLY the three licensed job results. The two hosted
          # gates still have to pass, because they run to completion regardless:
          # matrix-config resolves supersession in its second step and then goes
          # on to lint the test-project module manifest and resolve the matrix,
          # and a failed job still publishes its outputs. Short-circuiting on
          # the output alone would report green for a bogus UPM module id or an
          # offline runner fleet, which is the exact fail-fast signal those jobs
          # exist to raise.
          #
          # Two ways to be superseded, waived identically. MATRIX_CONFIG_SUPERSEDED
          # means the push beat dispatch, so the licensed tiers never started.
          # LATE_SUPERSEDED means it landed afterwards, so they started and then
          # exited on their own head guards. The reasoning above does not
          # distinguish them: either way the check attaches to a head the pull
          # request has moved past.
          if [ "${MATRIX_CONFIG_SUPERSEDED}" = "true" ] || [ "${LATE_SUPERSEDED}" = "true" ]; then
            if [ "${MATRIX_CONFIG_RESULT}" != "success" ] || [ "${RUNNER_PREFLIGHT_RESULT}" != "success" ]; then
              echo "::error::Superseded run, but a hosted gate did not pass: matrix-config=${MATRIX_CONFIG_RESULT}, runner-preflight=${RUNNER_PREFLIGHT_RESULT}."
              exit 1
            fi
            if [ "${MATRIX_CONFIG_SUPERSEDED}" = "true" ]; then
              echo "Superseded before dispatch; the licensed Unity tiers were skipped for the current head's run."
            else
              echo "Superseded after dispatch; the licensed Unity tiers exited on their head guards. The current head has its own run."
            fi
            {
              echo "## Superseded Unity run"
              echo ""
              echo "This run was queued for a head the pull request has since moved past, so its result cannot gate or authorize the current head. Reported as a no-op."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          failed="false"
          require_result() {
            job="$1"
            actual="$2"
            allowed="$3"
            case ",${allowed}," in
              *,"${actual}",*) ;;
              *)
                echo "::error::Unexpected Unity CI job result: ${job}=${actual}; expected ${allowed}."
                failed="true"
                ;;
            esac
          }

          require_result "matrix-config" "${MATRIX_CONFIG_RESULT}" "success"
          require_result "runner-preflight" "${RUNNER_PREFLIGHT_RESULT}" "success"
          require_result "unity-tests" "${UNITY_TESTS_RESULT}" "success"
          require_result "unity-tests-single-threaded" "${SINGLE_THREADED_RESULT}" "success"
          require_result "unitypackage-smoke" "${UNITYPACKAGE_SMOKE_RESULT}" "success"

          if [ "${failed}" = "true" ]; then
            exit 1
          fi
