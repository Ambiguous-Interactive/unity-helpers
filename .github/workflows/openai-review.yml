name: OpenAI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type != 'Bot' }}
    uses: Ambiguous-Interactive/review-tools/.github/workflows/openai-review.yml@5aabfe60ec294f8160b70d0a712c561db5e3fa29 # v1.1.2
    with:
      model: ${{ vars.OPENAI_REVIEW_MODEL }}
      effort: ${{ vars.OPENAI_REVIEW_EFFORT }}
      timeout-minutes: 15
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
