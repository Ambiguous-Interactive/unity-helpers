name: Repo Lint

# Lint and contract checks share a registry and one required check.
#
# This replaces 24 single-purpose workflows. Each of them booted its own runner and did its own
# checkout to run a script that finished in seconds: measured on `main` at e94d04d5, ~810 s of
# billable runner time for well under two minutes of work, and five separate workflows each ran
# scripts/tests/test-comment-stripping.ps1.
#
# The registry lives in scripts/lint-checks.json: the typed Python runner keeps
# going after a failure and reports every failing check at once, and
# scripts/tests/test-run-repo-lint.js asserts no linter in scripts/ has been left unreachable.
#
# The historical checks ran concurrently, one worker per core. All three rows were measured:
#
#   20 workflows (before #444)   128 s wall clock   ~730 s billable
#   1 serial job (#444)          317 s wall clock    317 s billable
#   1 concurrent job            179 s wall clock    179 s billable   (147 s in Repository checks)
#
# The coordinator and memory safety tests now have dedicated shards to reduce contention.
# Each shard uses the same hosted runner class and retains its normal check selection.
#
# Deliberately NOT folded in:
#   * LLM Instructions Lint runs the skills-index generator on Windows as well, to catch a
#     Windows-only BOM or sort order. An Ubuntu-only job cannot do that.
#   * The MkDocs strict build needs Python, and the lychee external-link sweep is cron-only and
#     network-dependent, so neither belongs on the per-push path.
#   * Local Gates already runs `validate:tests`, so the twelve self-tests the retired workflows
#     duplicated from it are not repeated here.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-lint:
    name: Repo Lint (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Bounded because the doc-link checks this job absorbed were bounded before it: a link walk that
    # hangs should fail the job, not hold a runner for six hours. This is a hang guard rather than a
    # performance target.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      # Full history: scripts/audit-license-years.sh compares committed years against the dates the
      # files were actually touched, and a depth-1 checkout makes every file look new.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # package-lock.json is GITIGNORED here, so `cache: npm` on its own fails the job outright with
      # "Dependencies lock file is not found". Same split as local-gates.yml, for the same reason.
      - name: Setup Node.js (cached)
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Node.js (no cache)
        if: ${{ hashFiles('package-lock.json') == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i --no-audit --no-fund
          fi

      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tools

      - name: Setup .NET for semantic safety checks
        id: dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/unity-helpers-dotnet
        with:
          dotnet-version: "9.0.320"

      - name: Require the installed .NET SDK
        shell: bash
        env:
          EXPECTED_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          selected_sdk="$(dotnet --version)"
          printf 'Selected .NET SDK: %s\n' "$selected_sdk"
          test "$selected_sdk" = "${EXPECTED_DOTNET_SDK:?Missing installed SDK version}"

      - name: actionlint
        id: actionlint
        if: ${{ matrix.shard == 2 }}
        continue-on-error: true
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7

      # strict: true and file_or_dir carried over verbatim from the retired yaml-format-lint.yml.
      # Without strict, yamllint's warning-level findings stop failing the job, which would have
      # quietly loosened the gate while the check still looked present.
      - name: yamllint
        id: yamllint
        if: ${{ matrix.shard == 2 }}
        continue-on-error: true
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
          strict: true

      - name: Repository checks
        id: checks
        continue-on-error: true
        env:
          AGENT_CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          LINT_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # Shard 0 runs only the coordinator tests. A crashed worker must fail the check.
          PYTEST_ADDOPTS: ${{ matrix.shard == 0 && '-n 2 --max-worker-restart=0' || '' }}
        run: uv run --project scripts/python~ --locked --no-dev python scripts/check_registries.py lint --direct --ci --shard "$LINT_SHARD"

      - name: Report memory safety findings
        id: safety
        if: ${{ always() && matrix.shard == 1 }}
        continue-on-error: true
        run: test -s artifacts/unsafe-code.sarif

      - name: Retain memory safety report
        id: safety_report
        if: ${{ always() && matrix.shard == 1 }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsafe-code-sarif
          path: artifacts/unsafe-code.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Require selected lint checks and reports
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          YAMLLINT: ${{ steps.yamllint.outcome }}
          CHECKS: ${{ steps.checks.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
          SAFETY_REPORT: ${{ steps.safety_report.outcome }}
        run: |
          set -euo pipefail
          failed=""
          if [[ "$SHARD" == 2 ]]; then
            [ "$ACTIONLINT" != "success" ] && failed="$failed actionlint"
            [ "$YAMLLINT" != "success" ] && failed="$failed yamllint"
          fi
          [ "$CHECKS" != "success" ] && failed="$failed repository-checks"
          if [[ "$SHARD" == 1 ]]; then
            [ "$SAFETY" != "success" ] && failed="$failed memory-safety"
            [ "$SAFETY_REPORT" != "success" ] && failed="$failed memory-safety-report"
          fi
          if [ -n "$failed" ]; then
            echo "::error::Repo Lint shard $SHARD failed:$failed"
            exit 1
          fi

      - name: Record completed shard
        env:
          SHARD: ${{ matrix.shard }}
        run: git rev-parse HEAD > "$RUNNER_TEMP/lint-shard-$SHARD.txt"

      - name: Retain completed shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lint-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/lint-shard-${{ matrix.shard }}.txt
          if-no-files-found: error
          overwrite: true

  repo-lint-success:
    name: Repo Lint
    runs-on: ubuntu-latest
    needs: repo-lint
    if: ${{ always() }}
    steps:
      # Require positive evidence even if Actions misreports an abandoned matrix job.
      - name: Download shard receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: lint-shard-*
          path: ${{ runner.temp }}/lint-shards
          merge-multiple: true

      - name: Require every lint shard to pass
        env:
          SHARDS_RESULT: ${{ needs.repo-lint.result }}
          SHARD_RECEIPTS: ${{ runner.temp }}/lint-shards
        run: |
          set -euo pipefail
          if [[ "$SHARDS_RESULT" != success ]]; then
            printf '::error::Lint shard jobs finished with result %s.\n' "$SHARDS_RESULT"
            exit 1
          fi
          for shard in 0 1 2; do
            receipt="$SHARD_RECEIPTS/lint-shard-$shard.txt"
            if [[ ! -f "$receipt" || "$(<"$receipt")" != "$GITHUB_SHA" ]]; then
              printf '::error::Missing or invalid completion receipt for lint shard %s.\n' "$shard"
              exit 1
            fi
          done
