name: Repo Lint

# Every fast lint and contract check in one job.
#
# This replaces 24 single-purpose workflows. Each of them booted its own runner and did its own
# checkout to run a script that finished in seconds: measured on `main` at e94d04d5, ~810 s of
# billable runner time for well under two minutes of work, and five separate workflows each ran
# scripts/tests/test-comment-stripping.ps1. One boot, one checkout, one `npm install` now serve all
# of it.
#
# The registry lives in scripts/run-repo-lint.js so it is data rather than YAML: the runner keeps
# going after a failure and reports every failing check at once, and
# scripts/tests/test-run-repo-lint.js asserts no linter in scripts/ has been left unreachable.
#
# The checks run concurrently, one worker per core, which is why this is still one job rather than
# the balanced matrix the plan proposed. All three rows measured, none projected:
#
#   20 workflows (before #444)   128 s wall clock   ~730 s billable
#   1 serial job (#444)          317 s wall clock    317 s billable
#   1 concurrent job (this)      179 s wall clock    179 s billable   (147 s in Repository checks)
#
# Concurrency inside the job pays the boot, checkout and npm install once, where a 3-leg matrix pays
# them three times: the checks are independent processes that only read the tree. The runner takes
# `--jobs` and defaults to the core count, so nothing here needs to know how large the runner is.
#
# The speedup on this runner is 1.93x (284 s -> 147 s), NOT the ~3x that four cores suggests and
# eight real cores deliver locally (5.12x). Hosted vCPUs are shared, and the tail is bounded by the
# slowest single check. Wall clock is therefore still ~40% above the twenty-workflow fan-out while
# billable is 4.1x better than it -- a deliberate trade, and the honest numbers for anyone revisiting
# it. Sharding on top of this would buy roughly 179 s -> 70 s for about +30 s billable; it has not
# been done because a three-minute lint signal is nowhere near the critical path behind a 40-minute
# Unity matrix.
#
# Deliberately NOT folded in:
#   * LLM Instructions Lint runs the skills-index generator on Windows as well, to catch a
#     Windows-only BOM or sort order. An Ubuntu-only job cannot do that.
#   * The MkDocs strict build needs Python, and the lychee external-link sweep is cron-only and
#     network-dependent, so neither belongs on the per-push path.
#   * Local Gates already runs `validate:tests`, so the twelve self-tests the retired workflows
#     duplicated from it are not repeated here.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-lint:
    name: Repo Lint
    runs-on: ubuntu-latest
    # Bounded because the doc-link checks this job absorbed were bounded before it: a link walk that
    # hangs should fail the job, not hold a runner for six hours. This is a hang guard rather than a
    # performance number, so it keeps its headroom over the measured run above.
    timeout-minutes: 20
    steps:
      # Full history: scripts/audit-license-years.sh compares committed years against the dates the
      # files were actually touched, and a depth-1 checkout makes every file look new.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # package-lock.json is GITIGNORED here, so `cache: npm` on its own fails the job outright with
      # "Dependencies lock file is not found". Same split as local-gates.yml, for the same reason.
      - name: Setup Node.js (cached)
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Node.js (no cache)
        if: ${{ hashFiles('package-lock.json') == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i --no-audit --no-fund
          fi

      - name: Setup .NET for semantic safety checks
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/unity-helpers-dotnet
        with:
          dotnet-version: "9.0.319"

      # The three check groups each record an outcome instead of ending the job, so one failure
      # never hides the other two. The gate at the end is what actually reds the run.
      - name: Require the installed .NET SDK
        shell: bash
        env:
          EXPECTED_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          set -euo pipefail
          selected_sdk="$(dotnet --version)"
          printf 'Selected .NET SDK: %s\n' "$selected_sdk"
          test "$selected_sdk" = "${EXPECTED_DOTNET_SDK:?Missing installed SDK version}"

      - name: actionlint
        id: actionlint
        continue-on-error: true
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7

      # strict: true and file_or_dir carried over verbatim from the retired yaml-format-lint.yml.
      # Without strict, yamllint's warning-level findings stop failing the job, which would have
      # quietly loosened the gate while the check still looked present.
      - name: yamllint
        id: yamllint
        continue-on-error: true
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
          strict: true

      - name: Repository checks
        id: checks
        continue-on-error: true
        run: node scripts/run-repo-lint.js

      - name: Report memory safety findings
        id: safety
        if: always()
        continue-on-error: true
        run: npm run lint:unsafe-code -- --sarif artifacts/unsafe-code.sarif

      - name: Retain memory safety report
        id: safety_report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsafe-code-sarif
          path: artifacts/unsafe-code.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Gate
        if: always()
        env:
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          YAMLLINT: ${{ steps.yamllint.outcome }}
          CHECKS: ${{ steps.checks.outcome }}
          SAFETY: ${{ steps.safety.outcome }}
          SAFETY_REPORT: ${{ steps.safety_report.outcome }}
        run: |
          set -euo pipefail
          failed=""
          [ "$ACTIONLINT" = "failure" ] && failed="$failed actionlint"
          [ "$YAMLLINT" = "failure" ] && failed="$failed yamllint"
          [ "$CHECKS" = "failure" ] && failed="$failed repository-checks"
          [ "$SAFETY" != "success" ] && failed="$failed memory-safety"
          [ "$SAFETY_REPORT" != "success" ] && failed="$failed memory-safety-report"
          if [ -n "$failed" ]; then
            echo "::error::Repo Lint failed:$failed"
            exit 1
          fi
          echo "Repo Lint passed."
