name: Runner inventory diagnostic (hosted only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint the existing runner reader credential
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: read

      - name: Read organization runners and repository-visible groups
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          gh api --paginate "orgs/${OWNER}/actions/runners?per_page=100"
          gh api --paginate "orgs/${OWNER}/actions/runner-groups?per_page=100"
          gh api --paginate "orgs/${OWNER}/actions/runner-groups?visible_to_repository=${REPOSITORY}&per_page=100" > "${RUNNER_TEMP}/visible-groups.json"
          cat "${RUNNER_TEMP}/visible-groups.json"
          jq -r '.runner_groups[].id' "${RUNNER_TEMP}/visible-groups.json" | while IFS= read -r group_id; do
            gh api --paginate "orgs/${OWNER}/actions/runner-groups/${group_id}/runners?per_page=100"
          done

      - name: Reproduce the exact pinned preflight
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@c5463a9e0d09e5089c7172f41425bf09b7752da2 # v1.16.1
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB","ELI-MACHINE"]]'
