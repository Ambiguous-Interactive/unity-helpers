name: Unity Meta File Lint

on:
  push:
    branches:
      - main
    paths:
      - "Runtime/**"
      - "Editor/**"
      - "Tests/**"
      - "Samples~/**"
      - "Shaders/**"
      - "Styles/**"
      - "URP/**"
      - "docs/**"
      - "scripts/**"
      - "*.meta"
      - "scripts/lint-meta-files.ps1"
      - "scripts/tests/test-lint-meta-exclusions.sh"
      - ".github/workflows/meta-file-lint.yml"
  pull_request:
    paths:
      - "Runtime/**"
      - "Editor/**"
      - "Tests/**"
      - "Samples~/**"
      - "Shaders/**"
      - "Styles/**"
      - "URP/**"
      - "docs/**"
      - "scripts/**"
      - "*.meta"
      - "scripts/lint-meta-files.ps1"
      - "scripts/tests/test-lint-meta-exclusions.sh"
      - ".github/workflows/meta-file-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-meta-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test meta lint exclusions
        run: bash scripts/tests/test-lint-meta-exclusions.sh

      - name: Lint Unity meta files
        shell: pwsh
        run: ./scripts/lint-meta-files.ps1 -VerboseOutput
