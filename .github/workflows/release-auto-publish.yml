name: Publish prepared release after validation

on:
  workflow_run:
    workflows:
      - Unity Tests
      - Local Gates
      - Repo Lint
      - WallstopProto Generator
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-auto-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.fork == false && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout trusted default branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Publish opted-in prepared release after exact-source validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-tools/auto-publish-release.js
