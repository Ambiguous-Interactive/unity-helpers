name: Sync Banner Version

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "docs/images/unity-helpers-banner.svg"
      - ".llm/context.md"
      - "scripts/sync-banner-version.ps1"
      - "scripts/version_sync.py"
      - "scripts/tests/test_version_sync.py"
      - "scripts/python~/pyproject.toml"
      - "scripts/python~/uv.lock"
      - ".github/workflows/sync-banner-version.yml"
  pull_request:
    paths:
      - "package.json"
      - "docs/images/unity-helpers-banner.svg"
      - ".llm/context.md"
      - "scripts/sync-banner-version.ps1"
      - "scripts/version_sync.py"
      - "scripts/tests/test_version_sync.py"
      - "scripts/python~/pyproject.toml"
      - "scripts/python~/uv.lock"
      - ".github/workflows/sync-banner-version.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-banner-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tools

      - name: Validate banner version matches package.json
        run: uv run --project scripts/python~ --locked --no-dev python scripts/version_sync.py check-banner
