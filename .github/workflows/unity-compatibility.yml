# Generated by scripts/unity/generate-compatibility-workflow.js. Do not edit.
name: Unity Compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: unity-compatibility-${{ github.sha }}
  cancel-in-progress: true

jobs:
  matrix-config:
    name: Compatibility Resolve Unity test matrix
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected && ((github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      unity-versions: ${{ steps.resolve.outputs.unity-versions }}
      unity-exclusions: ${{ steps.resolve.outputs.unity-exclusions }}
      release-unity-version: ${{ steps.release_version.outputs.version }}
      test-modes: ${{ steps.resolve.outputs.test-modes }}
      combine-variants: "false"
      editmode-integration-assemblies: ${{ steps.assemblies.outputs.editmode_integrations }}
      playmode-integration-assemblies: ${{ steps.assemblies.outputs.playmode_integrations }}
      standalone-integration-assemblies: ${{ steps.assemblies.outputs.standalone_integrations }}
      editmode-core-assemblies: ${{ steps.assemblies.outputs.editmode_core }}
      playmode-core-assemblies: ${{ steps.assemblies.outputs.playmode_core }}
      standalone-core-assemblies: ${{ steps.assemblies.outputs.standalone_core }}
      integration-assembly-profiles: ${{ steps.assemblies.outputs.integration_profiles }}
      core-assembly-profiles: ${{ steps.assemblies.outputs.core_profiles }}
      superseded: ${{ steps.superseded.outputs.superseded }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js for assembly discovery
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Setup Python tooling for matrix validation
        uses: ./.github/actions/setup-python-tools

      - name: Validate Build readback source selection
        if: ${{ github.event_name == 'workflow_dispatch' && '' != '' }}
        shell: pwsh
        env:
          UH_READBACK_RUN_ID: ${{ '' }}
        run: |
          if ($env:UH_READBACK_RUN_ID -cnotmatch '^[1-9][0-9]{0,19}$') { throw 'Build readback requires an explicit original source run ID.' }

      - name: Validate native comparison selection
        if: ${{ github.event_name == 'workflow_dispatch' && false }}
        shell: pwsh
        env:
          UH_NATIVE_DIAGNOSTICS: ${{ false }}
          UH_NATIVE_MODE: ${{ 'all' }}
          UH_NATIVE_ACCEPTANCE: ${{ 'none' }}
        run: |
          if ($env:UH_NATIVE_DIAGNOSTICS -ne 'true' -or $env:UH_NATIVE_MODE -ne 'editmode' -or $env:UH_NATIVE_ACCEPTANCE -ne 'none') {
            throw 'Loader-snaps comparison requires native-diagnostics=true, test-mode=editmode and acceptance=none.'
          }

      - name: Validate Standalone native diagnostic selection
        if: ${{ github.event_name == 'workflow_dispatch' && false && 'all' == 'standalone' }}
        shell: pwsh
        env:
          UH_NATIVE_ACCEPTANCE: ${{ 'none' }}
        run: |
          if ($env:UH_NATIVE_ACCEPTANCE -ne 'none') {
            throw 'Standalone native diagnostics require acceptance=none; no timing campaign may run.'
          }

      - name: Validate Standalone Direct control selection
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && false }}
        env:
          UH_NATIVE_DIAGNOSTICS: ${{ false }}
          UH_NATIVE_MODE: ${{ 'all' }}
          UH_NATIVE_ACCEPTANCE: ${{ 'none' }}
        run: uv run --project scripts/python~ --locked --no-dev python scripts/unity/native_build_selection.py direct

      - name: Validate Standalone debugger heap selection
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && false }}
        env:
          UH_NATIVE_DIAGNOSTICS: ${{ false }}
          UH_NATIVE_MODE: ${{ 'all' }}
          UH_NATIVE_ACCEPTANCE: ${{ 'none' }}
          UH_NATIVE_DIRECT_CONTROL: ${{ false }}
        run: uv run --project scripts/python~ --locked --no-dev python scripts/unity/native_build_selection.py heap

      - name: Validate Standalone debugger attachment selection
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
          (false || false || false) }}
        env:
          UH_NATIVE_DIAGNOSTICS: ${{ false }}
          UH_NATIVE_MODE: ${{ 'all' }}
          UH_NATIVE_ACCEPTANCE: ${{ 'none' }}
          UH_NATIVE_DIRECT_CONTROL: ${{ false }}
          UH_NATIVE_STANDARD_HEAP: ${{ false }}
          UH_NATIVE_ATTACH_CONTROL: ${{ false }}
          UH_NATIVE_ATTACH_AFTER_STARTUP: ${{ false }}
          UH_NATIVE_ATTACH_AFTER_SHUTDOWN: ${{ false }}
        run: uv run --project scripts/python~ --locked --no-dev python scripts/unity/native_build_selection.py attach

      # Assembly compatibility depends on target mode and integration opt-in,
      # never on Unity version. Compute each distinct list once on this hosted
      # job instead of installing Node and walking every asmdef again inside
      # each self-hosted Unity leg.
      - name: Resolve Unity test assembly lists
        id: assemblies
        run: |
          node <<'NODE'
          const fs = require("fs");
          const discovery = require("./scripts/unity/lib/asmdef-discovery.js");

          const profiles = {
            editmode_integrations: { target: "editmode", includeIntegrations: true },
            playmode_integrations: { target: "playmode", includeIntegrations: true },
            standalone_integrations: {
              target: "standalone",
              runtimeOnly: true,
              includeIntegrations: true
            },
            editmode_core: { target: "editmode", editorOnly: true },
            playmode_core: { target: "playmode" },
            standalone_core: { target: "standalone", runtimeOnly: true }
          };
          const resolved = Object.fromEntries(Object.entries(profiles).map(([name, options]) => {
            const assemblies = discovery.defaultIncludeAssemblies(process.cwd(), options).join(";");
            return [name, assemblies];
          }));
          const lines = Object.entries(resolved).map(([name, assemblies]) =>
            `${name}=${assemblies}`
          );
          lines.push(`integration_profiles=${JSON.stringify({
            editmode: resolved.editmode_integrations,
            playmode: resolved.playmode_integrations,
            standalone: resolved.standalone_integrations
          })}`);
          lines.push(`core_profiles=${JSON.stringify({
            editmode: resolved.editmode_core,
            playmode: resolved.playmode_core,
            standalone: resolved.standalone_core
          })}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`, "utf8");
          NODE

      # Resolve "has this PR moved on?" ONCE, here, on a hosted runner.
      #
      # Every licensed leg re-checks the head immediately before setup and again
      # before lock acquisition, but those guards fire only after the leg has
      # already been dispatched -- and a dispatch means waiting in line for the
      # single self-hosted Unity seat. A stale iteration therefore burned eight
      # queue slots to do nothing, and because this workflow's concurrency group
      # cannot cancel in progress (a leg may be holding the org Unity license),
      # the successor run stayed `pending` behind it for as long as that took.
      # Observed on run 30963202461: two legs still queued 45 minutes after the
      # head moved, with the successor run never started.
      #
      # Skipping the licensed tiers instead lets a superseded run complete in
      # seconds and hand the concurrency group to the run that matters. The
      # per-leg guards stay as defense in depth for a push that lands after this
      # step has already answered.
      #
      # Fails OPEN: any API trouble resolving the head leaves superseded=false,
      # so an unreachable API costs a redundant run, never a skipped validation.
      - name: Detect superseded pull request head
        id: superseded
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${EXPECTED_HEAD_SHA:-}" ]; then
            echo "Not a pull request run; nothing can supersede it."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          current=""
          if ! current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"; then
            current=""
          fi
          # Shape, not emptiness: `--jq '.head.sha'` prints the literal string
          # "null" and exits 0 when the field is absent, and "null" compares
          # unequal to any real SHA -- an API anomaly would otherwise skip every
          # licensed tier, the one thing this step must never do.
          if ! printf '%s' "${current}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::Could not resolve the current head of pull request #${PR_NUMBER} (got '${current}'); proceeding as current."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${current}" = "${EXPECTED_HEAD_SHA}" ]; then
            echo "Pull request #${PR_NUMBER} is still at ${EXPECTED_HEAD_SHA}."
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "superseded=true" >> "${GITHUB_OUTPUT}"
          echo "::notice::Superseded run for ${EXPECTED_HEAD_SHA}; pull request #${PR_NUMBER} now points to ${current}. Skipping the licensed Unity tiers."
          {
            echo "## Superseded Unity run"
            echo ""
            echo "This run was queued for \`${EXPECTED_HEAD_SHA}\`; pull request #${PR_NUMBER} now points to \`${current}\`."
            echo "The licensed Unity tiers were skipped so the run for the current head can start immediately."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Fail FAST on a bad test-project module manifest before any (expensive,
      # self-hosted) Unity leg starts. A non-existent UPM id here -- e.g. the
      # bogus 'com.unity.modules.grid' (declare com.unity.modules.tilemap for
      # Grid) -- makes every matrix leg fail ~30 min later with no NUnit
      # results.xml and no clearly-named cause. This
      # hosted-runner check turns that whole class into an instant, self-
      # describing red on the PR. run-ci-tests.ps1's catastrophic-pattern scan is
      # the in-Unity backstop for the same failure.
      - name: Validate Unity test-project module manifest
        shell: pwsh
        run: uv run --project scripts/python~ --locked --no-dev python scripts/lint_unity_test_modules.py --verbose

      # NOTE: DxMessaging had a "ci-owned docs-only PR" detection here that
      # skipped the licensed matrix when a PR touched ONLY its perf-numbers doc
      # + baseline. unity-helpers has no such CI-owned perf-doc auto-commit on
      # the PR path (the unity-benchmarks workflow commits perf results from a
      # DISPATCH run, not a PR), so that detection is intentionally DROPPED for
      # simplicity. If a perf-doc auto-update PR flow is added later, repoint a
      # docs-only gate at docs/performance/ rather than DxMessaging's
      # docs/architecture/performance.md path.
      - name: Resolve release editor version
        id: release_version
        shell: pwsh
        run: |
          $version = (Get-Content .github/unity-versions.json -Raw | ConvertFrom-Json).release
          if ($version -notmatch '^\d+\.\d+\.\d+f\d+$') { throw 'Invalid release Unity version.' }
          # The unitypackage-smoke editor gate and central return pin this
          # version literally (enrollment contract); fail closed on drift.
          if ($version -ne '6000.6.0f1') {
            throw "unity-versions.json release '$version' drifted from the pinned unitypackage-smoke editor version '6000.6.0f1'; update the smoke ensure/return pin in the same change."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Resolve dispatch overrides
        id: resolve
        env:
          AGENT_CHECK_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_UNITY_COVERAGE: compatibility
          INPUT_UNITY_VERSION: ${{ '' }}
          INPUT_TEST_MODE: ${{ 'all' }}
          INPUT_ACCEPTANCE: ${{ 'none' }}
        run: uv run --quiet --project scripts/python~ --locked --no-dev python scripts/unity/resolve_test_matrix.py

      # NOTE: this job deliberately holds NO `secrets.*` reference. It used to read
      # UNITY_SERIAL/UNITY_EMAIL/UNITY_PASSWORD/BUILD_LOCK_APP_ID/BUILD_LOCK_APP_PRIVATE_KEY
      # purely to emit a `has-secrets` boolean, and a source-free audit cannot see
      # that intent: it sees five licensing credentials in an unlicensed job's scope
      # and classifies the job as capable of activating an editor, then measures it
      # against paid-serial contracts (lock acquire, license return, cleanup gate,
      # typed release) that a matrix resolver can never satisfy. The licensed-CI
      # signal now comes from runner-preflight, which already holds build-lock
      # credentials for work it actually does. See #596 and #322.

  runner-preflight:
    name: Compatibility Self-hosted runner access preflight
    # Enrollment contract (Preconditions item 2): fork and Dependabot runs must
    # remain unlicensed because organization secrets are unavailable to them, so
    # this hosted registration preflight carries the trusted-revision guard at
    # the job level and runs its single approved availability action
    # unconditionally. A same-repository run is expected to hold the
    # organization credential set, and a run without it fails closed at the
    # preflight instead of silently skipping every licensed tier.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ${{ github.workflow }}-runner-preflight-${{ github.sha }}
      cancel-in-progress: true
    steps:
      # Verifies only that every required label set has a registered runner
      # visible to the repository; the licensed jobs below depend on this job so
      # an impossible label set fails instead of queueing forever.
      - name: Require an online Unity runner
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/check-unity-runner-availability@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          reader-app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          reader-app-private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          required-label-sets: '[["self-hosted","Windows","RAM-64GB","DAD-MACHINE"]]'

  # Group all selected modes by Unity version. Each version pays checkout,
  # provisioning, organization-lock acquisition, and central cleanup once while
  # each mode retains its own activation, project, results, verification, and artifacts.

  unity-tests:
    name: Compatibility Unity ${{ matrix.unity-version }} (selected modes)
    needs:
      - matrix-config
      - runner-preflight
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected && !cancelled() &&
        !(github.event_name == 'workflow_dispatch' && '' != '') &&
        (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'push' || github.ref_protected) &&
        needs.matrix-config.result == 'success' &&
        needs.runner-preflight.result == 'success' &&
        needs.matrix-config.outputs.test-modes != '[]' &&
        needs.matrix-config.outputs.superseded != 'true'
      }}
    runs-on: [self-hosted, Windows, RAM-64GB, DAD-MACHINE]
    timeout-minutes: 1200
    strategy:
      max-parallel: 1
      # A sibling may hold a Unity license, so matrix failures must never cancel
      # another leg before its license-return and lock-release cleanup completes.
      fail-fast: false
      # Keep one runner available for new fast validation.
      # The enrollment audit proves the editor gate and central return pin the
      # same version per leg when each axis is static text. Exclusions only
      # remove complete legs; they preserve that proof for every selected leg.
      # Keep the declared universe aligned with .github/unity-versions.json.
      matrix:
        unity-version:
          - 2021.3.45f1
          - 2022.3.45f1
          - 6000.5.2f1
          - 6000.6.0f1
        exclude: ${{ fromJSON(needs.matrix-config.outputs.unity-exclusions) }}
    steps:
      - name: Require current PR head before setup
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Require manually installed Unity editor
        id: ensure_unity_editor
        timeout-minutes: 10
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/ensure-unity-editor@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          unity-version: ${{ matrix.unity-version }}
          install-root: ${{ runner.tool_cache }}\u6-v3
          # Each version job can execute standalone tests, so verify the IL2CPP
          # player module once before any selected mode starts.
          provisioning-profile: StandaloneWindowsIl2Cpp
          diagnostics-path: unity-editor-check.json
          ci-managed-only: true
          require-healthy-existing: true

      - name: Enable Git long paths
        shell: powershell
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        run: git config --global core.longpaths true

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
        with:
          persist-credentials: false

      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tools

      - name: Print runner diagnostics
        # Composite action runs PowerShell internally; `shell: bash` on a
        # self-hosted Windows runner can resolve to the WSL stub at
        # C:\Windows\System32\bash.exe and fail with "Windows Subsystem
        # for Linux has no installed distributions." Never use plain
        # `shell: bash` on self-hosted Windows runners.
        uses: ./.github/actions/print-self-hosted-runner-diagnostics
        with:
          matrix-note: "default (organization lock wraps the Unity section)"

      - name: Validate Unity license secrets
        uses: ./.github/actions/validate-unity-license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require current PR head before lock acquisition
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Acquire organization Unity lock
        id: unity_lock
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/acquire-build-lock@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}
          runner-id: ${{ runner.name }}
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          timeout-minutes: "300"
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Require organization Unity lock acquisition
        id: require_unity_lock
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          ACQUIRED: ${{ steps.unity_lock.outputs.acquired }}
        run: |
          if ($env:ACQUIRED -ne 'true') {
            throw 'The organization Unity lock was not acquired; selected modes cannot be waived.'
          }

      - name: Run Unity modes concurrently
        id: run_modes
        if: >-
          ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || ('none' == 'none' && !false && !false &&
          !false)) && steps.unity_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: 35
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
          UH_NATIVE_ALLOCATOR_DIAGNOSTICS: ${{ startsWith(matrix.unity-version, '6000.') && '1' || '' }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/uh-gitconfig
          UH_PARALLEL_ASSEMBLY_PROFILES: ${{ needs.matrix-config.outputs.integration-assembly-profiles }}
          UH_PARALLEL_SELECTED_MODES: ${{ needs.matrix-config.outputs.test-modes }}
          UH_COMBINE_LATEST: ${{ github.event_name != 'pull_request' && needs.matrix-config.outputs.combine-variants == 'true' && matrix.unity-version == '6000.6.0f1' }}
          UH_PARALLEL_SINGLE_THREADED_SELECTED_MODES: ${{ github.event_name == 'pull_request' && needs.matrix-config.outputs.test-modes || '["editmode","playmode","standalone"]' }}
          UH_PARALLEL_SINGLE_THREADED_ASSEMBLY_PROFILES: ${{ needs.matrix-config.outputs.core-assembly-profiles }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/unity/assert-no-active-unity-editor.ps1
          $variant = @()
          if ($env:UH_COMBINE_LATEST -eq 'true') { $variant += '--with-single-threaded' }
          uv run --project scripts/python~ --locked --no-dev python scripts/unity/run_ci_modes.py --version '${{ matrix.unity-version }}' `
            --editmode-shards 2 --max-workers 5 --timeout-seconds 1860 @variant
          if ($LASTEXITCODE -ne 0) { throw 'One or more concurrent Unity modes failed.' }
          ./scripts/unity/assert-no-active-unity-editor.ps1

      - name: Run EditMode tests
        id: run_editmode
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') }}
        continue-on-error: true
        # Per-mode timeout, sized from measurement rather than fear. Across the 60
        # most recent Unity Tests runs (~430 leg instances) the slowest this step
        # has EVER been is 9.1 min (editmode), with standalone topping out at
        # 8.7 min. 40/60 keeps >4x headroom over that worst case -- enough for a
        # cold import on a fresh runner -- while cutting what a HANG costs: a
        # 91-minute wait has been measured behind a stuck licensed leg, so an
        # oversized step clock strands one runner and delays queued organization
        # work. Standalone keeps the larger
        # budget because it also builds an IL2CPP player. Both stay under the job
        # timeout (1200) so workflow cleanup can release or quarantine the seat.
        timeout-minutes: 40
        shell: pwsh
        env:
          UH_CONCURRENT_RUN: >-
            ${{ (github.event_name != 'workflow_dispatch' || ('none' == 'none' && !false && !false &&
            !false)) }}
          UH_MODE_CONTROLLER_OUTCOME: ${{ steps.run_modes.outcome }}
          UH_MODE_OUTCOME: ${{ steps.run_modes.outputs.editmode }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.editmode-integration-assemblies }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          # Stream per-test results to unity.log as each test finishes (editor-side
          # CiTestResultStreamLogger). When a PlayMode run aborts/reloads mid-run and
          # serializes a misleading total=0 results.xml, the streamed lines still name
          # the last test that ran -- the key to diagnosing the total=0 legs.
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UH_CONCURRENT_RUN -eq 'true') {
            if ($env:UH_MODE_CONTROLLER_OUTCOME -cne 'success' -or $env:UH_MODE_OUTCOME -cne 'success') {
              throw 'The concurrent editmode worker did not succeed.'
            }
            Write-Host 'The concurrent editmode worker completed; native results are verified below.'
            exit 0
          }
          ./scripts/unity/assert-no-active-unity-editor.ps1
          # -ProjectRoot puts the generated project and its Library OUTSIDE
          # $GITHUB_WORKSPACE. actions/checkout runs `git clean -ffdx` at the top of
          # every job and `-x` means gitignored, so while the project lived under
          # .artifacts/ every job deleted the Library the previous job had just built
          # on that same disk -- and the repo paid an actions/cache round trip to put
          # it back (measured across the 60 most recent runs: 109 min of restore
          # and 119 min of save on licensed self-hosted runner time).
          # RUNNER_WORKSPACE is the checkout's parent, which git clean cannot reach.
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'editmode' `
            -IsolateCompilationFixtures `
            -ShareEditorProject `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-editmode' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration 'Release'

      - name: Capture native exit diagnostics
        id: native_capture
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch' && false
          && matrix.unity-version == '6000.6.0f1' && steps.unity_lock.outputs.acquired == 'true'
          && steps.run_editmode.outcome == 'success' }}
        timeout-minutes: 30
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.editmode-integration-assemblies }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_STREAM_TEST_RESULTS: "1"
          UH_COMPARE_LOADER_SNAPS: ${{ false }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/unity/lib/project-workspace.ps1
          . ./scripts/unity/lib/test-framework-evidence.ps1
          $workspace = Resolve-UnityProjectWorkspace -RepoRoot $env:GITHUB_WORKSPACE `
            -Version '${{ matrix.unity-version }}' -Mode editmode -ShareEditorProject `
            -PersistentRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -GenerationFingerprint (Get-UnityTestFrameworkProjectFingerprint -Root $env:GITHUB_WORKSPACE)
          $captureTimeout = if ($env:UH_COMPARE_LOADER_SNAPS -eq 'true') { 300 } else { 600 }
          ./scripts/unity/capture-native-fault.ps1 -EditorPath $env:UNITY_EDITOR_PATH `
            -ProjectPath $workspace.ProjectPath -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-editmode/native-diagnostics' `
            -CompareLoaderSnaps:($env:UH_COMPARE_LOADER_SNAPS -eq 'true') -TimeoutSeconds $captureTimeout

      - name: Restore native loader-snaps comparison
        if: >-
          ${{ always() && github.event_name == 'workflow_dispatch' && false
          && matrix.unity-version == '6000.6.0f1' && steps.unity_lock.outputs.acquired == 'true'
          && steps.native_capture.outcome != '' && steps.native_capture.outcome != 'skipped' }}
        shell: pwsh
        run: |
          ./scripts/unity/restore-native-loader-snaps.ps1 -Apply `
            -LeasePath '.artifacts/unity/${{ matrix.unity-version }}-editmode/native-diagnostics/loader-flag-lease.json'

      - name: Require current PR head before PlayMode
        id: playmode_head
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Run PlayMode tests
        id: run_playmode
        if: >-
          ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true'
          && steps.playmode_head.outcome == 'success' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        continue-on-error: true
        timeout-minutes: 40
        shell: pwsh
        env:
          UH_CONCURRENT_RUN: >-
            ${{ (github.event_name != 'workflow_dispatch' || ('none' == 'none' && !false && !false &&
            !false)) }}
          UH_MODE_CONTROLLER_OUTCOME: ${{ steps.run_modes.outcome }}
          UH_MODE_OUTCOME: ${{ steps.run_modes.outputs.playmode }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.playmode-integration-assemblies }}
          EDITMODE_OUTCOME: ${{ steps.run_editmode.outcome }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UH_CONCURRENT_RUN -eq 'true') {
            if ($env:UH_MODE_CONTROLLER_OUTCOME -cne 'success' -or $env:UH_MODE_OUTCOME -cne 'success') {
              throw 'The concurrent playmode worker did not succeed.'
            }
            Write-Host 'The concurrent playmode worker completed; native results are verified below.'
            exit 0
          }
          ./scripts/unity/assert-no-active-unity-editor.ps1
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'playmode' `
            -ShareEditorProject:($env:EDITMODE_OUTCOME -eq 'success') `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-playmode' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -Il2CppCompilerConfiguration 'Release'

      - name: Require current PR head before Standalone
        id: standalone_head
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Run Standalone tests
        id: run_standalone
        if: >-
          ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true'
          && steps.standalone_head.outcome == 'success' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 60
        shell: pwsh
        env:
          UH_CONCURRENT_RUN: >-
            ${{ (github.event_name != 'workflow_dispatch' || ('none' == 'none' && !false && !false &&
            !false)) }}
          UH_MODE_CONTROLLER_OUTCOME: ${{ steps.run_modes.outcome }}
          UH_MODE_OUTCOME: ${{ steps.run_modes.outputs.standalone }}
          UH_NATIVE_ALLOCATOR_DIAGNOSTICS: ${{ startsWith(matrix.unity-version, '6000.') && '1' || '' }}
          UH_FORCE_FRESH_COMPILATION_CACHE: ${{ github.event_name == 'workflow_dispatch' && false && 'true' || 'false' }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_TEST_ASSEMBLIES: ${{ needs.matrix-config.outputs.standalone-integration-assemblies }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: "!Performance;!Stress"
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UH_CONCURRENT_RUN -eq 'true') {
            if ($env:UH_MODE_CONTROLLER_OUTCOME -cne 'success' -or $env:UH_MODE_OUTCOME -cne 'success') {
              throw 'The concurrent standalone worker did not succeed.'
            }
            Write-Host 'The concurrent standalone worker completed; native results are verified below.'
            exit 0
          }
          ./scripts/unity/assert-no-active-unity-editor.ps1
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'standalone' `
            -ForceFreshCompilationCache:($env:UH_FORCE_FRESH_COMPILATION_CACHE -eq 'true') `
            -AssemblyNames $env:UH_TEST_ASSEMBLIES `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-standalone' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -IncludeIntegrations `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -ManagedStrippingLevel 'High' `
            -Il2CppCompilerConfiguration 'Release'

      - name: Setup Node.js for WProto native acceptance
        id: acceptance_node
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
          && ('none' == 'wproto' || (false
          && 'all' == 'standalone' && 'none' == 'none' && matrix.unity-version == '6000.6.0f1'))
          && (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.6.0f1')
          && steps.unity_lock.outputs.acquired == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Setup Python for Standalone build diagnostics
        id: native_build_python
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch' && false
          && 'all' == 'standalone' && 'none' == 'none'
          && matrix.unity-version == '6000.6.0f1' && steps.unity_lock.outputs.acquired == 'true'
          && steps.run_standalone.outcome == 'success' }}
        uses: ./.github/actions/setup-python-tools

      - name: Capture Standalone build diagnostics
        id: native_build_capture
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch' && false
          && 'all' == 'standalone' && 'none' == 'none'
          && matrix.unity-version == '6000.6.0f1' && steps.unity_lock.outputs.acquired == 'true'
          && steps.run_standalone.outcome == 'success'
          && steps.native_build_python.outcome == 'success' && steps.acceptance_node.outcome == 'success' }}
        timeout-minutes: 55
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_PERF_COMMIT: ${{ github.sha }}
          UH_PERF_BASE_COMMIT: ${{ github.sha }}
          UH_PERF_OPTIMIZATION: "Release"
          UH_NATIVE_BUILD_CAPTURE_MODE: ${{ false && 'Direct' || 'Debugger' }}
          UH_NATIVE_DEBUGGER_STANDARD_HEAP: ${{ false }}
          UH_NATIVE_ATTACH_CONTROL: ${{ false }}
          UH_NATIVE_ATTACH_AFTER_STARTUP: ${{ false }}
          UH_NATIVE_ATTACH_AFTER_SHUTDOWN: ${{ false }}
        run: |
          ./scripts/unity/run-acceptance.ps1 `
            -Acceptance 'wproto' -UnityVersion '6000.6.0f1' `
            -StandaloneBuildCapture $env:UH_NATIVE_BUILD_CAPTURE_MODE `
            -StandaloneBuildCaptureBackend 'IL2CPP' `
            -StandaloneBuildDebuggerStandardHeap:($env:UH_NATIVE_DEBUGGER_STANDARD_HEAP -eq 'true') `
            -StandaloneBuildAttachToDirect:($env:UH_NATIVE_ATTACH_CONTROL -eq 'true') `
            -StandaloneBuildAttachAfterStartup:($env:UH_NATIVE_ATTACH_AFTER_STARTUP -eq 'true') `
            -StandaloneBuildAttachAfterShutdown:($env:UH_NATIVE_ATTACH_AFTER_SHUTDOWN -eq 'true') `
            -ArtifactsPath '.artifacts/unity/6000.6.0f1-standalone/build-only-diagnostics' `
            -TemporaryRoot $env:RUNNER_TEMP

      - name: Run additional native acceptance
        id: run_acceptance
        # Acceptance runs once per version after the selected test modes. The
        # version job's editor gate already verifies StandaloneWindowsIl2Cpp.
        if: >-
          ${{ !cancelled() && github.event_name == 'workflow_dispatch'
          && 'none' != '' && 'none' != 'none'
          && (('none' != 'nullableconsumer' && 'none' != 'wproto')
          || matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.6.0f1')
          && ('none' != 'wproto' || steps.acceptance_node.outcome == 'success')
          && steps.unity_lock.outputs.acquired == 'true' }}
        continue-on-error: true
        timeout-minutes: ${{ 'none' == 'wproto' && 150 || 120 }}
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_UNITY_TEST_CATEGORY: ""
          UH_STREAM_TEST_RESULTS: "1"
          UH_PERF_COMMIT: ${{ github.sha }}
          UH_PERF_BASE_COMMIT: ${{ github.sha }}
          UH_PERF_OPTIMIZATION: "Release"
          UH_PERF_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && 'none' == 'intmap' && false && '1' || '' }}
          UH_ACCEPTANCE: ${{ 'none' }}
          UH_UNITY_VERSION: ${{ matrix.unity-version }}
        run: |
          ./scripts/unity/run-acceptance.ps1 `
            -Acceptance $env:UH_ACCEPTANCE `
            -UnityVersion $env:UH_UNITY_VERSION `
            -ArtifactsPath ".artifacts/unity/$env:UH_UNITY_VERSION-acceptance" `
            -TemporaryRoot $env:RUNNER_TEMP

      - name: Require current PR head before WProto-only Standalone
        id: proto_only_head
        if: ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-current-pr-head@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          github-token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Run WProto-only Standalone tests
        id: run_proto_only
        if: >-
          ${{ !cancelled() && steps.unity_lock.outputs.acquired == 'true'
          && steps.proto_only_head.outcome == 'success' && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 60
        shell: pwsh
        env:
          UH_CONCURRENT_RUN: >-
            ${{ (github.event_name != 'workflow_dispatch' || ('none' == 'none' && !false && !false &&
            !false)) }}
          UH_MODE_CONTROLLER_OUTCOME: ${{ steps.run_modes.outcome }}
          UH_MODE_OUTCOME: ${{ steps.run_modes.outputs.proto_only }}
          UH_FORCE_FRESH_COMPILATION_CACHE: ${{ github.event_name == 'workflow_dispatch' && false && 'true' || 'false' }}
          UNITY_EDITOR_PATH: ${{ steps.ensure_unity_editor.outputs.editor-path }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_ACCELERATOR_ENDPOINT: ${{ secrets.UNITY_ACCELERATOR_ENDPOINT }}
          UH_CENTRAL_LICENSE_RETURN: "true"
          UH_STREAM_TEST_RESULTS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UH_CONCURRENT_RUN -eq 'true') {
            if ($env:UH_MODE_CONTROLLER_OUTCOME -cne 'success' -or $env:UH_MODE_OUTCOME -cne 'success') {
              throw 'The concurrent proto_only worker did not succeed.'
            }
            Write-Host 'The concurrent proto_only worker completed; native results are verified below.'
            exit 0
          }
          ./scripts/unity/assert-no-active-unity-editor.ps1
          ./scripts/unity/run-ci-tests.ps1 `
            -UnityVersion '${{ matrix.unity-version }}' `
            -TestMode 'standalone' `
            -ForceFreshCompilationCache:($env:UH_FORCE_FRESH_COMPILATION_CACHE -eq 'true') `
            -AssemblyNames 'WallstopStudios.UnityHelpers.Tests.ProtoOnly' `
            -ArtifactsPath '.artifacts/unity/${{ matrix.unity-version }}-standalone-proto-only' `
            -ProjectRoot (Join-Path $env:RUNNER_WORKSPACE 'unity-workspace') `
            -ProjectScope 'proto-only' `
            -AdditionalScriptingDefines WALLSTOP_PROTO_ONLY `
            -ReleaseCodeOptimization `
            -ReleasePlayerBuild `
            -ManagedStrippingLevel 'High' `
            -Il2CppCompilerConfiguration 'Release'

      - name: Return Unity license
        id: return_unity_license
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/return-unity-license@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          unity-version: ${{ matrix.unity-version }}
          tool-cache: ${{ runner.tool_cache }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          evidence-suffix: tests

      - name: Classify Unity cleanup evidence
        id: cleanup_classification
        if: ${{ always() && steps.unity_lock.outputs.acquired == 'true' }}
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/classify-unity-cleanup-evidence@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          return-log-path: ${{ steps.return_unity_license.outputs.return-log-path }}
          return-command-completed: ${{ steps.return_unity_license.outputs.return-command-completed }}
          return-exit-code: ${{ steps.return_unity_license.outputs.return-exit-code }}
          evidence-capture-complete: ${{ steps.return_unity_license.outputs.evidence-capture-complete }}
          return-log-digest: ${{ steps.return_unity_license.outputs.return-log-digest }}

      - name: Release organization Unity lock
        id: release_unity_lock
        if: always()
        timeout-minutes: 5
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/release-build-lock@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          lock-name: wallstop-organization-builds
          holder-id-suffix: ${{ matrix.unity-version }}
          runner-id: ${{ runner.name }}
          resource-cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          resource-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          resource-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}

      - name: Report slowest EditMode tests
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-editmode/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Report slowest PlayMode tests
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-playmode/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Report slowest Standalone tests
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        shell: pwsh
        run: |
          $results = '.artifacts/unity/${{ matrix.unity-version }}-standalone/results.xml'
          if (Test-Path -LiteralPath $results) {
            ./scripts/unity/report-slow-tests.ps1 -ResultsPath $results -Top 30 -FixtureBudgetSeconds 120 -StepSummary
          } else {
            Write-Host "::notice::No results.xml at $results to report slow tests."
          }

      - name: Dump EditMode log tail on failure
        if: >-
          ${{ steps.checkout.outcome == 'success' && (always()
          && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode')
          && steps.run_editmode.outcome != 'success' && steps.run_editmode.outcome != 'skipped') }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode

      - name: Dump PlayMode log tail on failure
        if: >-
          ${{ steps.checkout.outcome == 'success' && (always()
          && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode')
          && steps.run_playmode.outcome != 'success' && steps.run_playmode.outcome != 'skipped') }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode

      - name: Dump Standalone log tail on failure
        if: >-
          ${{ steps.checkout.outcome == 'success' && (always()
          && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone')
          && steps.run_standalone.outcome != 'success' && steps.run_standalone.outcome != 'skipped') }}
        uses: ./.github/actions/dump-unity-log-tail
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone

      - name: Verify EditMode tests actually ran
        id: verify_editmode
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') && steps.run_editmode.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-editmode
          label: Unity ${{ matrix.unity-version }} editmode
          expected-empty: false
          required-compilation-fixture: WallstopStudios.UnityHelpers.Tests.Tools.OdinMigration.OdinMigrationDictionaryCompilationTests
          unity-version: ${{ matrix.unity-version }}

      - name: Verify PlayMode tests actually ran
        id: verify_playmode
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') && steps.run_playmode.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-playmode
          label: Unity ${{ matrix.unity-version }} playmode
          expected-empty: false

      - name: Verify Standalone tests actually ran
        id: verify_standalone
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && steps.run_standalone.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone
          label: Unity ${{ matrix.unity-version }} standalone
          expected-empty: false

      - name: Setup Node.js for native acceptance verification
        if: always()
        timeout-minutes: 2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"

      - name: Redact credentials from EditMode artifacts
        id: redact_editmode
        if: ${{ steps.checkout.outcome == 'success' && always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: |
            .artifacts/unity/${{ matrix.unity-version }}-editmode
            .artifacts/unity/${{ matrix.unity-version }}-e1

      - name: Upload EditMode artifacts
        id: upload_editmode
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') && steps.redact_editmode.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unity-${{ matrix.unity-version }}-editmode
          path: .artifacts/unity/${{ matrix.unity-version }}-editmode
          if-no-files-found: warn
          retention-days: 14

      - name: Upload separate EditMode shard artifacts
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'editmode') && steps.redact_editmode.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unity-${{ matrix.unity-version }}-editmode-shard
          path: .artifacts/unity/${{ matrix.unity-version }}-e1
          if-no-files-found: warn
          retention-days: 14

      - name: Redact credentials from PlayMode artifacts
        id: redact_playmode
        if: ${{ steps.checkout.outcome == 'success' && always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-playmode

      - name: Upload PlayMode artifacts
        id: upload_playmode
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'playmode') && steps.redact_playmode.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unity-${{ matrix.unity-version }}-playmode
          path: .artifacts/unity/${{ matrix.unity-version }}-playmode
          if-no-files-found: warn
          retention-days: 14

      - name: Redact credentials from Standalone artifacts
        id: redact_standalone
        if: ${{ steps.checkout.outcome == 'success' && always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-standalone

      - name: Upload Standalone artifacts
        id: upload_standalone
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && steps.redact_standalone.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unity-${{ matrix.unity-version }}-standalone
          path: .artifacts/unity/${{ matrix.unity-version }}-standalone
          if-no-files-found: warn
          retention-days: 14

      - name: Verify WProto-only Standalone tests actually ran
        id: verify_proto_only
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && steps.run_proto_only.outcome != 'skipped' }}
        continue-on-error: true
        uses: ./.github/actions/verify-unity-results
        with:
          results-dir: .artifacts/unity/${{ matrix.unity-version }}-standalone-proto-only
          label: Unity ${{ matrix.unity-version }} WProto-only standalone
          required-test-name: WallstopStudios.UnityHelpers.Tests.Serialization.WProtoOnlyModeTests.MissingFormatterCannotReachTheLegacyBackend
          expected-empty: false

      - name: Redact credentials from WProto-only Standalone artifacts
        id: redact_proto_only
        if: ${{ steps.checkout.outcome == 'success' && always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-standalone-proto-only

      - name: Upload WProto-only Standalone artifacts
        id: upload_proto_only
        if: ${{ always() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') && steps.redact_proto_only.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unity-${{ matrix.unity-version }}-standalone-proto-only
          path: .artifacts/unity/${{ matrix.unity-version }}-standalone-proto-only
          if-no-files-found: error
          retention-days: 14

      - name: Require WProto-only Standalone acceptance
        if: ${{ always() && !cancelled() && contains(fromJSON(needs.matrix-config.outputs.test-modes), 'standalone') }}
        shell: pwsh
        env:
          SELECTED_MODES: '["standalone"]'
          EDITMODE_RUN: "skipped"
          EDITMODE_VERIFY: "skipped"
          EDITMODE_REDACT: "skipped"
          EDITMODE_UPLOAD: "skipped"
          PLAYMODE_RUN: "skipped"
          PLAYMODE_VERIFY: "skipped"
          PLAYMODE_REDACT: "skipped"
          PLAYMODE_UPLOAD: "skipped"
          STANDALONE_RUN: ${{ steps.run_proto_only.outcome }}
          STANDALONE_VERIFY: ${{ steps.verify_proto_only.outcome }}
          STANDALONE_REDACT: ${{ steps.redact_proto_only.outcome }}
          STANDALONE_UPLOAD: ${{ steps.upload_proto_only.outcome }}
        run: uv run --quiet --project scripts/python~ --locked --no-dev python scripts/unity/assert_test_mode_outcomes.py

      - name: Verify additional native acceptance
        id: verify_acceptance
        if: >-
          ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && 'none' != '' && 'none' != 'none'
          && (('none' != 'nullableconsumer' && 'none' != 'wproto') || matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.6.0f1') }}
        continue-on-error: true
        shell: pwsh
        env:
          UH_ACCEPTANCE: ${{ 'none' }}
          UH_UNITY_VERSION: ${{ matrix.unity-version }}
          UH_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/unity/verify-acceptance.ps1 `
            -Acceptance $env:UH_ACCEPTANCE `
            -ArtifactsPath ".artifacts/unity/$env:UH_UNITY_VERSION-acceptance" `
            -Commit $env:UH_COMMIT `
            -UnityVersion $env:UH_UNITY_VERSION

      - name: Redact credentials from acceptance artifacts
        id: redact_acceptance
        if: >-
          ${{ steps.checkout.outcome == 'success' && (always()
          && github.event_name == 'workflow_dispatch'
          && 'none' != '' && 'none' != 'none'
          && (('none' != 'nullableconsumer' && 'none' != 'wproto') || matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.6.0f1')) }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/redact-unity-artifacts
        with:
          paths: .artifacts/unity/${{ matrix.unity-version }}-acceptance

      - name: Reverify retained WProto evidence after redaction
        id: reverify_wproto_acceptance
        if: >-
          ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && 'none' == 'wproto'
          && (matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.6.0f1') && steps.redact_acceptance.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          UH_UNITY_VERSION: ${{ matrix.unity-version }}
          UH_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/unity/verify-acceptance.ps1 `
            -Acceptance 'wproto' `
            -ArtifactsPath ".artifacts/unity/$env:UH_UNITY_VERSION-acceptance" `
            -Commit $env:UH_COMMIT `
            -UnityVersion $env:UH_UNITY_VERSION

      - name: Upload acceptance artifacts
        id: upload_acceptance
        if: >-
          ${{ always() && github.event_name == 'workflow_dispatch'
          && 'none' != '' && 'none' != 'none'
          && (('none' != 'nullableconsumer' && 'none' != 'wproto')
          || matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.6.0f1')
          && steps.redact_acceptance.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unity-${{ matrix.unity-version }}-acceptance
          path: |
            .artifacts/unity/${{ matrix.unity-version }}-acceptance
            ${{ 'none' == 'wproto' && steps.reverify_wproto_acceptance.outcome != 'success' && '!**/corpus-summary.json' || '' }}
          if-no-files-found: error
          retention-days: 30

      - name: Require requested native acceptance
        if: >-
          ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && 'none' != '' && 'none' != 'none'
          && (('none' != 'nullableconsumer' && 'none' != 'wproto') || matrix.unity-version == '2021.3.45f1' || matrix.unity-version == '6000.6.0f1') }}
        shell: pwsh
        env:
          UH_ACCEPTANCE: ${{ 'none' }}
          ACCEPTANCE_REVERIFY: ${{ steps.reverify_wproto_acceptance.outcome }}
          ACCEPTANCE_RUN: ${{ steps.run_acceptance.outcome }}
          ACCEPTANCE_VERIFY: ${{ steps.verify_acceptance.outcome }}
          ACCEPTANCE_REDACT: ${{ steps.redact_acceptance.outcome }}
          ACCEPTANCE_UPLOAD: ${{ steps.upload_acceptance.outcome }}
        run: |
          if ($env:UH_ACCEPTANCE -eq 'wproto' -and $env:ACCEPTANCE_REVERIFY -ne 'success') {
            throw "WProto post-redaction verification was $env:ACCEPTANCE_REVERIFY."
          }
          foreach ($stage in @('RUN', 'VERIFY', 'REDACT', 'UPLOAD')) {
            $outcome = [Environment]::GetEnvironmentVariable("ACCEPTANCE_$stage")
            if ($outcome -ne 'success') { throw "Native acceptance $stage was $outcome." }
          }

      - name: Require every selected Unity mode
        id: require_selected_modes
        # Each version job owns every selected mode. The shared assertion fails
        # closed if any selected run, verification, redaction, or upload failed.
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        env:
          SELECTED_MODES: ${{ needs.matrix-config.outputs.test-modes }}
          EDITMODE_RUN: ${{ steps.run_editmode.outcome }}
          EDITMODE_VERIFY: ${{ steps.verify_editmode.outcome }}
          EDITMODE_REDACT: ${{ steps.redact_editmode.outcome }}
          EDITMODE_UPLOAD: ${{ steps.upload_editmode.outcome }}
          PLAYMODE_RUN: ${{ steps.run_playmode.outcome }}
          PLAYMODE_VERIFY: ${{ steps.verify_playmode.outcome }}
          PLAYMODE_REDACT: ${{ steps.redact_playmode.outcome }}
          PLAYMODE_UPLOAD: ${{ steps.upload_playmode.outcome }}
          STANDALONE_RUN: ${{ steps.run_standalone.outcome }}
          STANDALONE_VERIFY: ${{ steps.verify_standalone.outcome }}
          STANDALONE_REDACT: ${{ steps.redact_standalone.outcome }}
          STANDALONE_UPLOAD: ${{ steps.upload_standalone.outcome }}
        run: uv run --quiet --project scripts/python~ --locked --no-dev python scripts/unity/assert_test_mode_outcomes.py

      - name: Require confirmed Unity cleanup
        if: always()
        uses: Ambiguous-Interactive/ambiguous-organization-build-lock/.github/actions/require-confirmed-unity-cleanup@720ef47f9ab352fbc9403363ca63ae8c487a2442 # v1.18.1
        with:
          acquired: ${{ steps.unity_lock.outputs.acquired }}
          classification-complete: ${{ steps.cleanup_classification.outputs.classification-complete }}
          cleanup-status: ${{ steps.cleanup_classification.outputs.resource-cleanup-status }}
          cleanup-health: ${{ steps.cleanup_classification.outputs.resource-health }}
          cleanup-reason: ${{ steps.cleanup_classification.outputs.resource-reason }}
          release-outcome: ${{ steps.release_unity_lock.outcome }}
          cleanup-result: ${{ steps.release_unity_lock.outputs.cleanup-result }}
          released: ${{ steps.release_unity_lock.outputs.released }}
          release-health: ${{ steps.release_unity_lock.outputs.resource-health }}
          release-reason: ${{ steps.release_unity_lock.outputs.resource-reason }}
          reservation-state: ${{ steps.release_unity_lock.outputs.reservation-state }}
          reservation-id: ${{ steps.release_unity_lock.outputs.reservation-id }}
          incident-id: ${{ steps.release_unity_lock.outputs.incident-id }}

  # SINGLE_THREADED leg. The default matrix never exercises the SINGLE_THREADED
  # code paths (Runtime/Core/DataStructure/Cache.cs et al. gate thread-safe vs
  # single-threaded behavior on `#if SINGLE_THREADED`, OFF by default). This job
  # builds+tests with SINGLE_THREADED (and WALLSTOP_CONCAVE_HULL_STATS) defined as
  # GLOBAL scripting symbols so EVERY asmdef test assembly compiles the
  # single-threaded path. Restricted to the latest Unity 6 (6000.6.0f1) across
  # EditMode, PlayMode, and Standalone. Core-only (no integrations): the
  # single-threaded toggle is a core-runtime concern. PR and push qualification
  # at the latest editor shares the normal job. Manual split controls and
  # diagnostic dispatches use this separate job with the same lock and gates.
  #
  # Queue this required coverage alongside the default matrix. Waiting for all
  # four editors let newer runs enter the shared fleet first; the single-threaded
  # queue grew by 36 minutes in session 260. The central lock and one runner per host still
  # limit simultaneous Unity work. A failed default tree may now also spend a
  # single-threaded job; final success still requires every licensed job.
  #
  # Reuses the same secrets gate, runner-preflight,
  # provisioning, perf-category exclusion, verify-results, and artifact-upload
  # scaffolding as unity-tests, with DISTINCT project/Library/artifact paths
  # (suffix `-single-threaded`) so its differently-compiled Library never collides
  # with or poisons the default matrix's `6000.6.0f1-{mode}` cache.

  unity-tests-aggregate:
    name: Unity Compatibility Success
    if: ${{ always() }}
    needs:
      - runner-preflight
      - unity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require Unity tests result
        shell: bash
        env:
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          UNITY_TESTS_RESULT: ${{ needs.unity-tests.result }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ "${FORK_PR}" = "true" ] || [ "${DEPENDABOT_PR}" = "true" ]; then
            test "${RUNNER_PREFLIGHT_RESULT}" = skipped
            test "${UNITY_TESTS_RESULT}" = skipped
          else
            test "${RUNNER_PREFLIGHT_RESULT}" = success
            test "${UNITY_TESTS_RESULT}" = success
          fi
