version: 2
updates:
  # GitHub Actions workflow updates.
  # `/` covers .github/workflows/**. Composite actions under .github/actions/*
  # pin third-party actions too, and a bare `/` does not reach them -- that left
  # .github/actions/return-unity-license/action.yml on an older central cleanup
  # classifier than the workflows, which fails the Unity lock contract because
  # the return action must delegate to the exact classifier the workflows use.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    assignees:
      - wallstop
    reviewers:
      - wallstop

  # NuGet: .csproj/props/targets and .config/dotnet-tools.json (local tools)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    assignees:
      - wallstop
    reviewers:
      - wallstop

  # npm/UPM: package.json at repo root (Unity package manifest)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      all-dependencies:
        patterns:
          - "*"
    assignees:
      - wallstop
    reviewers:
      - wallstop
