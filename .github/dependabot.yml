version: 2
updates:
  # GitHub Actions workflow updates.
  # `/` covers .github/workflows/**. Composite actions under .github/actions/*
  # pin third-party actions too, and a bare `/` does not reach them -- that left
  # .github/actions/return-unity-license/action.yml on an older central cleanup
  # classifier than the workflows, which fails the Unity lock contract because
  # the return action must delegate to the exact classifier the workflows use.
  #
  # The organization build-lock actions are grouped SEPARATELY from everything
  # else. They gate the Unity legs, and Dependabot's own runs carry no
  # organization secrets, so `matrix-config` skips every licensed tier and the
  # legs never execute -- #334 reported 42 green checks while carrying a bump
  # that reddens all twelve of them (#356). Grouped together, one unverifiable
  # build-lock bump holds every routine third-party bump hostage indefinitely,
  # because each rebase re-proposes it. Split, the third-party PR is decided by
  # CI that actually ran, and the build-lock PR is the one a human must re-run
  # on a credentialed branch before merging.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      organization-build-lock:
        patterns:
          - "Ambiguous-Interactive/ambiguous-organization-build-lock*"
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Ambiguous-Interactive/ambiguous-organization-build-lock*"
    assignees:
      - wallstop
    reviewers:
      - wallstop

  # NuGet: .csproj/props/targets and .config/dotnet-tools.json (local tools)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    assignees:
      - wallstop
    reviewers:
      - wallstop

  # npm/UPM: package.json at repo root (Unity package manifest)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      all-dependencies:
        patterns:
          - "*"
    assignees:
      - wallstop
    reviewers:
      - wallstop
