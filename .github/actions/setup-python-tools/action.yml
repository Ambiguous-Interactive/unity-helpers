name: Setup Python tooling
description: Install the reviewed Python and uv versions for locked repository scripts.
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.11"
    - name: Install uv
      shell: pwsh
      run: python -m pip install --disable-pip-version-check uv==0.13.6
